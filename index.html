<style>
/* Morandi: low chroma, high value, everything pulled toward a shared warm grey.
   Light and papery, in the manner of A Little to the Left. */
:root{
  --paper:#E4DACA; --paper2:#D5C9B5; --card:#EFE8DA;
  --ink:#4A4238; --ink2:#6E6455; --ink3:#948871;
  --line:rgba(74,66,56,.18);
  --ochre:#BE9F63; --clay:#B08C74; --sage:#8D9C88;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#CFC3AE;color:var(--ink);
  font-family:var(--sans);-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:flex;justify-content:center;align-items:stretch}
#stage{display:block;touch-action:none}

.col{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;pointer-events:none}
.col>*{pointer-events:auto}

#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top,0px) + 11px) 12px 0;font-size:calc(12.5px*var(--ui,1))}
.pill{background:rgba(252,248,240,.7);border:1px solid var(--line);
  border-radius:999px;padding:6px 11px;letter-spacing:.02em;white-space:nowrap;color:var(--ink2);cursor:pointer;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill b{font-weight:650;color:var(--ink)}
#tabs{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;gap:4px;background:rgba(252,248,240,.82);
  border:1px solid var(--line);border-radius:999px;padding:4px;
  box-shadow:0 4px 18px rgba(90,78,62,.12);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .28s}
#tabs button{font:inherit;font-size:calc(13.5px*var(--ui,1));color:var(--ink3);background:none;border:0;
  padding:10px 22px;border-radius:999px;cursor:pointer;transition:.18s}
#tabs button.on{background:var(--ink);color:#F3EDE1;font-weight:600}

#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);
  text-align:center;padding:0 24px;font-size:calc(13.5px*var(--ui,1));color:var(--ink2);
  transition:opacity .3s;line-height:1.45}
#hint i{font-style:normal;color:#9A7B3E;font-weight:600}

#toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
  font-family:var(--serif);font-size:calc(16px*var(--ui,1));text-align:center;opacity:0;color:var(--ink);
  transition:opacity .4s;pointer-events:none;padding:11px 20px;line-height:1.4;
  background:rgba(247,242,232,.92);border:1px solid var(--line);border-radius:12px;
  max-width:84%;box-shadow:0 6px 22px rgba(90,78,62,.14)}

.sheet{position:absolute;left:0;right:0;bottom:0;padding:24px 22px calc(env(safe-area-inset-bottom,0px) + 20px);
  background:linear-gradient(to top,var(--card) 34%,rgba(239,232,218,.86) 72%,rgba(239,232,218,0));
  transform:translateY(102%);transition:transform .42s cubic-bezier(.2,.9,.25,1);text-align:center}
.sheet.up{transform:translateY(0)}
.rar{font-size:calc(10.5px*var(--ui,1));letter-spacing:.22em;text-transform:uppercase;color:var(--ink3)}
.nm{font-family:var(--serif);font-size:calc(25px*var(--ui,1));margin:6px 0 2px;line-height:1.15;color:var(--ink)}
.mu{font-size:calc(11.5px*var(--ui,1));letter-spacing:.14em;text-transform:uppercase;color:#9A7B3E;margin-bottom:6px}
.pm{font-family:var(--serif);font-style:italic;font-size:calc(14.5px*var(--ui,1));color:var(--ink2);margin:0 0 17px;line-height:1.45}
.btns{display:flex;gap:9px}
button.act{flex:1;font:inherit;font-size:calc(13.5px*var(--ui,1));font-weight:600;padding:14px 8px;border-radius:13px;
  border:1px solid var(--line);background:rgba(255,253,248,.7);color:var(--ink);cursor:pointer;transition:.16s}
button.act:active{transform:scale(.97)}
button.act.hi{background:var(--ink);color:#F3EDE1;border-color:var(--ink)}
.new{display:inline-block;font-size:9.5px;letter-spacing:.16em;background:var(--ochre);color:#3A3024;
  border-radius:4px;padding:2px 6px;vertical-align:3px;margin-left:7px;font-weight:700}

#intro{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 20%,#EFE8DA,#D3C7B2 76%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:34px;gap:14px;transition:opacity .6s;color:var(--ink)}
#intro h1{font-family:var(--serif);font-weight:500;font-size:calc(38px*var(--ui,1));margin:0;line-height:1.08;letter-spacing:.01em}
#intro h1 span{display:block;font-size:13px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:14px;font-family:var(--sans)}
#intro p{font-family:var(--serif);font-style:italic;color:var(--ink2);max-width:19em;
  line-height:1.6;font-size:calc(15px*var(--ui,1));margin:2px 0 12px}
#intro button{font:inherit;font-size:calc(14.5px*var(--ui,1));font-weight:650;padding:14px 30px;border-radius:999px;
  border:0;background:var(--ink);color:#F3EDE1;cursor:pointer}
body.sheeting #tabs{opacity:0;pointer-events:none}
.gone{opacity:0;pointer-events:none!important}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>

<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div class="col">
    <div id="hud">
      <div class="pill" id="pMail">✉ <b>0</b></div>
      <div class="pill" id="pHarm">❀ ×1.0</div>
      <div class="pill" id="pStreak">✿ 1</div>
      <div class="pill" id="pTonic">✚ 1</div>
    </div>
    <nav id="tabs">
      <button data-s="table" class="on">Table</button>
      <button data-s="shelf">Sill</button>
      <button data-s="book">Book</button>
    </nav>
    <div id="hint"></div>
    <div id="toast"></div>
    <div class="sheet" id="sheet">
      <div class="rar" id="shRar">COMMON</div>
      <div class="nm" id="shName">—</div>
      <div class="mu" id="shMu"></div>
      <p class="pm" id="shPoem"></p>
      <div class="btns">
        <button class="act hi" id="bSill">Put on the sill</button>
        <button class="act" id="bBook">Press in the book</button>
      </div>
    </div>
  </div>
  <div id="intro">
    <h1><span>Parcel &amp; Petal</span>A stranger keeps<br>mailing you flowers</h1>
    <p>They arrive in containers that make no sense. Open them anyway.</p>
    <button id="bStart">Open the first parcel</button>
  </div>
</div>
<script>
'use strict';
/* ============================================================
   TUNING — everything addictive lives in this block.
   ============================================================ */
const CFG = {
  // --- the post ---
  parcelIntervalMs : 300 * 1000, // one parcel accrues this often while you are away
  parcelCap        : 5,          // accrual stops here, so nothing is ever "wasted"
  startParcels     : 3,

  // --- the life of a flower ---
  // Life is spent in PARCELS, so time away never consumes it. Only once a
  // flower is on its way out does the wall clock take over, and then only for
  // a short window. A fortnight away can cost you the few that were already
  // fading; it can never cost you the shelf.
  flowerLife       : 25,         // parcels a healthy flower lasts
  lifeSpread       : 0.22,       // +/- variance, so a sill does not expire in unison
  wiltHours        : 20,         // spent -> pressed into the book, preserved
  illHours         : 8,          // ill  -> dies, and is NOT preserved
  illChance        : 0.005,      // per healthy flower, per parcel opened
  wiltFloor        : 0.35,       // what a fading flower still contributes
  tonicChance      : 0.018,      // parcels holding a tonic
  tonicStart       : 1,
  pityAt           : 7,          // a Rare+ is guaranteed within this many opens
  curioChance      : 0.055,      // chance the parcel holds something that is not a flower
  bond             : {kin:0.12, counter:0.10, tone:0.09, echo:0.06}, // per bonded pair
  shelfAccord      : 0.10,       // a whole shelf of three, all bonded
  fullSill         : 0.10,       // every pot filled
  decorBonus       : 0.03,       // per ornament on the ledge
  decorChance      : 0.05,       // chance a parcel holds an ornament
  storyAt          : [2, 7, 14, 23, 34, 47], // opens at which the sender writes again
  harmonyCap       : 2.00,
  squeezeSeconds   : 1.15,       // hold-to-squeeze fill time (the "pressure" substitute)
  boil             : {fps: 8, frames: 3, amp: 0.95},  // hand-drawn line boil
  outlines         : false,      // painted shapes, not ink-and-wash
  lightAngle       : -2.2,       // where the light falls, in radians
};

/* ============================================================
   MORANDI PALETTE
   Giorgio Morandi's still lifes are all low chroma, high value, and
   pulled toward one shared warm grey. That last part is what makes a
   set of colours read as a family, so every colour in the game goes
   through mor() rather than being authored freely.
   ============================================================ */
const MOR = {
  paper : '#F1ECE0', card  : '#F8F4EA',
  wall  : '#E9E5D9', wallLo: '#D7D2C3',
  wood  : '#D2BD9A', woodLo: '#BFA883', woodDk: '#A88F6B',
  frame : '#C1AC8B', sill  : '#D0BB97',
  ink   : '#453E34', ink2  : '#6A6052', ink3  : '#948873',
  line  : 'rgba(69,62,52,.28)',
  soft  : 'rgba(69,62,52,.12)',
  ochre : '#C4A464', clay: '#BC9479', sage: '#96A691',
  glass : '#D8DEDA', bone: '#F4EDDF', kraft: '#E2D5B9', pewter: '#BCBDB5',
};
// Saturation and lightness envelopes. Nothing in the game is allowed
// out of these, which is what keeps the whole screen in one key.
/* GROUND — the room. Near-neutral and high-value, so it never competes. */
const G_S = [0, 15], G_L = [48, 95];
function mor(h, sat, lit, a = 1){
  const l = clamp(lit, G_L[0], G_L[1]);
  const s = clamp(sat * (0.6 + 0.4*l/100), G_S[0], G_S[1]);
  return hsl(h, s, l, a);
}
/* FIGURE — the flowers. Still Morandi, but allowed more chroma and a higher
   floor than the room, which is what buys separation without loudness. The
   chroma-falls-with-value rule stays, only gentler. */
const F_S = [11, 38], F_L = [46, 83];
function pet(h, sat, lit, a = 1){
  const l = clamp(lit, F_L[0], F_L[1]);
  const s = clamp(sat * (0.62 + 0.38*l/100), F_S[0], F_S[1]);
  return hsl(h, s, l, a);
}

/* ============================================================
   LINE BOIL
   Hand-drawn animation wobbles because each frame is redrawn by hand. Two
   things make it read as a hand rather than as noise:

   1. It is STEPPED. Real boil runs on 2s or 3s — eight drawings a second,
      not sixty. Perturbing every rendered frame looks like electrical
      interference; holding each perturbation for ~125ms looks drawn.
   2. It CYCLES a few fixed drawings. Three offsets per vertex, reused in
      order, so the eye reads "the same line, drawn again" rather than a
      line permanently crawling.

   So: a table of `frames` fixed offset sets, indexed by a clock that ticks
   at `fps`. Lookups are table reads, not trig, and return no objects —
   this runs a few thousand times a frame.
   ============================================================ */
const BOIL = { k: 0, on: true, tables: [] };
const BOIL_N = 1024;
let _bx = null, _by = null;
function makeBoil(){
  BOIL.on = !reduceMotion;
  const r = mulberry32(20260927);
  BOIL.tables = [];
  for (let f = 0; f < CFG.boil.frames; f++){
    const bx = new Float32Array(BOIL_N), by = new Float32Array(BOIL_N);
    for (let i = 0; i < BOIL_N; i++){ bx[i] = r()*2 - 1; by[i] = r()*2 - 1; }
    BOIL.tables.push([bx, by]);
  }
  _bx = BOIL.tables[0][0]; _by = BOIL.tables[0][1];
}
function boilTick(t){
  if (!BOIL.on){ BOIL.k = 0; }
  else BOIL.k = Math.floor(t * CFG.boil.fps) % CFG.boil.frames;
  const tb = BOIL.tables[BOIL.k];
  _bx = tb[0]; _by = tb[1];
}
const bX = i => _bx[i & (BOIL_N - 1)];
const bY = i => _by[i & (BOIL_N - 1)];
/* Small shapes do not wobble internally — the whole drawing lands a little
   differently. Large outlines wobble along their length. Both are boil. */
function boilShift(ctx, seed, amp = 1){
  if (!BOIL.on) return;
  const a = CFG.boil.amp * amp * UI.s;
  ctx.translate(bX(seed)*a, bY(seed)*a);
}

/* paper grain — the thing that makes a flat fill feel like a printed page */
let grainPat = null;
function makeGrain(c2d){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), d = g.createImageData(128, 128);
  for (let i = 0; i < d.data.length; i += 4){
    const v = 128 + (Math.random() - 0.5) * 52;
    d.data[i] = d.data[i+1] = d.data[i+2] = v;
    d.data[i+3] = 22;
  }
  g.putImageData(d, 0, 0);
  grainPat = c2d.createPattern(c, 'repeat');
}

/* ---------- little helpers ---------- */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const dist  = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const hsl   = (h,s,l,a=1) => `hsla(${(h%360+360)%360},${clamp(s,0,100)}%,${clamp(l,0,100)}%,${a})`;
const today = () => new Date().toISOString().slice(0,10);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function mulberry32(a){
  return function(){
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function pick(r, arr){ return arr[Math.floor(r()*arr.length)]; }
/* A silhouette stroke, drawn only in ink mode. Strokes that ARE the form —
   thread, a snail's spiral, a candle wick, the netting on a float — are not
   outlines and stay whatever the mode. */
function outline(ctx){ if (CFG.outlines) ctx.stroke(); }
function rr(ctx,x,y,w,h,rad){            // roundRect, hand-rolled for old Safari
  const k = Math.min(rad, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+k,y);
  ctx.arcTo(x+w,y,x+w,y+h,k);
  ctx.arcTo(x+w,y+h,x,y+h,k);
  ctx.arcTo(x,y+h,x,y,k);
  ctx.arcTo(x,y,x+w,y,k);
  ctx.closePath();
}
// does segment p1->p2 cross segment p3->p4 ?
function crosses(p1,p2,p3,p4){
  const d=(a,b,c)=>(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);
  const d1=d(p3,p4,p1), d2=d(p3,p4,p2), d3=d(p1,p2,p3), d4=d(p1,p2,p4);
  return ((d1>0&&d2<0)||(d1<0&&d2>0)) && ((d3>0&&d4<0)||(d3<0&&d4>0));
}
/* Progress accumulated in a loop lands on 0.9999999302, not 1 — so a player who
   drags the tape exactly to its end, and no further, would leave the layer
   permanently a ten-millionth short of done, and the parcel never opens. */
const DONE = 0.999;
const snap = v => v > DONE ? 1 : v;

// Distance from a point to a segment. A swipe that only grazes the twine should
// still cut it, and a sample landing exactly ON the cord must not slip through
// the strict-inequality crack in crosses().
function ptSegDist(p, a, b){
  const vx=b.x-a.x, vy=b.y-a.y, wx=p.x-a.x, wy=p.y-a.y;
  const L2 = vx*vx + vy*vy;
  const t = L2 ? clamp((wx*vx + wy*vy)/L2, 0, 1) : 0;
  return Math.hypot(wx - vx*t, wy - vy*t);
}

/* ============================================================
   CONTENT
   ============================================================ */
const RARITY = [
  {id:'common',    name:'Common',    w:66, col:'#9A8E79', mut:0.00, notes:3},
  {id:'uncommon',  name:'Uncommon',  w:23, col:'#778C71', mut:0.06, notes:4},
  {id:'rare',      name:'Rare',      w: 9, col:'#6C819A', mut:0.20, notes:6},
  {id:'legendary', name:'Legendary', w: 2, col:'#9A7B3E', mut:0.48, notes:9},
];
const RA = {}; RARITY.forEach((r,i)=>{ r.idx=i; RA[r.id]=r; });

const SPECIES = [
  {id:'moon',   name:'Moonpetal',      poem:'Opens only for light it already remembers.',
   petals:[5,6],   hue:[206,248], sat:[ 9,17], lit:[76,86], shape:'round',  center:'disc',  size:1.00},
  {id:'ember',  name:'Ember Cup',      poem:'Warm to the touch for three days, then shy.',
   petals:[6,8],   hue:[ 10, 26], sat:[23,33], lit:[58,68], shape:'cup',    center:'fuzz',  size:0.95},
  {id:'glass',  name:'Glasswort Bell', poem:'It rings if you are honest near it.',
   petals:[5,5],   hue:[150,182], sat:[10,18], lit:[70,80], shape:'tube',   center:'ring',  size:0.90},
  {id:'thistle',name:'Thistlelace',    poem:'Guards nothing, and guards it very well.',
   petals:[11,16], hue:[268,300], sat:[12,21], lit:[60,70], shape:'lance',  center:'beads', size:0.92},
  {id:'ink',    name:'Inkdrop Iris',   poem:'Every petal is a sentence it will not finish.',
   petals:[3,3],   hue:[238,266], sat:[11,18], lit:[42,52], shape:'frill',  center:'star',  size:1.08},
  {id:'sun',    name:'Sunhusk',        poem:'Husks itself each dawn and calls that growth.',
   petals:[13,19], hue:[ 38, 50], sat:[26,34], lit:[64,74], shape:'lance',  center:'disc',  size:1.02},
  {id:'velvet', name:'Velvet Maw',     poem:'It is only ever hungry for the evening.',
   petals:[4,5],   hue:[330,352], sat:[12,20], lit:[48,58], shape:'cup',    center:'fuzz',  size:1.10},
  {id:'pearl',  name:'Pearl Trumpet',  poem:'Plays one note, too low for anyone awake.',
   petals:[5,6],   hue:[ 28, 44], sat:[ 9,16], lit:[80,88], shape:'tube',   center:'ring',  size:0.98},
  {id:'fog',    name:'Fogbloom',       poem:'Sold by weight. Weighs nothing at all.',
   petals:[7,9],   hue:[190,212], sat:[ 6,12], lit:[78,88], shape:'frill',  center:'fuzz',  size:0.94},
  {id:'copper', name:'Copper Rose',    poem:'Rusts beautifully, and entirely on purpose.',
   petals:[15,21], hue:[ 14, 28], sat:[21,30], lit:[54,64], shape:'round',  center:'disc',  size:1.00},
  {id:'night',  name:'Nightbead',      poem:'Counts the hours and keeps the tally somewhere.',
   petals:[6,6],   hue:[220,244], sat:[10,17], lit:[44,54], shape:'star',   center:'beads', size:0.88},
  {id:'salt',   name:'Saltlily',       poem:'Grew where the tide forgot to come back.',
   petals:[6,7],   hue:[172,196], sat:[ 9,16], lit:[78,86], shape:'lance',  center:'ring',  size:1.02},
  {id:'feather',name:'Featherstar',    poem:'Moults in spring and apologises all summer.',
   petals:[8,10],  hue:[300,330], sat:[13,22], lit:[68,78], shape:'frill',  center:'star',  size:1.05},
  {id:'ribbon', name:'Ribbonvine',     poem:'Ties itself to whatever it happens to be nearest.',
   petals:[5,7],   hue:[ 84,118], sat:[12,20], lit:[56,66], shape:'ribbon', center:'beads', size:1.08},
];
const SP = {}; SPECIES.forEach(s => SP[s.id]=s);

const VARIANTS = [
  {id:'dawn', name:'Dawn',  alt:'Plain',   target:  0, mix:0.00, ds:  1, dl:  5},
  {id:'ink',  name:'Ink',   alt:'Inked',   target:232, mix:0.36, ds:  5, dl:-17},
  {id:'ember',name:'Ember', alt:'Kindled', target: 20, mix:0.46, ds:  8, dl: -5},
  {id:'frost',name:'Frost', alt:'Frosted', target:196, mix:0.44, ds: -7, dl: 10},
  {id:'moss', name:'Moss',  alt:'Mossed',  target: 96, mix:0.44, ds: -3, dl: -3},
];
// shortest way round the wheel, so blends never swing through the wrong colours
function blendHue(h, target, mix){
  if (!mix) return h;
  const d = ((target - h) % 360 + 540) % 360 - 180;
  return h + d*mix;
}
const VA = {}; VARIANTS.forEach(v => VA[v.id]=v);

const MUTATIONS = [
  {id:'glow',   name:'Luminous'},
  {id:'double', name:'Doubled'},
  {id:'glass',  name:'Glassine'},
  {id:'invert', name:'Nodding'},
];

/* How two neighbouring flowers can agree. Hue is the entry tier; the rest ask
   you to notice something less obvious, and pay more for it. Best tier wins. */
const BONDS = [
  {id:'kin',     name:'Kin',          hint:'the same species',          glyph:'seed'},  // a triangle
  {id:'counter', name:'Counterpoint', hint:'opposite across the wheel', glyph:'bow'},
  {id:'tone',    name:'Tone',         hint:'tinted the same way',       glyph:'diamond'},
  {id:'echo',    name:'Echo',         hint:'a neighbouring hue',        glyph:'ring'},
];
const BD = {}; BONDS.forEach(b => BD[b.id] = b);
function bondBetween(a, b){
  if (!a || !b) return null;
  if (a.sp === b.sp) return BD.kin;
  const gap = hueGap(phenotype(a).hue, phenotype(b).hue);
  if (gap > 150) return BD.counter;
  if (a.va === b.va && a.va !== 'dawn') return BD.tone;   // dawn is "untinted", not a shared colourway
  if (gap <  42)    return BD.echo;

function bondGlyph(ctx, kind, x, y, col, R = 5){
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.5;
  if (kind === 'ring'){
    ctx.beginPath(); ctx.arc(0, 0, R*0.52, 0, TAU); ctx.fill();
  } else if (kind === 'diamond'){
    ctx.beginPath(); ctx.moveTo(0,-R); ctx.lineTo(R*0.7,0); ctx.lineTo(0,R); ctx.lineTo(-R*0.7,0);
    ctx.closePath(); ctx.fill();

    ctx.beginPath();
    ctx.moveTo(0, -R); ctx.lineTo(R*0.88, R*0.62); ctx.lineTo(-R*0.88, R*0.62);
    ctx.closePath(); ctx.fill();

    ctx.beginPath(); ctx.moveTo(-R,-R*0.8); ctx.lineTo(0,0); ctx.lineTo(-R,R*0.8); ctx.closePath(); ctx.fill();

/* Each matched group gets one glaze. The mark is not decoration: colour alone
   would fail for a colour-blind player, so each glaze also has a distinct
   relief, and the two always travel together. */
const GLAZES = [
  {body:'#C4977C', rim:'#9E735A', mark:'band',   name:'terracotta'},
  {body:'#9BAE94', rim:'#748769', mark:'dots',   name:'sage'},
  {body:'#98A8BA', rim:'#71829A', mark:'stripe', name:'slate'},
  {body:'#D2B478', rim:'#A88B52', mark:'cross',  name:'ochre'},
];
const POT_PLAIN = {body:'#D5C5A8', rim:'#B5A384', mark:'none', name:'plain'};

function potPath(ctx, x, y, k){
  ctx.beginPath();
  ctx.moveTo(x - 13*k, y - 10*k); ctx.lineTo(x + 13*k, y - 10*k);
  ctx.lineTo(x +  9*k, y +  6*k); ctx.lineTo(x -  9*k, y +  6*k);
  ctx.closePath();
}
function drawPot(ctx, x, y, glazeIdx, k = 1, bseed = 0){
  const g = glazeIdx >= 0 ? GLAZES[glazeIdx] : POT_PLAIN;
  ctx.save();
  boilShift(ctx, bseed + 500, 0.55);
  ctx.fillStyle = 'rgba(112,96,76,.13)';
  ctx.beginPath(); ctx.ellipse(x, y + 7*k, 12*k, 2.6*k, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = g.body; potPath(ctx, x, y, k); ctx.fill();
  ctx.fillStyle = g.rim; rr(ctx, x - 13.5*k, y - 11*k, 27*k, 5*k, 1.6*k); ctx.fill();
  ctx.fillStyle = 'rgba(255,253,247,.24)'; ctx.fillRect(x - 11*k, y - 9.6*k, 22*k, 1.7*k);
  ctx.fillStyle = g.rim;
  if (g.mark === 'band'){
    ctx.fillRect(x - 10.5*k, y - 2*k, 21*k, 2.6*k);
  } else if (g.mark === 'dots'){
    for (let i=-1;i<=1;i++){ ctx.beginPath(); ctx.arc(x + i*6.5*k, y - 0.5*k, 1.9*k, 0, TAU); ctx.fill(); }
  } else if (g.mark === 'stripe'){
    for (let i=-1;i<=1;i++) ctx.fillRect(x + i*6.5*k - 0.95*k, y - 6*k, 1.9*k, 10*k);
  } else if (g.mark === 'cross'){
    ctx.save(); ctx.translate(x, y - k); ctx.rotate(Math.PI/4);
    ctx.fillRect(-6*k, -1.15*k, 12*k, 2.3*k); ctx.fillRect(-1.15*k, -6*k, 2.3*k, 12*k); ctx.restore();
  }
  // a side gradient gives the pot its roundness instead of an edge
  const sg = ctx.createLinearGradient(x - 14*k, 0, x + 14*k, 0);
  sg.addColorStop(0, 'rgba(255,253,247,.16)'); sg.addColorStop(0.45, 'rgba(255,253,247,0)');
  sg.addColorStop(1, 'rgba(84,72,56,.15)');
  ctx.fillStyle = sg; potPath(ctx, x, y, k); ctx.fill();
  ctx.strokeStyle = 'rgba(78,68,55,.32)'; ctx.lineWidth = 1.2;
  potPath(ctx, x, y, k); outline(ctx);
  ctx.restore();
}

/* ============================================================
   AUDIO — synthesised, so the whole game stays one file
   ============================================================ */
const Snd = (() => {
  let ac = null, master = null, noiseBuf = null, muted = false;
  function boot(){
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { muted = true; return null; }
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.32; master.connect(ac.destination);
    const n = ac.sampleRate * 2;
    noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
    return ac;
  }
  function resume(){ const a = boot(); if (a && a.state === 'suspended') a.resume(); }
  function noise(dur, freq, gain, q=1){
    const a = boot(); if (!a || muted) return;
    const s = a.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
    const g = a.createGain();
    const t = a.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + dur*0.14);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  function tone(freq, dur, gain=0.2, type='sine', delay=0, glide=0){
    const a = boot(); if (!a || muted) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    const t = a.currentTime + delay;
    o.frequency.setValueAtTime(freq, t);
    if (glide) o.frequency.exponentialRampToValueAtTime(freq*glide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const PENTA = [0,2,4,7,9,12,14,16,19,21,24];
  return {
    resume, boot,
    rustle: () => noise(0.13, 2600 + Math.random()*1600, 0.16, 0.7),
    peel  : () => noise(0.07, 1500 + Math.random()*2400, 0.11, 1.4),
    snip  : () => { noise(0.05, 5200, 0.2, 3); tone(1480, 0.07, 0.07, 'triangle'); },
    pop   : (i=0) => { noise(0.035, 900 + i*130, 0.2, 5); tone(320 + i*26, 0.05, 0.09, 'sine', 0, 0.55); },
    thread: () => noise(0.09, 780 + Math.random()*500, 0.07, 2.2),
    strain: (f) => tone(120 + f*230, 0.1, 0.035 + f*0.05, 'sawtooth'),
    crack : () => { noise(0.2, 420, 0.24, 0.8); tone(180, 0.22, 0.12, 'triangle', 0, 0.4); },
    whump : () => { noise(0.36, 240, 0.2, 0.5); tone(96, 0.4, 0.14, 'sine', 0, 0.55); },
    chime : (rar) => {
      const n = RA[rar].notes, base = 392 * (rar === 'legendary' ? 1.5 : 1);
      for (let i=0;i<n;i++){
        const st = PENTA[i % PENTA.length] + (i >= PENTA.length ? 12 : 0);
        tone(base * Math.pow(2, st/12), 1.5 - i*0.05, 0.12 - i*0.006, 'sine', i*0.085);
        if (rar === 'rare' || rar === 'legendary')
          tone(base * Math.pow(2, (st+12)/12), 0.8, 0.032, 'triangle', i*0.085 + 0.02);
      }
    },
    press : () => { noise(0.3, 700, 0.1, 0.6); tone(220, 0.25, 0.05, 'sine', 0, 0.6); },
  };
})();
function buzz(ms){ if (navigator.vibrate) try { navigator.vibrate(ms); } catch(e){} }

/* ============================================================
   GENOME -> PHENOTYPE.  Flowers are drawn from numbers, never
   from image files, so hundreds of them cost nothing.
   ============================================================ */
function makeGenome(r, opts = {}){
  const sp = opts.sp || pick(r, SPECIES).id;
  const va = pick(r, VARIANTS).id;
  let ra = opts.ra;
  if (!ra){
    const total = RARITY.reduce((s,x)=>s+x.w, 0);
    let t = r()*total; ra = 'common';
    for (const x of RARITY){ if ((t -= x.w) <= 0){ ra = x.id; break; } }
  }
  const mu = r() < RA[ra].mut ? pick(r, MUTATIONS).id : null;
  return { sp, va, ra, mu, seed: Math.floor(r()*1e9) };
}

const phCache = new Map();
function phenotype(g){
  const key = g.sp+g.va+g.ra+g.mu+g.seed;
  if (phCache.has(key)) return phCache.get(key);
  const sp = SP[g.sp], va = VA[g.va], ra = RA[g.ra], sh = SHAPES[sp.shape];
  const r = mulberry32(g.seed);
  const rq = ra.idx / 3;                       // 0 common .. 1 legendary

  const n   = Math.round(lerp(sp.petals[0], sp.petals[1], clamp(r()*0.75 + rq*0.4, 0, 1)));
  const hue = blendHue(lerp(sp.hue[0], sp.hue[1], r()), va.target, va.mix);
  const sat = lerp(sp.sat[0], sp.sat[1], r()) + va.ds + rq*5;
  const lit = lerp(sp.lit[0], sp.lit[1], r()) + va.dl;
  const jit = Array.from({length: Math.max(n, 24)}, () => r()*2 - 1);
  // A petal may not be wider than the arc it has to itself, or the bloom
  // fuses into one solid disc instead of reading as separate petals.
  const wid = Math.min(sh.wid * sp.size, (TAU/n) * 0.62);
  const pale = lit > 58;
  const cen  = sp.center === 'beads'
      ? [pet(hue, sat + 8, lit - 24), pet(hue, sat + 12, lit - 10)]
      : (sp.center === 'ring' || sp.center === 'star')
      ? [pet(hue, sat*0.62, pale ? 70 : 66), pet(hue + 16, sat*0.5, pale ? 80 : 77)]
      : [pet(42, 34, pale ? 60 : 54), pet(46, 38, pale ? 76 : 70)];

  const ph = {
    ...sh, n, wid, mu: g.mu, ra: g.ra, sp: g.sp, jit,
    len : sh.len * sp.size,
    cA   : pet(hue, sat, lit),
    cB   : pet(hue + 8, sat*0.95, lit - 12),
    cEdge: pet(hue - 6, sat*0.8, lit + 11),
    // outlines are pencil, not a darker version of the fill — this is most of
    // what separates a hand-drawn look from a vector one
    cLine: 'rgba(78,68,55,.4)',
    cVein: pet(hue, sat*0.7, lit - 8, 0.45),
    cCen : cen[0],
    cCen2: cen[1],
    stem : pet(lerp(92, 122, r()), lerp(17, 25, r()), lerp(50, 60, r())),
    center: sp.center,
    bend : r()*2 - 1,
    phase: r()*TAU,
    bseed: Math.floor(r()*100000),
    hue, sat, lit,
  };
  phCache.set(key, ph);
  return ph;
}
function flowerName(g){
  const sp = SP[g.sp].name, va = VA[g.va].name;
  if (g.va === 'dawn') return sp;
  // "Ember" + "Ember Cup" would read "Ember Ember Cup"; fall back to the
  // colourway's other adjective so the two still have different names
  if (new RegExp('\\b' + va + '\\b', 'i').test(sp)) return VA[g.va].alt + ' ' + sp;
  return va + ' ' + sp;
}

/* The petal silhouette is sampled at fixed positions, so its profile depends
   only on the sample count and the tip sharpness — never on the flower. Cached,
   it turns ~5000 pow+sin calls a frame into array reads. */
const PROFILE = new Map();
function profile(N, sharp){
  const k = N * 2 + (sharp ? 1 : 0);
  let p = PROFILE.get(k);
  if (!p){
    p = { base: new Float32Array(N+1), arc: new Float32Array(N+1) };
    for (let i = 0; i <= N; i++){
      const u = i/N;
      p.base[i] = Math.pow(Math.sin(u*Math.PI), sharp ? 1.7 : 0.72);
      p.arc[i]  = Math.sin(u*Math.PI);
    }
    PROFILE.set(k, p);
  }
  return p;
}
function petalPath(ctx, L, Wd, curl, frill, split, sharp, j, bs = 0, amp = 1){
  // small petals do not need thirteen samples to read as the same shape
  const N = L < 46 ? 9 : 13;
  const P = profile(N, sharp);
  const a = BOIL.on ? amp : 0;
  const cw = curl*Wd*0.55;
  ctx.beginPath(); ctx.moveTo(bX(bs)*a, bY(bs)*a);
  for (let i = 1; i <= N; i++){
    const u = i/N;
    const rip = 1 + frill*0.3*Math.sin(u*9 + j*6);
    ctx.lineTo( Wd*P.base[i]*rip*(1 - curl*0.45*u) + cw*P.arc[i] + bX(bs+i)*a,
                -L*u + bY(bs+i)*a );
  }
  if (split) ctx.lineTo(bX(bs+40)*a, -L*0.83 + bY(bs+40)*a);
  for (let i = N; i >= 1; i--){
    const u = i/N;
    const rip = 1 + frill*0.3*Math.sin(u*9 + j*6 + 2.1);
    ctx.lineTo( -Wd*P.base[i]*rip*(1 - curl*0.45*u) + cw*P.arc[i] + bX(bs+60+i)*a,
                -L*u + bY(bs+60+i)*a );
  }
  ctx.closePath();
}

/* Directional light separates one SIDE of a flower from the other, but
   neighbouring petals point almost the same way, so it cannot separate them.
   Alternating the tone by petal index is what does that — an old illustrator's
   trick, and the reason a twenty-petal daisy reads as petals and not a disc. */
const SHADE_STEPS = [-12, -8, -4, 0, 4, 8, 12];
function drawCentre(ctx, ph, R, t){
  if (R <= 0.4) return;
  ctx.save();
  boilShift(ctx, ph.bseed + 400, 0.7);
  if (ph.center === 'disc'){
    const g = ctx.createRadialGradient(0,0,R*0.15, 0,0,R);
    g.addColorStop(0, ph.cCen2); g.addColorStop(1, ph.cCen);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    for (let i=0;i<14;i++){
      const a = i*2.399, rad = R*0.78*Math.sqrt(i/14);
      ctx.beginPath(); ctx.arc(Math.cos(a)*rad, Math.sin(a)*rad, R*0.11, 0, TAU); ctx.fill();
    }
  } else if (ph.center === 'beads'){
    for (let i=0;i<8;i++){
      const a = i/8*TAU + t*0.2;
      ctx.fillStyle = i%2 ? ph.cCen2 : ph.cCen;
      ctx.beginPath(); ctx.arc(Math.cos(a)*R*0.62, Math.sin(a)*R*0.62, R*0.34, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = ph.cCen2;
    ctx.beginPath(); ctx.arc(0,0,R*0.3,0,TAU); ctx.fill();
  } else if (ph.center === 'fuzz'){
    ctx.strokeStyle = ph.cCen; ctx.lineWidth = Math.max(0.7, R*0.13); ctx.lineCap='round';
    for (let i=0;i<22;i++){
      const a = i/22*TAU + ph.phase, l = R*(0.7 + 0.5*Math.abs(ph.jit[i % ph.jit.length]));
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*R*0.2, Math.sin(a)*R*0.2);
      ctx.lineTo(Math.cos(a)*l, Math.sin(a)*l); ctx.stroke();
      ctx.fillStyle = ph.cCen2;
      ctx.beginPath(); ctx.arc(Math.cos(a)*l, Math.sin(a)*l, R*0.13, 0, TAU); ctx.fill();
    }
  } else if (ph.center === 'ring'){
    const g = ctx.createRadialGradient(0,0,R*0.1, 0,0,R);   // a pale corona, not a bullseye
    g.addColorStop(0, ph.cCen2); g.addColorStop(0.72, ph.cCen); g.addColorStop(1, ph.cCen2);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,R*0.8,0,TAU); ctx.fill();
    ctx.fillStyle = ph.cCen;
    for (let i=0;i<7;i++){
      const a = i/7*TAU + ph.phase;
      ctx.beginPath(); ctx.arc(Math.cos(a)*R*0.48, Math.sin(a)*R*0.48, R*0.12, 0, TAU); ctx.fill();
    }
    if (R > 6 && CFG.outlines){
      ctx.strokeStyle = 'rgba(86,75,60,.22)'; ctx.lineWidth = Math.max(0.6, R*0.07);
      ctx.beginPath(); ctx.arc(0,0,R*0.92,0,TAU); ctx.stroke();
    }
  } else { // star — an iris throat: soft glow with short rays
    const g = ctx.createRadialGradient(0,0,0, 0,0,R*0.95);
    g.addColorStop(0, ph.cCen2); g.addColorStop(0.6, ph.cCen); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,R*0.95,0,TAU); ctx.fill();
    ctx.strokeStyle = ph.cCen; ctx.lineWidth = Math.max(0.7, R*0.15); ctx.lineCap = 'round';
    for (let i=0;i<6;i++){
      const a = i/6*TAU + ph.phase*0.3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*R*0.3, Math.sin(a)*R*0.3);
      ctx.lineTo(Math.cos(a)*R*0.86, Math.sin(a)*R*0.86);
      ctx.stroke();
    }
    ctx.fillStyle = ph.cCen2;
    ctx.beginPath(); ctx.arc(0,0,R*0.3,0,TAU); ctx.fill();
  }
  ctx.restore();
}

function drawStem(ctx, ph, R, t, len){
  const h = len ?? R*2.6;
  const sway = reduceMotion ? 0 : Math.sin(t*0.8 + ph.phase)*R*0.05;
  const bend = ph.bend*R*0.42 + sway;
  ctx.save();
  ctx.strokeStyle = ph.stem; ctx.lineWidth = Math.max(1.6, R*0.075); ctx.lineCap='round';
  const a = BOIL.on ? CFG.boil.amp * UI.s : 0;
  ctx.beginPath();
  for (let i=0;i<=10;i++){                      // sampled, so the line can boil along it
    const u = i/10, iu = 1-u;
    const px = iu*iu*0 + 2*iu*u*bend + u*u*bend*0.25;
    const py = iu*iu*0 + 2*iu*u*h*0.5 + u*u*h;
    i ? ctx.lineTo(px + bX(ph.bseed+200+i)*a, py + bY(ph.bseed+200+i)*a)
      : ctx.moveTo(px, py);
  }
  ctx.stroke();
  ctx.fillStyle = ph.stem;
  for (let i=0;i<2;i++){
    const u = 0.42 + i*0.26, side = i%2 ? 1 : -1;
    const x = lerp(0, bend*0.25, u) + bend*0.5*(1-u)*u*2, y = h*u;
    ctx.save(); ctx.translate(x,y); boilShift(ctx, ph.bseed + 300 + i);
    ctx.rotate(side*(0.85 + ph.jit[i]*0.2));
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.quadraticCurveTo(R*0.34, -R*0.24, R*0.72, 0);
    ctx.quadraticCurveTo(R*0.34,  R*0.24, 0, 0);
    ctx.fill(); ctx.restore();
  }
  ctx.restore();
}

/* R = head radius in px, bloom 0..1 */
function drawFlower(ctx, ph, x, y, R, bloom = 1, t = 0, opts = {}){
  ctx.save();
  ctx.translate(x, y);
  if (opts.stem !== false) drawStem(ctx, ph, R, t, opts.stemLen);
  if (opts.droop) ctx.rotate(ph.bend*0.5*opts.droop);   // a fading head hangs
  if (!reduceMotion) ctx.rotate(Math.sin(t*0.85 + ph.phase)*0.035*(opts.sway ?? 1));
  if (ph.mu === 'invert') ctx.scale(1, -1);
  if (ph.mu === 'glow'){ ctx.shadowColor = ph.cA; ctx.shadowBlur = R*0.55*bloom; }

  // The wobble has to track the line weight, or it shouts on a small flower and
  // disappears on a big one. Stroke width scales with R, so the boil does too.
  const bamp = CFG.boil.amp * UI.s * clamp(0.55 + R/110, 0.6, 1.9);
  // A soft cast shadow does the job an outline used to: it seats the head
  // against the ground without drawing a line around it.
  if (!CFG.outlines && bloom > 0.15){
    const sr = R*1.02*bloom;
    const sh = ctx.createRadialGradient(R*0.1, R*0.16, sr*0.2, R*0.1, R*0.16, sr);
    sh.addColorStop(0, 'rgba(92,80,62,.2)'); sh.addColorStop(0.62, 'rgba(92,80,62,.12)');
    sh.addColorStop(1, 'rgba(92,80,62,0)');
    ctx.fillStyle = sh;
    ctx.beginPath(); ctx.arc(R*0.1, R*0.16, sr, 0, TAU); ctx.fill();
  }
  const rings = ph.mu === 'double' ? 2 : 1;
  for (let ring = rings-1; ring >= 0; ring--){
    const rs  = ring ? 0.72 : 1;
    const off = ring ? Math.PI/ph.n : 0;
    // Without an outline, adjacent petals only separate if they differ in
    // value — so each petal is lit by where it points. Five quantised shades
    // instead of a gradient per petal keeps that nearly free: gradient
    // coordinates resolve against the transform in force when the gradient is
    // USED, so one object per shade rotates correctly with every petal.
    const Lnom = R*ph.len*rs;
    const dark = ring ? -6 : 0;
    const grads = SHADE_STEPS.map(dl => {
      const g = ctx.createLinearGradient(0, 0, 0, -Lnom);
      g.addColorStop(0,    pet(ph.hue + 8, ph.sat*0.95, ph.lit - 15 + dl + dark));
      g.addColorStop(0.52, pet(ph.hue,     ph.sat,      ph.lit + dl + dark));
      g.addColorStop(1,    pet(ph.hue - 6, ph.sat*0.78, ph.lit + 8 + dl + dark));
      return g;
    });
    for (let i=0;i<ph.n;i++){
      const grow = clamp(bloom*1.3 - (i/ph.n)*0.22, 0, 1);
      if (grow <= 0.01) continue;
      const ease = 1 - Math.pow(1-grow, 3);
      const ang = off + i/ph.n*TAU + ph.jit[i]*0.1 + (1-ease)*0.8;
      const dl = Math.cos(ang - CFG.lightAngle)*7.5   // which way the petal faces
               + (i % 2 ? 3.4 : -3.4)                  // and whether it is odd or even
               + ph.jit[i]*2;
      const q = clamp(Math.round((dl + 12) / 4), 0, SHADE_STEPS.length - 1);
      ctx.save();
      ctx.rotate(ang);
      const L  = R*ph.len*rs*(0.3 + 0.7*ease)*(1 + ph.jit[i]*0.055);
      const Wd = R*ph.wid*rs*(0.45 + 0.55*ease);
      ctx.fillStyle = grads[q];
      ctx.globalAlpha = ph.mu === 'glass' ? 0.55 : (ring ? 0.94 : 1);
      petalPath(ctx, L, Wd, ph.curl, ph.frill, ph.split, ph.sharp, ph.jit[i],
                ph.bseed + i*131 + ring*47, bamp);
      ctx.fill();
      ctx.globalAlpha = 1;
      if (CFG.outlines){
        ctx.strokeStyle = ph.mu === 'glass' ? 'rgba(255,253,246,.8)' : ph.cLine;
        ctx.lineWidth = Math.max(0.9, R*0.022); ctx.stroke();
      }
      ctx.restore();
    }
  }
  ctx.shadowBlur = 0;
  drawCentre(ctx, ph, R*0.3*bloom, t);
  ctx.restore();
}

function drawTonic(ctx, x, y, R){
  ctx.save(); ctx.translate(x, y);
  boilShift(ctx, 1234, 0.8);
  ctx.fillStyle = '#8E7A5C';                                  // cork
  rr(ctx, -R*0.17, -R*0.98, R*0.34, R*0.3, R*0.06); ctx.fill();
  const g = ctx.createLinearGradient(-R*0.45, 0, R*0.45, 0);  // amber glass
  g.addColorStop(0, '#9C7A52'); g.addColorStop(0.35, '#C79E66');
  g.addColorStop(0.55, '#BE9464'); g.addColorStop(1, '#8E6D48');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-R*0.16, -R*0.7); ctx.lineTo(-R*0.16, -R*0.5);
  ctx.quadraticCurveTo(-R*0.52, -R*0.24, -R*0.52, R*0.3);
  ctx.quadraticCurveTo(-R*0.52, R*0.8, -R*0.2, R*0.8);
  ctx.lineTo(R*0.2, R*0.8);
  ctx.quadraticCurveTo(R*0.52, R*0.8, R*0.52, R*0.3);
  ctx.quadraticCurveTo(R*0.52, -R*0.24, R*0.16, -R*0.5);
  ctx.lineTo(R*0.16, -R*0.7); ctx.closePath();
  ctx.fill(); outline(ctx);
  ctx.fillStyle = 'rgba(255,252,242,.34)';                    // highlight
  rr(ctx, -R*0.36, -R*0.12, R*0.12, R*0.6, R*0.06); ctx.fill();
  ctx.fillStyle = '#EFE7D6';                                  // label
  rr(ctx, -R*0.4, R*0.04, R*0.8, R*0.36, R*0.05); ctx.fill();
  ctx.fillStyle = 'rgba(86,75,60,.45)';
  for (let i=0;i<2;i++) rr(ctx, -R*0.28, R*0.13 + i*R*0.12, R*0.56, R*0.05, R*0.02), ctx.fill();
  ctx.restore();
}

function drawDecor(ctx, id, x, y, R){
  ctx.save(); ctx.translate(x, y);
  boilShift(ctx, (id.charCodeAt(0)*37 + id.length*11) + 700, 0.8);
  ctx.strokeStyle = 'rgba(86,75,60,.38)'; ctx.lineWidth = 1.1;
  if (id === 'bell'){
    ctx.fillStyle = '#BE9F63';
    ctx.beginPath(); ctx.moveTo(-R*0.6, R*0.5);
    ctx.quadraticCurveTo(-R*0.55, -R*0.5, 0, -R*0.6);
    ctx.quadraticCurveTo(R*0.55, -R*0.5, R*0.6, R*0.5);
    ctx.closePath(); ctx.fill(); outline(ctx);
    ctx.fillStyle = '#96804F';
    ctx.beginPath(); ctx.ellipse(0, R*0.5, R*0.6, R*0.14, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -R*0.74, R*0.16, 0, TAU); ctx.stroke();
  } else if (id === 'moth'){
    ctx.fillStyle = '#E3D9C2';
    for (const sgn of [-1, 1]){
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(sgn*R*1.1, -R*0.85, sgn*R*0.85, R*0.1);
      ctx.quadraticCurveTo(sgn*R*0.6, R*0.7, 0, R*0.15);
      ctx.closePath();
      ctx.fillStyle = sgn < 0 ? '#E3D9C2' : '#D6CAAF';   // wings differ, so they separate
      ctx.fill(); outline(ctx);
    }
    ctx.fillStyle = '#9A8362';
    ctx.beginPath(); ctx.ellipse(0, 0, R*0.13, R*0.55, 0, 0, TAU); ctx.fill();
  } else if (id === 'float'){
    const g = ctx.createRadialGradient(-R*0.3, -R*0.35, R*0.05, 0, 0, R*0.8);
    g.addColorStop(0, 'rgba(240,244,240,.95)'); g.addColorStop(1, 'rgba(176,192,186,.85)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, R*0.78, 0, TAU); ctx.fill(); outline(ctx);
    ctx.strokeStyle = 'rgba(140,124,96,.5)';
    for (let i=-1;i<=1;i++){
      ctx.beginPath(); ctx.moveTo(i*R*0.42, -R*0.68); ctx.lineTo(i*R*0.42, R*0.68); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-R*0.68, i*R*0.42); ctx.lineTo(R*0.68, i*R*0.42); ctx.stroke();
    }
  } else if (id === 'shell'){
    const shg = ctx.createRadialGradient(-R*0.25, -R*0.3, R*0.06, 0, 0, R*0.8);
    shg.addColorStop(0, '#E4D7BF'); shg.addColorStop(1, '#C6B295');
    ctx.fillStyle = shg;
    ctx.beginPath(); ctx.arc(0, 0, R*0.78, 0, TAU); ctx.fill(); outline(ctx);
    ctx.strokeStyle = 'rgba(122,104,84,.5)'; ctx.lineWidth = 1.3;
    ctx.beginPath();
    for (let a=0; a<TAU*2.6; a+=0.12){
      const rad = R*0.07*a, px = Math.cos(a)*rad, py = Math.sin(a)*rad;
      a ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
    }
    ctx.stroke();
  } else if (id === 'candle'){
    ctx.fillStyle = '#E8DFCE';
    rr(ctx, -R*0.34, -R*0.15, R*0.68, R*1.0, R*0.1); ctx.fill(); outline(ctx);
    ctx.fillStyle = 'rgba(84,72,56,.12)';
    rr(ctx, R*0.12, -R*0.15, R*0.22, R*1.0, R*0.08); ctx.fill();
    ctx.strokeStyle = '#7C6842'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, -R*0.15); ctx.lineTo(0, -R*0.4); ctx.stroke();
    ctx.fillStyle = 'rgba(190,159,99,.75)';
    ctx.beginPath(); ctx.ellipse(0, -R*0.62, R*0.16, R*0.3, 0, 0, TAU); ctx.fill();
  } else { // stone
    const g = ctx.createRadialGradient(-R*0.2, -R*0.3, R*0.05, 0, 0, R*0.9);
    g.addColorStop(0, '#C3C0B6'); g.addColorStop(1, '#9C9A90');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, R*0.08, R*0.82, R*0.6, -0.15, 0, TAU); ctx.fill(); outline(ctx);
  }
  ctx.restore();
}

function drawCurio(ctx, id, x, y, R){
  ctx.save(); ctx.translate(x,y);
  boilShift(ctx, (id.charCodeAt(0)*53 + id.length*7) + 900, 0.8);
  const ink = '#4A4238';
  if (id === 'frog'){
    ctx.fillStyle = '#8A9C76';
    ctx.beginPath(); ctx.ellipse(0, 0, R*0.8, R*0.55, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-R*0.3,-R*0.42,R*0.24,R*0.24,0,0,TAU);
    ctx.ellipse( R*0.3,-R*0.42,R*0.24,R*0.24,0,0,TAU); ctx.fill();
    ctx.fillStyle='#EDE7DA';
    ctx.beginPath(); ctx.arc(-R*0.3,-R*0.45,R*0.12,0,TAU); ctx.arc(R*0.3,-R*0.45,R*0.12,0,TAU); ctx.fill();
    ctx.fillStyle=ink;
    ctx.beginPath(); ctx.arc(-R*0.3,-R*0.45,R*0.06,0,TAU); ctx.arc(R*0.3,-R*0.45,R*0.06,0,TAU); ctx.fill();
  } else if (id === 'button'){
    ctx.fillStyle='#BE9F63'; ctx.beginPath(); ctx.arc(0,0,R*0.72,0,TAU); ctx.fill();
    ctx.strokeStyle='#96804F'; ctx.lineWidth=R*0.07; ctx.beginPath(); ctx.arc(0,0,R*0.55,0,TAU); ctx.stroke();
    ctx.fillStyle='#7C6842';
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>{ ctx.beginPath(); ctx.arc(a*R*0.2,b*R*0.2,R*0.1,0,TAU); ctx.fill(); });
  } else if (id === 'ticket'){
    ctx.fillStyle='#E3D9C2'; ctx.save(); ctx.rotate(-0.16);
    rr(ctx,-R*0.85,-R*0.5,R*1.7,R, R*0.12); ctx.fill();
    ctx.fillStyle='#A0906F';
    for(let i=0;i<3;i++){ rr(ctx,-R*0.6,-R*0.26+i*R*0.24,R*1.0,R*0.08,R*0.04); ctx.fill(); }
    ctx.restore();
  } else if (id === 'snail'){
    ctx.fillStyle='#C2AB8C';
    ctx.beginPath(); ctx.ellipse(R*0.45,R*0.2,R*0.55,R*0.24,0,0,TAU); ctx.fill();
    ctx.strokeStyle='#9A8362'; ctx.lineWidth=R*0.16; ctx.lineCap='round';
    ctx.beginPath();
    for (let a=0;a<TAU*2.2;a+=0.12){ const rad=R*0.09*a; const px=-R*0.15+Math.cos(a)*rad, py=Math.sin(a)*rad;
      a ? ctx.lineTo(px,py) : ctx.moveTo(px,py); }
    ctx.stroke();
  } else if (id === 'thimble'){
    ctx.fillStyle='#B4B6B0';
    ctx.beginPath(); ctx.moveTo(-R*0.45,R*0.5); ctx.lineTo(-R*0.34,-R*0.3);
    ctx.quadraticCurveTo(0,-R*0.72,R*0.34,-R*0.3); ctx.lineTo(R*0.45,R*0.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(86,75,60,.3)';
    for(let i=0;i<12;i++){ const a=i/12*TAU; ctx.beginPath();
      ctx.arc(Math.cos(a)*R*0.2, -R*0.2+Math.sin(a)*R*0.13, R*0.05,0,TAU); ctx.fill(); }
  } else { // key
    ctx.strokeStyle='#A08C6C'; ctx.lineWidth=R*0.16; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(-R*0.4,0,R*0.3,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-R*0.1,0); ctx.lineTo(R*0.75,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(R*0.5,0); ctx.lineTo(R*0.5,R*0.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(R*0.72,0); ctx.lineTo(R*0.72,R*0.24); ctx.stroke();
  }
  ctx.restore();
}

/* ============================================================
   PARCELS — strange containers, all drawn procedurally
   ============================================================ */
const TINT = {tin:'#A9ABA4', crane:'#E6DCC8', fogjar:'#CBD3D1', cocoon:'#B08279',
               egg:'#EDE4D4', bundle:'#D6C7AA', crate:'#C2A87F'};

function drawBody(ctx, P, box, st, t){
  const {cx, cy, w, h} = box;
  const sq = st.squeeze || 0;
  ctx.save();
  ctx.globalAlpha = st.alpha ?? 1;
  ctx.translate(cx, cy);
  boilShift(ctx, (st.bseed || 0) + 11, 0.85);
  if (st.shake) ctx.translate((Math.random()-0.5)*st.shake, (Math.random()-0.5)*st.shake);
  ctx.scale(1 + sq*0.09, 1 - sq*0.055);
  ctx.translate(-cx, -cy);
  const L = cx - w/2, T = cy - h/2;
  const pencil = 'rgba(86,75,60,.38)';

  ctx.save(); ctx.fillStyle = 'rgba(112,96,76,.17)';
  ctx.beginPath(); ctx.ellipse(cx, cy + h*0.46, w*0.4, h*0.04, 0, 0, TAU); ctx.fill(); ctx.restore();
  ctx.strokeStyle = pencil; ctx.lineWidth = 1.2;

  if (P.id === 'tin'){
    const g = ctx.createLinearGradient(L, 0, L+w, 0);
    g.addColorStop(0,'#8E918B'); g.addColorStop(.3,'#BCBEB6'); g.addColorStop(.58,'#A5A79F');
    g.addColorStop(.82,'#8F928C'); g.addColorStop(1,'#7C7F7A');
    ctx.fillStyle = g; rr(ctx, L, T + h*0.14, w, h*0.86, w*0.1); ctx.fill(); outline(ctx);
    const br = mulberry32(11);
    for (let i=0;i<9;i++){
      const bx = L + w*(0.12 + br()*0.76), by = T + h*(0.28 + br()*0.62), rad = w*(0.03 + br()*0.045);
      ctx.fillStyle='#DCD6C6'; ctx.beginPath(); ctx.arc(bx,by,rad,0,TAU); ctx.fill();
      ctx.fillStyle='#A8A492'; ctx.beginPath(); ctx.arc(bx,by,rad*0.45,0,TAU); ctx.fill();
    }
    const lift = (st.lidLift||0) * h*0.42;
    ctx.save(); ctx.translate(0, -lift);
    const lg = ctx.createLinearGradient(L,0,L+w,0);
    lg.addColorStop(0,'#94978F'); lg.addColorStop(.35,'#C6C8C0'); lg.addColorStop(1,'#84877F');
    ctx.fillStyle = lg; rr(ctx, L - w*0.03, T, w*1.06, h*0.2, w*0.06); ctx.fill(); outline(ctx);
    ctx.restore();

  } else if (P.id === 'crane'){
    ctx.fillStyle = '#E7DCC3';
    ctx.beginPath(); ctx.moveTo(cx - w*0.46, cy + h*0.2); ctx.lineTo(cx + w*0.3, cy + h*0.34);
    ctx.lineTo(cx + w*0.46, cy - h*0.1); ctx.lineTo(cx, cy - h*0.2); ctx.closePath();
    ctx.fill(); outline(ctx);
    ctx.fillStyle = '#C6B695';
    ctx.beginPath(); ctx.moveTo(cx, cy - h*0.2); ctx.lineTo(cx + w*0.46, cy - h*0.1);
    ctx.lineTo(cx + w*0.12, cy - h*0.44); ctx.closePath(); ctx.fill(); outline(ctx);
    ctx.fillStyle = '#F6F0E2';
    ctx.beginPath(); ctx.moveTo(cx - w*0.46, cy + h*0.2); ctx.lineTo(cx, cy - h*0.2);
    ctx.lineTo(cx - w*0.2, cy - h*0.4); ctx.closePath(); ctx.fill(); outline(ctx);
    ctx.fillStyle = '#D3C4A4';
    ctx.beginPath(); ctx.moveTo(cx - w*0.2, cy - h*0.4); ctx.lineTo(cx - w*0.44, cy - h*0.5);
    ctx.lineTo(cx - w*0.24, cy - h*0.26); ctx.closePath(); ctx.fill(); outline(ctx);
    ctx.strokeStyle = 'rgba(86,75,60,.2)';
    ctx.beginPath(); ctx.moveTo(cx, cy - h*0.2); ctx.lineTo(cx + w*0.12, cy + h*0.27); ctx.stroke();

  } else if (P.id === 'fogjar'){
    const lift = (st.lidLift||0) * h*0.4;
    const jarPath = () => {
      ctx.beginPath();
      ctx.moveTo(L + w*0.26, T + h*0.18); ctx.lineTo(L + w*0.08, T + h*0.34);
      ctx.lineTo(L + w*0.08, T + h*0.92); ctx.quadraticCurveTo(L + w*0.08, T+h, L + w*0.2, T+h);
      ctx.lineTo(L + w*0.8, T + h); ctx.quadraticCurveTo(L + w*0.92, T+h, L + w*0.92, T + h*0.92);
      ctx.lineTo(L + w*0.92, T + h*0.34); ctx.lineTo(L + w*0.74, T + h*0.18); ctx.closePath();
    };
    ctx.save();
    const jg = ctx.createLinearGradient(L,0,L+w,0);
    jg.addColorStop(0,'rgba(168,182,182,.62)'); jg.addColorStop(.3,'rgba(224,232,230,.55)');
    jg.addColorStop(.7,'rgba(190,202,200,.55)'); jg.addColorStop(1,'rgba(150,164,164,.62)');
    jarPath(); ctx.fillStyle = jg; ctx.fill();
    ctx.save(); ctx.clip();
    for (let i=0;i<5;i++){
      const ph = i*1.7, fx = cx + Math.sin(t*0.25 + ph)*w*0.22,
            fy = T + h*(0.45 + i*0.11) + Math.cos(t*0.2+ph)*h*0.02;
      const fg = ctx.createRadialGradient(fx,fy,0,fx,fy,w*0.34);
      fg.addColorStop(0,'rgba(250,250,246,.62)'); fg.addColorStop(1,'rgba(250,250,246,0)');
      ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(fx,fy,w*0.34,0,TAU); ctx.fill();
    }
    ctx.restore();
    jarPath();
    ctx.strokeStyle = CFG.outlines ? 'rgba(86,75,60,.3)' : 'rgba(255,255,255,.6)';
    ctx.lineWidth = 1.6; ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.translate(0,-lift);
    ctx.fillStyle='#A08C6E'; rr(ctx, L + w*0.2, T + h*0.04, w*0.6, h*0.17, w*0.04); ctx.fill();
    ctx.strokeStyle = pencil; outline(ctx);
    ctx.fillStyle='rgba(255,252,244,.22)'; rr(ctx, L + w*0.2, T + h*0.04, w*0.6, h*0.06, w*0.03); ctx.fill();
    ctx.restore();

  } else if (P.id === 'cocoon'){
    const g = ctx.createRadialGradient(cx - w*0.16, cy - h*0.2, w*0.04, cx, cy, w*0.52);
    g.addColorStop(0,'#C29A8E'); g.addColorStop(.7,'#A87A6E'); g.addColorStop(1,'#875F56');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(cx, cy, w*0.34, h*0.46, 0, 0, TAU); ctx.fill(); outline(ctx);
    ctx.strokeStyle='rgba(240,226,214,.3)'; ctx.lineWidth=1.1;
    for (let i=0;i<26;i++){
      const u = i/26, yy = cy - h*0.44 + h*0.88*u, ww = w*0.34*Math.sin(Math.PI*clamp(u,0.02,0.98));
      ctx.beginPath(); ctx.moveTo(cx - ww, yy);
      ctx.quadraticCurveTo(cx, yy + (i%2?4:-4), cx + ww, yy); ctx.stroke();
    }
    if (sq > 0.02){
      ctx.strokeStyle = `rgba(252,246,232,${sq*0.85})`; ctx.lineWidth = 1 + sq*2.4;
      ctx.beginPath(); ctx.moveTo(cx, cy - h*0.4*sq); ctx.lineTo(cx, cy + h*0.4*sq); ctx.stroke();
    }

  } else if (P.id === 'egg'){
    const g = ctx.createRadialGradient(cx - w*0.14, cy - h*0.22, w*0.04, cx, cy, w*0.5);
    g.addColorStop(0,'#FAF5EA'); g.addColorStop(.62,'#E9DFCE'); g.addColorStop(1,'#CBBDA6');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(cx, cy + h*0.02, w*0.31, h*0.48, 0, Math.PI, TAU);
    ctx.ellipse(cx, cy + h*0.02, w*0.31, h*0.40, 0, 0, Math.PI);
    ctx.closePath(); ctx.fill(); outline(ctx);
    ctx.strokeStyle = `rgba(122,104,84,${0.22 + sq*0.6})`; ctx.lineWidth = 0.8 + sq*1.8;
    const cr = mulberry32(7);
    for (let i=0;i<5;i++){
      let px = cx + (cr()-0.5)*w*0.3, py = cy + (cr()-0.5)*h*0.3;
      ctx.beginPath(); ctx.moveTo(px,py);
      for (let k=0;k<4;k++){ px += (cr()-0.5)*w*0.18*(0.3+sq); py += (cr()-0.5)*h*0.18*(0.3+sq); ctx.lineTo(px,py); }
      ctx.stroke();
    }
    if (sq > 0.3){
      ctx.fillStyle = `rgba(250,240,214,${(sq-0.3)*0.45})`;
      ctx.beginPath(); ctx.ellipse(cx, cy, w*0.3*sq, h*0.38*sq, 0, 0, TAU); ctx.fill();
    }

  } else if (P.id === 'bundle'){
    const kg = ctx.createLinearGradient(L, 0, L + w, 0);
    kg.addColorStop(0, '#D9CCB1'); kg.addColorStop(0.4, MOR.kraft); kg.addColorStop(1, '#C9BA9A');
    ctx.fillStyle = kg; rr(ctx, L + w*0.06, T + h*0.1, w*0.88, h*0.8, w*0.05);
    ctx.fill(); outline(ctx);
    ctx.fillStyle='rgba(122,104,84,.13)';
    rr(ctx, L + w*0.06, T + h*0.1, w*0.88, h*0.14, w*0.05); ctx.fill();
    ctx.strokeStyle='rgba(86,75,60,.22)'; ctx.lineWidth=1.1;
    ctx.beginPath(); ctx.moveTo(L + w*0.06, T + h*0.34); ctx.lineTo(L + w*0.94, T + h*0.34); ctx.stroke();
    if (w > 130){
      ctx.fillStyle='#8E7A5C'; ctx.font = '600 11px ' + F_SANS;
      ctx.textAlign='center'; ctx.fillText('FRAGILE — VERY', cx, T + h*0.24);
    }

  } else { // crate
    const wg2 = ctx.createLinearGradient(L, 0, L + w, 0);
    wg2.addColorStop(0, '#CBB28A'); wg2.addColorStop(0.45, '#C2A87F'); wg2.addColorStop(1, '#AE9569');
    ctx.fillStyle = wg2; rr(ctx, L + w*0.05, T + h*0.12, w*0.9, h*0.78, w*0.03);
    ctx.fill(); outline(ctx);
    ctx.strokeStyle='rgba(86,75,60,.24)'; ctx.lineWidth=1.2;
    for (let i=1;i<4;i++){
      const yy = T + h*0.12 + h*0.78*i/4;
      ctx.beginPath(); ctx.moveTo(L + w*0.05, yy); ctx.lineTo(L + w*0.95, yy); ctx.stroke();
    }
    ctx.strokeStyle='rgba(122,104,84,.3)'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(L + w*0.1, T + h*0.16); ctx.lineTo(L + w*0.9, T + h*0.86); ctx.stroke();
    ctx.save(); ctx.translate(cx, T + h*0.5); ctx.rotate(-0.12);
    ctx.strokeStyle='rgba(110,96,110,.42)'; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.arc(0,0,w*0.17,0,TAU); ctx.stroke();
    ctx.fillStyle='rgba(110,96,110,.42)';
    for (let i=0;i<5;i++){ rr(ctx, -w*0.1 + i*w*0.045, -w*0.03, w*0.025, w*0.06, 1); ctx.fill(); }
    ctx.restore();
    const lift = (st.lidLift||0) * h*0.4;
    ctx.save(); ctx.translate(0,-lift); ctx.fillStyle='#CFB68C';
    rr(ctx, L + w*0.02, T + h*0.02, w*0.96, h*0.16, w*0.03); ctx.fill();
    ctx.strokeStyle = pencil; ctx.lineWidth=1.2; outline(ctx); ctx.restore();
  }
  ctx.restore();
}

/* ============================================================
   GESTURES.  Each one is a tiny module: geometry, pointer
   handlers, and how it draws itself.
   ============================================================ */
const GES = {

  peel: {
    hint: 'Drag the <i>loose tape</i> back',
    init(Ly, r, box){
      const vert = r() < 0.4;
      const m = 0.62;
      if (vert){ Ly.a = {x: box.cx, y: box.cy - box.h*m/2}; Ly.b = {x: box.cx, y: box.cy + box.h*m/2}; }
      else     { Ly.a = {x: box.cx - box.w*m/2, y: box.cy}; Ly.b = {x: box.cx + box.w*m/2, y: box.cy}; }
      Ly.len = dist(Ly.a, Ly.b);
      Ly.dir = {x:(Ly.b.x-Ly.a.x)/Ly.len, y:(Ly.b.y-Ly.a.y)/Ly.len};
      Ly.perp = {x:-Ly.dir.y, y:Ly.dir.x};
      Ly.blip = 0;
    },
    at(Ly, u){ return {x: lerp(Ly.a.x, Ly.b.x, u), y: lerp(Ly.a.y, Ly.b.y, u)}; },
    down(Ly, p){ Ly.grab = dist(p, this.at(Ly, Ly.p)) < 58; },
    move(Ly, p, prev){
      if (!Ly.grab) return;
      const d = (p.x-prev.x)*Ly.dir.x + (p.y-prev.y)*Ly.dir.y;
      Ly.p = snap(clamp(Ly.p + d/Ly.len, 0, 1));
      if (Ly.p - Ly.blip > 0.055){ Ly.blip = Ly.p; Snd.peel(); buzz(4); }
    },
    up(Ly){ Ly.grab = false; },
    draw(ctx, Ly, box, t, active){
      const tw = 26;
      // still-stuck remainder
      const s = this.at(Ly, Ly.p);
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(Math.atan2(Ly.dir.y, Ly.dir.x));
      const rest = Ly.len*(1 - Ly.p);
      ctx.fillStyle = 'rgba(219,205,178,.95)';
      ctx.fillRect(0, -tw/2, rest, tw);
      ctx.strokeStyle = 'rgba(86,75,60,.34)'; ctx.lineWidth = 1;
      ctx.strokeRect(0, -tw/2, rest, tw);
      // peeled flap, curling back the other way
      const pl = Ly.len*Ly.p;
      if (pl > 1){
        const g = ctx.createLinearGradient(0,0,-pl,0);
        g.addColorStop(0,'rgba(236,227,206,.98)'); g.addColorStop(1,'rgba(205,190,161,.7)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(0,-tw/2);
        ctx.quadraticCurveTo(-pl*0.5, -tw/2 - 22, -pl, -tw/2 - 6);
        ctx.lineTo(-pl, tw/2 - 6);
        ctx.quadraticCurveTo(-pl*0.5, tw/2 - 22, 0, tw/2);
        ctx.closePath(); ctx.fill();
      }
      if (active && Ly.p < 1){                       // grab affordance
        const pulse = 1 + Math.sin(t*5)*0.14;
        ctx.strokeStyle = `rgba(152,124,62,${0.5 + Math.sin(t*5)*0.25})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 21*pulse, 0, TAU); ctx.stroke();
      }
      ctx.restore();
    },
  },

  snip: {
    hint: 'Swipe <i>across</i> the twine',
    init(Ly, r, box){
      const n = 1 + Math.floor(r()*2.4);
      Ly.cords = [];
      for (let i=0;i<n;i++){
        const vert = (i + (r()<0.5?0:1)) % 2 === 0;
        const off = (n === 1 ? 0 : (i/(n-1) - 0.5)) * 0.42;
        Ly.cords.push(vert
          ? {a:{x:box.cx + box.w*off, y:box.cy - box.h*0.52}, b:{x:box.cx + box.w*off, y:box.cy + box.h*0.52}, cut:0}
          : {a:{x:box.cx - box.w*0.52, y:box.cy + box.h*off}, b:{x:box.cx + box.w*0.52, y:box.cy + box.h*off}, cut:0});
      }
    },
    down(){},
    move(Ly, p, prev){
      for (const c of Ly.cords){
        if (!c.cut && (crosses(prev, p, c.a, c.b) || ptSegDist(p, c.a, c.b) < 8)){
          c.cut = 1; c.t = 0; Snd.snip(); buzz(12);
          Ly.p = Ly.cords.filter(x=>x.cut).length / Ly.cords.length;
        }
      }
    },
    up(){},
    tick(Ly, dt){ for (const c of Ly.cords) if (c.cut) c.t = Math.min(1, c.t + dt*2.6); },
    draw(ctx, Ly, box, t, active){
      for (const c of Ly.cords){
        const mid = {x:(c.a.x+c.b.x)/2, y:(c.a.y+c.b.y)/2};
        ctx.strokeStyle = '#A89170'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
        if (!c.cut){
          ctx.beginPath(); ctx.moveTo(c.a.x,c.a.y); ctx.lineTo(c.b.x,c.b.y); ctx.stroke();
          ctx.strokeStyle='rgba(252,247,235,.4)'; ctx.lineWidth=1.4;
          ctx.beginPath(); ctx.moveTo(c.a.x,c.a.y); ctx.lineTo(c.b.x,c.b.y); ctx.stroke();
          if (active){
            const k = 0.4 + Math.sin(t*5)*0.24;
            ctx.strokeStyle = `rgba(152,124,62,${k})`; ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(c.a.x,c.a.y); ctx.lineTo(c.b.x,c.b.y); ctx.stroke();
          }
        } else {
          const e = 1 - Math.pow(1 - c.t, 2), droop = e*26;
          for (const [end, sign] of [[c.a,-1],[c.b,1]]){
            ctx.beginPath(); ctx.moveTo(end.x, end.y);
            ctx.quadraticCurveTo(lerp(end.x, mid.x, .6), lerp(end.y, mid.y, .6) + droop,
                                 lerp(end.x, mid.x, .92) + sign*droop*0.3, lerp(end.y, mid.y, .92) + droop*1.5);
            ctx.stroke();
          }
        }
      }
    },
  },

  pop: {
    hint: 'Pop <i>every bubble</i>',
    init(Ly, r, box){
      Ly.bs = [];
      const cols = 4, rows = 5, iw = box.w*0.74, ih = box.h*0.7;
      for (let y=0;y<rows;y++) for (let x=0;x<cols;x++){
        Ly.bs.push({
          x: box.cx - iw/2 + iw*(x + 0.5)/cols + (r()-0.5)*4,
          y: box.cy - ih/2 + ih*(y + 0.5)/rows + (r()-0.5)*4,
          r: Math.min(iw/cols, ih/rows)*0.44, pop:0, s:r(),
        });
      }
    },
    hit(Ly, p){
      let any = false;
      for (const b of Ly.bs){
        if (!b.pop && dist(p, b) < b.r*1.25){
          b.pop = 1; any = true;
          Snd.pop(Ly.bs.filter(x=>x.pop).length); buzz(7);
        }
      }
      if (any) Ly.p = Ly.bs.filter(b=>b.pop).length / Ly.bs.length;
    },
    down(Ly, p){ this.hit(Ly, p); },
    move(Ly, p){ this.hit(Ly, p); },
    up(){},
    draw(ctx, Ly, box, t, active){
      ctx.save();
      for (const b of Ly.bs){
        if (b.pop){
          ctx.strokeStyle='rgba(86,75,60,.22)'; ctx.lineWidth=1.2;
          ctx.beginPath();
          ctx.moveTo(b.x - b.r*0.8, b.y);
          ctx.quadraticCurveTo(b.x, b.y + (b.s>0.5?5:-5), b.x + b.r*0.8, b.y);
          ctx.stroke();
        } else {
          const g = ctx.createRadialGradient(b.x - b.r*0.35, b.y - b.r*0.4, b.r*0.08, b.x, b.y, b.r);
          g.addColorStop(0,'rgba(255,254,250,.9)'); g.addColorStop(.6,'rgba(214,224,224,.62)');
          g.addColorStop(1,'rgba(168,180,180,.6)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
          if (active){
            ctx.strokeStyle = `rgba(152,124,62,${0.28 + Math.sin(t*4 + b.s*6)*0.2})`;
            ctx.lineWidth = 1.2; ctx.stroke();
          } else if (CFG.outlines){
            ctx.strokeStyle = 'rgba(86,75,60,.24)'; ctx.lineWidth = 1.2; ctx.stroke();
          }
          ctx.fillStyle = 'rgba(255,255,255,.55)';    // a highlight, not an edge
          ctx.beginPath(); ctx.arc(b.x - b.r*0.3, b.y - b.r*0.34, b.r*0.22, 0, TAU); ctx.fill();
        }
      }
      ctx.restore();
    },
  },

  unwind: {
    hint: 'Wind it off — <i>drag in circles</i>',
    init(Ly, r, box){ Ly.c = {x:box.cx, y:box.cy}; Ly.turns = 2.5; Ly.sum = 0; Ly.last = null; Ly.blip = 0; Ly.coil = 0; },
    down(Ly, p){ Ly.last = Math.atan2(p.y - Ly.c.y, p.x - Ly.c.x); },
    move(Ly, p){
      if (dist(p, Ly.c) < 26) return;
      const a = Math.atan2(p.y - Ly.c.y, p.x - Ly.c.x);
      if (Ly.last === null){ Ly.last = a; return; }
      let d = a - Ly.last;
      while (d >  Math.PI) d -= TAU;
      while (d < -Math.PI) d += TAU;
      Ly.last = a; Ly.sum += d;
      Ly.p = snap(clamp(Math.abs(Ly.sum) / (Ly.turns*TAU), 0, 1));
      if (Ly.p - Ly.blip > 0.07){ Ly.blip = Ly.p; Snd.thread(); buzz(3); }
    },
    up(Ly){ Ly.last = null; },
    tick(Ly, dt){ Ly.coil += (Ly.p - Ly.coil)*Math.min(1, dt*7); },
    draw(ctx, Ly, box, t, active){
      const N = 7, left = Math.ceil((1 - Ly.p)*N);
      ctx.save();
      ctx.strokeStyle = '#A8756A'; ctx.lineWidth = 3.4; ctx.lineCap='round';
      for (let i=0;i<left;i++){
        const u = (i + 0.5)/N;
        const yy = box.cy - box.h*0.42 + box.h*0.84*u;
        const ww = box.w*0.44*Math.sin(Math.PI*clamp(u, 0.14, 0.86));
        ctx.beginPath();
        ctx.moveTo(box.cx - ww, yy);
        ctx.quadraticCurveTo(box.cx, yy + (i%2 ? 9 : -9), box.cx + ww, yy);
        ctx.stroke();
      }
      // the coil it comes off onto
      if (Ly.coil > 0.01){
        const cxx = box.cx + box.w*0.62, cyy = box.cy + box.h*0.4;
        ctx.strokeStyle='#A8756A'; ctx.lineWidth=2.2;
        ctx.beginPath();
        for (let a=0; a<TAU*3*Ly.coil; a+=0.14){
          const rad = 3 + a*1.9;
          const px = cxx + Math.cos(a)*rad, py = cyy + Math.sin(a)*rad*0.6;
          a ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
        }
        ctx.stroke();
      }
      if (active && Ly.p < 1){
        const a = t*1.8, rad = box.w*0.5;
        ctx.strokeStyle = 'rgba(152,124,62,.55)'; ctx.lineWidth = 2;
        ctx.setLineDash([7,11]);
        ctx.beginPath(); ctx.arc(box.cx, box.cy, rad, a, a + 4.4); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle='rgba(152,124,62,.9)';
        ctx.beginPath(); ctx.arc(box.cx + Math.cos(a+4.4)*rad, box.cy + Math.sin(a+4.4)*rad, 4, 0, TAU); ctx.fill();
      }
      ctx.restore();
    },
  },

  squeeze: {
    hint: 'Press and <i>hold</i> until it gives',
    init(Ly){ Ly.f = 0; Ly.held = false; Ly.tick_ = 0; },
    down(Ly){ Ly.held = true; },
    move(){},
    up(Ly){ Ly.held = false; },
    tick(Ly, dt, input, active){
      if (Ly.f >= 1){ Ly.p = 1; return; }
      if (!active){ Ly.held = false; Ly.f = Math.max(0, Ly.f - dt*0.8); Ly.p = Ly.f; return; }
      // Real stylus pressure when we have it, hold-time everywhere else.
      const boost = (input.type === 'pen' && input.pressure > 0.05) ? 0.55 + input.pressure*1.1 : 1;
      if (Ly.held) Ly.f = clamp(Ly.f + dt/CFG.squeezeSeconds*boost, 0, 1);
      else         Ly.f = clamp(Ly.f - dt*0.8, 0, 1);
      Ly.p = Ly.f;
      Ly.tick_ += dt;
      if (Ly.held && Ly.tick_ > 0.1){ Ly.tick_ = 0; Snd.strain(Ly.f); }
      if (Ly.f >= 1 && !Ly.cracked){ Ly.cracked = true; Snd.crack(); buzz(30); }
    },
    draw(ctx, Ly, box, t, active){
      if (!active && Ly.p >= 1) return;
      const y = box.cy + box.h*0.62, w = box.w*0.5;
      ctx.save();
      ctx.fillStyle='rgba(86,75,60,.2)'; rr(ctx, box.cx - w/2, y, w, 7, 3.5); ctx.fill();
      const g = ctx.createLinearGradient(box.cx - w/2, 0, box.cx + w/2, 0);
      g.addColorStop(0,'#BE9F63'); g.addColorStop(1,'#B08C74');
      ctx.fillStyle = g; rr(ctx, box.cx - w/2, y, Math.max(2, w*Ly.f), 7, 3.5); ctx.fill();
      if (active && Ly.f < 1){
        // two rings contracting inward: "press here, and keep pressing"
        for (let i=0;i<2;i++){
          const u = ((t*0.7 + i*0.5) % 1);
          ctx.strokeStyle = `rgba(152,124,62,${(1-u)*(Ly.held ? 0.5 : 0.32)})`;
          ctx.lineWidth = 2.4;
          ctx.beginPath(); ctx.arc(box.cx, box.cy, box.w*(0.2 + 0.36*(1-u)), 0, TAU); ctx.stroke();
        }
      }
      ctx.restore();
    },
  },

  lift: {
    hint: 'Lift the lid — <i>drag upward</i>',
    init(Ly){ Ly.grab = false; Ly.base = 0; },
    down(Ly, p, box){ Ly.grab = p.y < box.cy + box.h*0.3; Ly.y0 = p.y; Ly.base = Ly.p; },
    move(Ly, p){
      if (!Ly.grab) return;
      const was = Ly.p;
      Ly.p = snap(clamp(Ly.base + (Ly.y0 - p.y)/140, 0, 1));
      if (Ly.p > was + 0.08) Snd.rustle();
    },
    up(Ly){ Ly.grab = false; if (Ly.p < DONE) Ly.p *= 0.5; },
    draw(ctx, Ly, box, t, active){
      if (!active || Ly.p >= 1) return;
      const pulse = Math.sin(t*4)*0.5 + 0.5;
      ctx.save();
      ctx.strokeStyle = `rgba(152,124,62,${0.3 + pulse*0.45})`; ctx.lineWidth = 2.4; ctx.lineCap='round';
      const ax = box.cx, ay = box.cy - box.h*0.56 - pulse*7;
      ctx.beginPath(); ctx.moveTo(ax, ay + 18); ctx.lineTo(ax, ay - 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ax - 7, ay); ctx.lineTo(ax, ay - 9); ctx.lineTo(ax + 7, ay); ctx.stroke();
      ctx.restore();
    },
  },
};

function inspectBook(p){
  const h = bookHit(p);
  if (!h) return;
  if (h.kind === 'species'){
    const b = S.book[h.sp.id];
    if (!b){ note(h.sp.name.replace(/./g, '·') + ' — not found yet. Keep opening parcels.', 3000); return; }
    const hues = VARIANTS.filter(v => b.v[v.id]).map(v => v.name);
    note('<b>' + h.sp.name + '</b><br>' + SP[h.sp.id].poem + '<br>' +
         hues.length + '/' + VARIANTS.length + ' colourways: ' + hues.join(', '), 4600);
  } else if (h.kind === 'decor'){
    note(S.decorFound[h.d.id] ? '<b>' + h.d.name + '</b><br>' + h.d.note
                              : 'An ornament you have not been sent yet.', 4000);
  } else {
    note('<b>' + CU[h.id].name + '</b>', 2400);
  }
}

/* ============================================================
   CANVAS + LAYOUT
   ============================================================ */
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  W = Math.min(window.innerWidth, 480);
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  UI.s = clamp(Math.min(W/390, H/760), 0.9, 1.3) * 1.18;
  document.documentElement.style.setProperty('--ui', UI.s.toFixed(3));
  if (V.mode === 'unwrap') relayout();
}
function relayout(){
  const keep = V.layers.map(L => L.p);
  V.box = layoutBox();
  const r = mulberry32(4242);
  V.layers.forEach((L, i) => {
    GES[L.kind].init(L, r, V.box);
    L.p = keep[i];
    if (L.kind === 'pop'){ const n = Math.round(L.p*L.bs.length); L.bs.forEach((b,j) => b.pop = j < n ? 1 : 0); }
    if (L.kind === 'snip'){ const n = Math.round(L.p*L.cords.length); L.cords.forEach((c,j) => { c.cut = j<n?1:0; c.t=1; }); }
    if (L.kind === 'squeeze') L.f = L.p;
  });
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ============================================================
   STATE + SAVE
   ============================================================ */
const KEY = 'parcel-petal-v1';
/* A slot holds {g, life, st, t0}: the genome, parcels of life left, its state
   ('ok' | 'wilt' | 'ill') and when that state began. */
function newFlower(g, r){
  const v = r ? (1 - CFG.lifeSpread + 2*CFG.lifeSpread*r()) : 1;
  return { g, life: Math.round(CFG.flowerLife * v), st: 'ok', t0: 0 };
}
function fresh(){
  return { v:3, mail:CFG.startParcels, lastAccrual:Date.now(), pity:0, opened:0,
           tonics:CFG.tonicStart, lost:0, pressed:0,
           sill:new Array(9).fill(null), book:{},
           decor:new Array(3).fill(null),   // the ledge
           decorFound:{}, story:[],          // ornaments seen; story ids, in arrival order
           streak:1, lastDay:today(), special:'', specialPending:false, seen:false };
}
let S = fresh();
try {
  const raw = localStorage.getItem(KEY);
  if (raw){
    const o = JSON.parse(raw);
    if (o && o.v >= 1 && o.v <= 3){
      S = Object.assign(fresh(), o);
      if (o.v === 1){                       // v1 kept one undifferentiated "oddments" bag
        S.story = STORY.filter(x => o.odd && o.odd[x.id]).map(x => x.id);
        S.decor = new Array(3).fill(null);
        S.decorFound = {};
        delete S.odd;
        S.v = 2;
      }
      if (!Array.isArray(S.decor) || S.decor.length !== 3) S.decor = new Array(3).fill(null);
      if (!Array.isArray(S.story)) S.story = [];
      if (!S.decorFound) S.decorFound = {};
      if (!(o.v >= 3)){                  // slots used to hold a bare genome
        S.sill = S.sill.map(x => (x && !x.g) ? newFlower(x) : x);
        S.tonics = CFG.tonicStart; S.lost = 0; S.pressed = 0;
        S.v = 3;
      }
      if (typeof S.tonics !== 'number') S.tonics = 0;
    }
  }
} catch(e){}
let saveT = 0;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* scene state — deliberately not persisted */
const V = { screen:'table', mode:'idle', t:0, box:null, P:null, layers:[], genome:null, curio:null,
            special:false, bloom:0, shellA:1, shards:[], pollen:[], placing:false,
            bookScroll:0, bookDrag:null, grab:null, decor:null, story:null,
            note:'', noteT:0, shake:0 };

/* ---------- derived ---------- */
function hueGap(a, b){ return Math.abs(((a - b) % 360 + 540) % 360 - 180); }

/* How much of itself a flower still brings to the arrangement. */
function vigour(f){
  if (!f) return 0;
  if (f.st === 'ok') return 1;
  const span = (f.st === 'ill' ? CFG.illHours : CFG.wiltHours) * 3600e3;
  const u = clamp((Date.now() - f.t0) / span, 0, 1);
  return f.st === 'ill' ? (1 - u) * 0.55 : lerp(1, CFG.wiltFloor, u);
}
const ailing = f => !!f && f.st !== 'ok';

/* Life is spent by opening parcels — never by the clock. */
function ageSill(r){
  for (let i = 0; i < 9; i++){
    const f = S.sill[i];
    if (!f || f.st !== 'ok') continue;
    f.life--;
    if (f.life <= 0){ f.st = 'wilt'; f.t0 = Date.now(); }
    else if (r() < CFG.illChance){ f.st = 'ill'; f.t0 = Date.now(); }
  }
}
/* Only the last stretch runs on the wall clock, and the two endings differ:
   a flower that simply finished is preserved; one lost to illness is not. */
function resolveSill(){
  const now = Date.now();
  let pressed = 0, lost = 0;
  for (let i = 0; i < 9; i++){
    const f = S.sill[i]; if (!f || f.st === 'ok') continue;
    const span = (f.st === 'ill' ? CFG.illHours : CFG.wiltHours) * 3600e3;
    if (now - f.t0 < span) continue;
    if (f.st === 'wilt'){ recordFlower(f.g); S.pressed++; pressed++; }
    else { S.lost++; lost++; }
    S.sill[i] = null;
  }
  return { pressed, lost };
}
function useTonic(i){
  const f = S.sill[i];
  if (!f || !ailing(f) || S.tonics <= 0) return false;
  S.tonics--;
  f.st = 'ok'; f.t0 = 0;
  f.life = Math.max(f.life, Math.round(CFG.flowerLife * 0.8));
  Snd.chime('uncommon');
  updateHUD(); save();
  return true;
}

/* The sill is scored over its twelve neighbour pairs. Each pair takes its best
   bond tier, bonded neighbours are unioned into a set, and every pot in a set
   is thrown in the same glaze so the arrangement can be read at a glance. */
function harmony(){
  const parent = Array.from({length:9}, (_,i) => i);
  const find = a => parent[a] === a ? a : (parent[a] = find(parent[a]));
  const union = (a,b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };

  const bonds = [], tally = {};
  let sum = 0;
  for (let i=0;i<9;i++){
    if (!S.sill[i]) continue;
    for (const j of [(i%3 < 2) ? i+1 : -1, (i < 6) ? i+3 : -1]){
      if (j < 0 || !S.sill[j]) continue;
      const b = bondBetween(S.sill[i].g, S.sill[j].g);
      if (!b) continue;
      const w = Math.min(vigour(S.sill[i]), vigour(S.sill[j]));
      bonds.push({ i, j, tier: b.id, vertical: j === i+3, w });
      tally[b.id] = (tally[b.id] || 0) + 1;
      sum += CFG.bond[b.id] * w;         // a fading flower keeps less of its bond
      union(i, j);
    }
  }

  // a whole shelf of three, both of its pairs bonded
  let shelves = 0;
  for (let r=0;r<3;r++){
    const a = r*3;
    if (S.sill[a] && S.sill[a+1] && S.sill[a+2] &&
        bonds.some(x => x.i===a && x.j===a+1) && bonds.some(x => x.i===a+1 && x.j===a+2)) shelves++;
  }
  const full = S.sill.every(Boolean);
  const decorOn = (S.decor || []).filter(Boolean).length;

  const size = {};
  for (let i=0;i<9;i++) if (S.sill[i]){ const r = find(i); size[r] = (size[r] || 0) + 1; }
  const glazeOf = new Array(9).fill(-1), seat = {};
  let next = 0;
  for (let i=0;i<9;i++){
    if (!S.sill[i]) continue;
    const r = find(i);
    if (size[r] < 2) continue;                       // a lone flower keeps a plain pot
    if (!(r in seat)) seat[r] = next++ % GLAZES.length;
    glazeOf[i] = seat[r];
  }

  const mult = Math.min(CFG.harmonyCap,
    1 + sum + shelves*CFG.shelfAccord + (full ? CFG.fullSill : 0) + decorOn*CFG.decorBonus);
  return { bonds, tally, pairs: bonds.length, shelves, full, decorOn,
           groups: next, glazeOf, mult, root: find };
}
function bondsAt(i, hm){
  return hm.bonds.filter(b => b.i === i || b.j === i);
}

function bookStats(){
  const sp = Object.keys(S.book).length;
  let cw = 0; for (const k in S.book) cw += Object.keys(S.book[k].v).length;
  return { sp, spAll: SPECIES.length, cw, cwAll: SPECIES.length*VARIANTS.length,
           dec: Object.keys(S.decorFound).length, decAll: DECOR.length,
           sto: S.story.length, stoAll: STORY.length };
}
/* The sender writes on a schedule, not a dice roll, so the thread stays in order. */
function storyDue(){
  const n = S.story.length;
  return n < STORY.length && S.opened >= CFG.storyAt[n] ? STORY[n] : null;
}
function undiscovered(){ return SPECIES.filter(s => !S.book[s.id]); }

/* ---------- day rollover: streak wilts, it never resets ---------- */
function dayCheck(){
  const d = today();
  if (S.lastDay !== d){
    const y = new Date(Date.now() - 864e5).toISOString().slice(0,10);
    if (S.lastDay === y) S.streak++;
    else { const was = S.streak; S.streak = Math.max(1, Math.ceil(S.streak/2));
           if (was > S.streak) note('Your streak wilted a little. ' + S.streak + ' day' + (S.streak>1?'s':'') + ' left.'); }
    S.lastDay = d;
  }
  if (S.special !== d){
    S.special = d; S.specialPending = true;
    S.mail = Math.min(CFG.parcelCap + 2, S.mail + 1);
  }
}
/* ---------- parcels accrue while you are away, and then stop ---------- */
function accrue(){
  const iv = CFG.parcelIntervalMs / harmony().mult;
  const now = Date.now();
  if (S.mail >= CFG.parcelCap){ S.lastAccrual = now; return; }
  while (S.mail < CFG.parcelCap && now - S.lastAccrual >= iv){ S.mail++; S.lastAccrual += iv; }
}
function nextIn(){
  const iv = CFG.parcelIntervalMs / harmony().mult;
  return Math.max(0, iv - (Date.now() - S.lastAccrual));
}

function updateHUD(){
  const hm = harmony();

function mmss(ms){
  const m = Math.floor(ms/60000), sec = Math.floor(ms/1000) % 60;
  return m + ':' + String(sec).padStart(2,'0');
}
/* Nothing on screen should be a mystery you have to guess at. */
function explainMail(){
  if (S.mail >= CFG.parcelCap)
    note('The table is full: ' + S.mail + ' parcels. Nothing more accrues until you open some — ' +
         'nothing is lost by leaving them.', 4200);
  else
    note(S.mail === 0
      ? 'No parcels yet. The next arrives in ' + mmss(nextIn()) + '.'
      : S.mail + (S.mail === 1 ? ' parcel' : ' parcels') + ' waiting. The next arrives in ' +
        mmss(nextIn()) + '.', 3600);
}
function explainHarmony(){
  const hm = harmony();
  if (hm.mult <= 1.0001){
    note('Parcels arrive every ' + Math.round(CFG.parcelIntervalMs/1000) + 's. ' +
         'Stand flowers that agree next to each other on the sill and they arrive faster.', 4400);
    return;
  }
  const parts = BONDS.filter(b => hm.tally[b.id]).map(b => hm.tally[b.id] + ' ' + b.name.toLowerCase());
  if (hm.shelves) parts.push(hm.shelves + (hm.shelves === 1 ? ' shelf' : ' shelves') + ' in accord');
  if (hm.full) parts.push('a full sill');
  if (hm.decorOn) parts.push(hm.decorOn + ' on the ledge');
  note('Parcels arrive ×' + hm.mult.toFixed(2) + ' faster — ' + parts.join(', ') +
       '. That is one every ' + mmss(CFG.parcelIntervalMs/hm.mult) + '.', 4600);
}
function explainTonic(){
  const sick = S.sill.map((f,i) => ailing(f) ? i : -1).filter(i => i >= 0);
  const wilt = sick.filter(i => S.sill[i].st === 'wilt').length;
  const ill  = sick.length - wilt;
  const parts = [];
  parts.push(S.tonics + (S.tonics === 1 ? ' tonic' : ' tonics') + ' on the shelf.');
  if (ill)  parts.push(ill + (ill === 1 ? ' flower is ill' : ' flowers are ill') +
                       ' — untreated it is lost, and does not reach the book.');
  if (wilt) parts.push(wilt + (wilt === 1 ? ' flower has finished its season' : ' flowers have finished their season') +
                       ' — left alone they are pressed into the book.');
  if (!sick.length) parts.push('Nothing on the sill needs one. Tap an ailing flower to spend it.');
  note(parts.join(' '), 5200);
}
function explainStreak(){
  note(S.streak + (S.streak === 1 ? ' day' : ' days') + ' in a row. A day missed only wilts it ' +
       '— it halves, it never resets to nothing.', 4000);
}
