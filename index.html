/* ============================================================
   OPENING A PARCEL
   ============================================================ */
function layoutBox(){
  const s = Math.min(W*0.66, 268);
  return { cx: W/2, cy: H*0.62, w: s, h: s };
}
function openParcel(){
  if (S.mail <= 0) return;
  S.mail--;
  const r = mulberry32((Math.random()*1e9)|0);

  // heavier parcels are rarer but pay better
  let P;
  do { P = pick(r, PARCELS); } while (P.heavy && r() < 0.62);
  V.P = P;
  V.box = layoutBox();
  V.layers = P.layers.map(k => { const L = {kind:k, p:0}; GES[k].init(L, r, V.box); return L; });

  const und = undiscovered();
  const due = storyDue();
  V.genome = null; V.story = null; V.decor = null; V.tonic = false; V.special = false;
  V.sown = null; V.petalsGot = 0;
  if (due){
    // A letter outranks everything, and does not burn the day's special delivery.
    V.story = due;
  } else {
    V.special = !!S.specialPending;
    S.specialPending = false;
    if (S.seed && SP[S.seed]){
      /* A sown packet outranks everything but a letter, including the day's
         special delivery — it was paid for, and it must never be quietly
         skipped. If the two land on the same parcel the packet simply arrives
         at the special's better rarity instead of being spent on nothing. */
      V.genome = makeGenome(r, V.special ? { sp: S.seed, ra: r() < 0.55 ? 'rare' : 'uncommon' }
                                         : { sp: S.seed });
      V.sown = SP[S.seed].name;
      S.seed = null;
    } else if (V.special && und.length){
      V.genome = makeGenome(r, { sp: pick(r, und).id, ra: r() < 0.55 ? 'rare' : 'uncommon' });
    } else if (r() < CFG.tonicChance){
      V.tonic = true;
    } else if (r() < CFG.decorChance){
      V.decor = pick(r, DECOR);
    } else {
      let forced = null;
      if (S.pity >= CFG.pityAt - 1) forced = r() < 0.2 ? 'legendary' : 'rare';
      else if (P.heavy) forced = r() < 0.34 ? 'rare' : 'uncommon';
      V.genome = makeGenome(r, forced ? { ra: forced } : {});
    }
  }
  ageSill(r);
  V.mode = 'unwrap'; V.bloom = 0; V.shellA = 1; V.shards = []; V.pollen = [];
  setScreen('table');
  updateHUD(); save();
}

function recordFlower(g){
  const b = S.book[g.sp] || (S.book[g.sp] = { g, v:{}, mu:{}, n:0 });
  const newSpecies = b.n === 0, newVariant = !b.v[g.va];
  b.v[g.va] = (b.v[g.va] || 0) + 1;
  if (g.mu) b.mu[g.mu] = (b.mu[g.mu] || 0) + 1;
  b.n++;
  return { newSpecies, newVariant };
}

function activeLayer(){ return V.layers.find(L => L.p < DONE) || null; }

function completeParcel(){
  V.mode = 'bloom'; V.bloom = 0; V.shake = 9;
  Snd.whump();
  const tint = TINT[V.P.id] || '#ccc';
  for (let i=0;i<20;i++){
    const a = Math.random()*TAU, sp = 90 + Math.random()*260;
    V.shards.push({ x: V.box.cx + (Math.random()-0.5)*V.box.w*0.6,
                    y: V.box.cy + (Math.random()-0.5)*V.box.h*0.6,
                    vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 140,
                    rot: Math.random()*TAU, vr: (Math.random()-0.5)*9,
                    s: 6 + Math.random()*13, col: tint, life: 1 });
  }
  if (V.story){
    if (!S.story.includes(V.story.id)) S.story.push(V.story.id);
    Snd.chime('rare');
  } else if (V.tonic){
    S.tonics++;
    Snd.chime('rare');
  } else if (V.decor){
    V.decorNew = !S.decorFound[V.decor.id];
    S.decorFound[V.decor.id] = (S.decorFound[V.decor.id] || 0) + 1;
    Snd.chime('uncommon');
  } else {
    const g = V.genome, rar = g.ra;
    const rec = recordFlower(g);
    V.isNewSpecies = rec.newSpecies;
    V.isNewVariant = rec.newVariant;
    // A flower you already had used to be worth a counter and nothing else.
    // Now it is worth petals, which is what keeps the late game moving once
    // the book stops surprising you.
    V.petalsGot = (rec.newSpecies || rec.newVariant)
      ? CFG.petal.first
      : (CFG.petal.dup[rar] || 1);
    S.petals += V.petalsGot;
    S.opened++;
    S.pity = (rar === 'rare' || rar === 'legendary') ? 0 : S.pity + 1;
    Snd.chime(rar);
    const ph = phenotype(g);
    for (let i=0;i<26;i++){
      const a = Math.random()*TAU, sp = 20 + Math.random()*70;
      V.pollen.push({ x: V.box.cx, y: V.box.cy, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 30,
                      r: 1.2 + Math.random()*2.6, life: 1, col: i%3 ? ph.cEdge : ph.cCen2 });
    }
  }
  save();
  setTimeout(showSheet, 820);
}

function placeAt(i){
  if (V.placing !== 'flower' || !V.genome) return;
  const old = S.sill[i];
  S.sill[i] = newFlower(V.genome, Math.random);
  V.placing = false; V.genome = null;
  Snd.press();
  const hm = harmony(), mine = bondsAt(i, hm);
  note(old ? 'Swapped. The old one is pressed into the book.'
           : mine.length
             ? 'Placed — ' + mine.map(b => BD[b.tier].name.toLowerCase()).join(' and ') +
               '. Parcels arrive ×' + hm.mult.toFixed(2) + ' faster.'
             : 'Placed. No bond yet — try a neighbour it agrees with.', 3000);
  V.mode = 'idle';
  updateHUD(); save();
}
function placeDecor(i){
  if (V.placing !== 'decor' || !V.decor) return;
  S.decor[i] = V.decor.id;
  V.placing = false; V.decor = null;
  Snd.press();

/* ============================================================
   INPUT
   ============================================================ */
const input = { down:false, p:{x:0,y:0}, prev:{x:0,y:0}, type:'mouse', pressure:0 };
function pos(e){
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
cv.addEventListener('pointerdown', e => {
  Snd.resume();
  const p = pos(e);
  input.down = true; input.p = p; input.prev = p;
  input.type = e.pointerType || 'mouse'; input.pressure = e.pressure || 0;
  try { cv.setPointerCapture(e.pointerId); } catch(err){}

  if (V.screen === 'table'){
    if (V.mode === 'idle'){
      if (S.mail > 0) openParcel();
      else explainMail();
      return;
    }
    if (V.mode === 'unwrap'){ const L = activeLayer(); if (L) GES[L.kind].down(L, p, V.box); return; }
    return;
  }
  if (V.screen === 'shelf'){
    if (V.placing === 'decor'){ const d = ledgeAt(p); if (d >= 0) placeDecor(d); return; }
    if (V.placing === 'flower'){ const i = slotAt(p); if (i >= 0) placeAt(i); return; }
    const i = slotAt(p);
    if (i >= 0){
      if (S.sill[i]){ V.grab = {kind:'flower', idx:i, x:p.x, y:p.y, x0:p.x, y0:p.y, moved:false}; return; }
      note('An empty pot. Open a parcel, then put the flower here.', 2800); return;
    }
    const d = ledgeAt(p);
    if (d >= 0){
      if (S.decor[d]){ V.grab = {kind:'decor', idx:d, x:p.x, y:p.y, x0:p.x, y0:p.y, moved:false}; return; }
      note('A space on the ledge, for something that is not a flower.', 2800); return;
    }
    return;
  }
  if (V.screen === 'book'){ V.bookDrag = p.y; V.bookDrag0 = V.bookScroll; V.bookMoved = false; }
  if (V.screen === 'shop'){ V.shopDrag = p.y; V.shopDrag0 = V.shopScroll; V.shopMoved = false; }
});
cv.addEventListener('pointermove', e => {
  const p = pos(e);
  input.pressure = e.pressure || 0;
  input.type = e.pointerType || input.type;
  if (!input.down){ input.prev = input.p; input.p = p; return; }
  if (V.screen === 'table' && V.mode === 'unwrap'){
    const L = activeLayer();
    if (L) GES[L.kind].move(L, p, input.p, V.box);
  } else if (V.screen === 'shelf' && V.grab){
    V.grab.x = p.x; V.grab.y = p.y;
    // a small threshold keeps a tap an inspection, not a fumbled drag
    if (!V.grab.moved && Math.hypot(p.x - V.grab.x0, p.y - V.grab.y0) > 8) V.grab.moved = true;
  } else if (V.screen === 'shop' && V.shopDrag !== null){
    if (Math.abs(p.y - V.shopDrag) > 6) V.shopMoved = true;
    V.shopScroll = V.shopDrag0 - (p.y - V.shopDrag);
  } else if (V.screen === 'book' && V.bookDrag !== null){
    if (Math.abs(p.y - V.bookDrag) > 6) V.bookMoved = true;
    V.bookScroll = V.bookDrag0 - (p.y - V.bookDrag);
  }
  input.prev = input.p; input.p = p;
});
function endPointer(e){
  if (!input.down) return;
  input.down = false;
  const L = (V.screen === 'table' && V.mode === 'unwrap') ? activeLayer() : null;
  if (L) GES[L.kind].up(L, input.p, V.box);
  if (V.screen === 'book' && V.bookDrag !== null && !V.bookMoved) inspectBook(input.p);
  if (V.screen === 'shop' && V.shopDrag !== null && !V.shopMoved) shopTap(input.p);
  V.bookDrag = null; V.shopDrag = null;

  const gb = V.grab; V.grab = null;
  if (!gb) return;
  if (!gb.moved){                                   // a tap: tell me about this one
    if (gb.kind === 'flower'){
      const f = S.sill[gb.idx];
      if (ailing(f)){
        // a tonic is scarce enough that spending one should take two taps
        if (V.armed && V.armed.idx === gb.idx && Date.now() < V.armed.until){
          V.armed = null;
          if (useTonic(gb.idx)) note(flowerName(f.g) + ' recovers.', 2600);
        } else if (S.tonics > 0){
          V.armed = { idx: gb.idx, until: Date.now() + 4000 };
          note('<b>' + flowerName(f.g) + '</b> — ' +
               (f.st === 'ill' ? 'ill, and will be lost if untreated'
                               : 'has finished its season') +
               '.<br>Tap again to use a tonic (' + S.tonics + ' left).', 4000);
        } else {
          note('<b>' + flowerName(f.g) + '</b> — ' +
               (f.st === 'ill' ? 'ill. Without a tonic it will be lost, and will not reach the book.'
                               : 'has finished its season. Left alone it is pressed into the book.'),
               4400);
        }
        return;
      }
      const hm = harmony(), mine = bondsAt(gb.idx, hm);
      note(flowerName(f.g) + ' — ' + f.life + ' more ' + (f.life === 1 ? 'parcel' : 'parcels') + '. ' +
           (mine.length ? mine.map(b => BD[b.tier].name).join(', ')
                        : 'no bond with its neighbours yet'), 3200);
    } else {
      note(DE[S.decor[gb.idx]].name, 2000);
    }
    return;
  }
  const arr = gb.kind === 'flower' ? S.sill : S.decor;
  const t = gb.kind === 'flower' ? slotAt(input.p) : ledgeAt(input.p);
  if (t >= 0 && t !== gb.idx){
    const tmp = arr[t]; arr[t] = arr[gb.idx]; arr[gb.idx] = tmp;
    Snd.press();
    if (gb.kind === 'flower'){
      const hm = harmony(), mine = bondsAt(t, hm);
      if (mine.length) note(mine.map(b => BD[b.tier].name).join(' + ') +
                            ' &nbsp;·&nbsp; ×' + hm.mult.toFixed(2), 2200);
    }
    updateHUD(); save();
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('lostpointercapture', endPointer);
// Drag-scrolling alone left the foot of the page unreachable by the gesture a
// desktop player actually reaches for.
cv.addEventListener('wheel', e => {
  if (V.screen !== 'book' && V.screen !== 'shop') return;
  const d = e.deltaMode === 1 ? e.deltaY * 18 : e.deltaY;
  if (V.screen === 'book') V.bookScroll += d; else V.shopScroll += d;
  e.preventDefault();
}, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { dayCheck(); accrue(); updateHUD(); } });

/* Every canvas type size is a design size multiplied by UI.s, so legibility is
   one knob rather than forty literals. */
const UI = { s: 1 };
const F_SERIF = "'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif";
const F_SANS  = "ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
function wrapText(text, maxW, size, font){
  ctx.font = (size*UI.s).toFixed(2) + 'px ' + font;
  const words = String(text).split(' '), lines = [];
  let line = '';
  for (const w of words){
    const t = line ? line + ' ' + w : w;
    if (line && ctx.measureText(t).width > maxW){ lines.push(line); line = w; }
    else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
function txt(s, x, y, size, col, font = F_SANS, align='center', weight=''){
  ctx.font = (weight ? weight + ' ' : '') + (size*UI.s).toFixed(2) + 'px ' + font;
  ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
}

/* ============================================================
   BACKDROP
   ============================================================ */
function skyColors(){
  const h = new Date().getHours();
  if (h < 5)  return ['#B4BDC4','#D3D5D1','night'];
  if (h < 8)  return ['#E6D3C4','#F6F0E4','dawn'];
  if (h < 17) return ['#D5E1E4','#F1F2EA','day'];
  if (h < 20) return ['#EBD4BA','#DFD9D2','dusk'];
  return ['#B8C0C6','#D6D7D2','night'];
}
function wallMotif(ctx, motif){
  // Every motif is drawn at the same whisper. What changes between papers is
  // the figure, never the contrast — a paper you paid for must not start
  // shouting over the flowers.
  ctx.fillStyle = 'rgba(74,66,56,.016)';
  if (motif === 'stripe'){
    for (let x = 0; x < W; x += 38) ctx.fillRect(x, 0, 18, H);
  } else if (motif === 'check'){
    for (let x = 0; x < W; x += 34) ctx.fillRect(x, 0, 17, H);
    for (let y = 0; y < H; y += 34) ctx.fillRect(0, y, W, 17);
  } else if (motif === 'sprig'){
    // printed slightly out of register, which is what makes it read as printed
    const r = mulberry32(8181);
    ctx.strokeStyle = 'rgba(74,66,56,.05)'; ctx.lineWidth = 1.1;
    for (let y = -20; y < H + 20; y += 52){
      for (let x = -20; x < W + 20; x += 46){
        const jx = x + r()*5, jy = y + r()*5, a = r()*0.7 - 0.35;
        ctx.save(); ctx.translate(jx, jy); ctx.rotate(a);
        ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(0, 9); ctx.stroke();
        for (let k = -1; k <= 1; k++){
          ctx.beginPath();
          ctx.ellipse(4.2, k*5.4, 3.6, 1.7, 0.5, 0, TAU); ctx.fill();
          ctx.beginPath();
          ctx.ellipse(-4.2, k*5.4, 3.6, 1.7, -0.5, 0, TAU); ctx.fill();
        }
        ctx.restore();
      }
    }
  }
}
function paintRoom(ctx, kind){
  const [s1, s2, when] = skyColors();
  const PP_ = paper();
  const wg = ctx.createLinearGradient(0, 0, 0, H);
  wg.addColorStop(0, '#DAD5CA'); wg.addColorStop(0.58, PP_.wall); wg.addColorStop(1, PP_.wallLo);
  ctx.fillStyle = wg; ctx.fillRect(0, 0, W, H);

  wallMotif(ctx, PP_.motif);

  const wx = kind === 'shelf' ? W*0.07 : W*0.12, ww = kind === 'shelf' ? W*0.86 : W*0.76,
        wy = kind === 'shelf' ? H*0.155 : H*0.072,
        wh = kind === 'shelf' ? H*0.55  : H*0.325;

  ctx.fillStyle = 'rgba(122,106,86,.14)';                 // frame shadow on the wall
  rr(ctx, wx - 7, wy - 5, ww + 14, wh + 20, 6); ctx.fill();
  ctx.fillStyle = PP_.frame; rr(ctx, wx - 9, wy - 9, ww + 18, wh + 18, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,252,244,.3)'; rr(ctx, wx - 9, wy - 9, ww + 18, 5, 3); ctx.fill();

  const sg = ctx.createLinearGradient(0, wy, 0, wy + wh);
  sg.addColorStop(0, s1); sg.addColorStop(1, s2);
  ctx.fillStyle = sg; ctx.fillRect(wx, wy, ww, wh);
  ctx.save(); ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
  if (when === 'night'){
    const r = mulberry32(99);
    for (let i=0;i<26;i++){
      const x = wx + r()*ww, y = wy + r()*wh*0.8;
      const tw = 0.4 + 0.6*Math.abs(Math.sin(V.t*0.7 + i));
      ctx.fillStyle = `rgba(252,249,240,${tw*0.6})`;
      ctx.beginPath(); ctx.arc(x, y, 0.8 + r()*0.9, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(250,246,236,.7)';
    ctx.beginPath(); ctx.arc(wx + ww*0.72, wy + wh*0.2, ww*0.045, 0, TAU); ctx.fill();
  } else {
    for (let i=0;i<3;i++){
      const cx2 = wx + ((V.t*(4 + i*2.5) + i*ww*0.5) % (ww + 150)) - 75;
      const cy2 = wy + wh*(0.18 + i*0.17);
      ctx.fillStyle = 'rgba(255,253,247,.34)';
      ctx.beginPath();
      ctx.arc(cx2, cy2, ww*0.07, 0, TAU);
      ctx.arc(cx2 + ww*0.06, cy2 + 3, ww*0.05, 0, TAU);
      ctx.arc(cx2 - ww*0.06, cy2 + 4, ww*0.045, 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();
  ctx.strokeStyle = PP_.frame; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(wx + ww/2, wy); ctx.lineTo(wx + ww/2, wy + wh); ctx.stroke();
  if (kind !== 'shelf'){ ctx.beginPath(); ctx.moveTo(wx, wy + wh/2); ctx.lineTo(wx + ww, wy + wh/2); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(74,66,56,.12)'; ctx.lineWidth = 1;
  ctx.strokeRect(wx, wy, ww, wh);

  if (kind === 'table'){
    ctx.fillStyle = PP_.sill; rr(ctx, wx - 20, wy + wh + 8, ww + 40, 13, 3); ctx.fill();
    ctx.fillStyle = 'rgba(122,106,86,.16)'; ctx.fillRect(wx - 20, wy + wh + 21, ww + 40, 4);

    const tg = ctx.createLinearGradient(0, H*0.5, 0, H);
    tg.addColorStop(0, PP_.wood); tg.addColorStop(1, PP_.woodDk);
    ctx.fillStyle = tg; ctx.fillRect(0, H*0.53, W, H*0.47);
    ctx.fillStyle = 'rgba(69,62,52,.18)'; ctx.fillRect(0, H*0.53, W, 1.5);
    // a soft pool rather than a trapezoid — the straight edges read as a shape
    const pool = ctx.createRadialGradient(W/2, H*0.56, W*0.06, W/2, H*0.62, W*0.78);
    pool.addColorStop(0, 'rgba(255,251,238,.34)'); pool.addColorStop(1, 'rgba(255,251,238,0)');
    ctx.fillStyle = pool; ctx.fillRect(0, H*0.53, W, H*0.47);
    ctx.strokeStyle = 'rgba(74,66,56,.05)'; ctx.lineWidth = 1;      // grain
    for (let i = 1; i < 5; i++){
      const y = H*0.53 + H*0.47*i/5;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }
  const vg = ctx.createRadialGradient(W/2, H*0.42, H*0.2, W/2, H*0.5, H*0.8);
  vg.addColorStop(0, 'rgba(122,106,86,0)'); vg.addColorStop(1, 'rgba(122,106,86,.2)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}


/* The room is repainted only when something about it changes. It was costing a
   full-canvas wall gradient, a table gradient, a light pool, a vignette and a
   grain pass on every single frame, for pixels that were identical 59 times out
   of 60. Clouds and stars ride the same 8fps clock as the line boil, which is
   also how hand-drawn backgrounds move. */
const room = { key: '', cv: null, cx: null };
function drawBackdrop(kind){
  const w = Math.round(W*DPR), h = Math.round(H*DPR);
  const key = [kind, w, h, new Date().getHours(), S.paper,
               reduceMotion ? 0 : Math.floor(V.t * CFG.boil.fps)].join('|');
  if (room.key !== key){
    if (!room.cv) room.cv = document.createElement('canvas');
    if (room.cv.width !== w || room.cv.height !== h){
      room.cv.width = w; room.cv.height = h;
      room.cx = room.cv.getContext('2d');
    }
    room.cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    room.cx.clearRect(0, 0, W, H);
    room.cx.lineJoin = 'round'; room.cx.lineCap = 'round';
    paintRoom(room.cx, kind);
    if (grainPat){ room.cx.fillStyle = grainPat; room.cx.fillRect(0, 0, W, H); }
    room.key = key;
  }
  ctx.drawImage(room.cv, 0, 0, W, H);
  if (kind === 'table' && !reduceMotion) drawDust();
}
function drawDust(){
  ctx.save();
    // dust hanging in the window light. Drift is two slow sines rather than a
    // scroll, so nothing ever wraps and the specks simply hover.
      const dr = mulberry32(3131);
      for (let i = 0; i < 18; i++){
        const sp = 0.5 + dr()*0.9, rad = 0.8 + dr()*1.4;
        const x = W*(0.16 + dr()*0.68) + Math.sin(V.t*0.16*sp + i*1.3)*W*0.045;
        const y = H*(0.32 + dr()*0.52) + Math.sin(V.t*0.11*sp + i*2.2)*H*0.05;
        const tw = 0.22 + 0.78*Math.abs(Math.sin(V.t*0.5*sp + i*2.1));
        ctx.fillStyle = `rgba(255,253,243,${tw*0.55})`;
        ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
      }
  ctx.restore();
}

/* ============================================================
   TABLE SCREEN
   ============================================================ */
function drawTable(){
  drawBackdrop('table');

  if (V.mode === 'idle'){
    if (S.mail > 0){
      // up to three, laid out so each silhouette stays readable; the rest are counted
      const n = Math.min(S.mail, 3);
      const spots = [ {dx:-70, dy:-12, s:88}, {dx: 70, dy: -8, s:90}, {dx:  0, dy: 12, s:110} ];
      const order = n === 1 ? [2] : n === 2 ? [0, 2] : [0, 1, 2];
      const look = ['crate', 'tin', 'crane'];          // dark, mid, pale
      order.forEach((sl, i) => {
        const P = PARCELS.find(x => x.id === look[i]) || PARCELS[i];
        const o = spots[sl];
        drawBody(ctx, P, { cx: W/2 + o.dx, cy: H*0.7 + o.dy, w: o.s, h: o.s }, { bseed: i*61 }, V.t);
      });
      if (S.specialPending){
        const bx = W/2 + 84, by = H*0.575;
        ctx.save(); ctx.translate(bx, by); ctx.rotate(-0.2);
        ctx.fillStyle = MOR.ochre; rr(ctx, -36, -11, 72, 22, 5); ctx.fill();
        txt('SPECIAL', 0, 5, 10.5, '#3A3024', F_SANS, 'center', '700');
        ctx.restore();
      }
      txt(S.mail + (S.mail === 1 ? ' parcel' : ' parcels') + ' on the table', W/2, H*0.825, 17, MOR.ink, F_SERIF);
      hint('Tap to open');
    } else {
      const ms = nextIn(), iv = CFG.parcelIntervalMs / harmony().mult;
      const p = 1 - ms/iv, R = 54;
      ctx.save(); ctx.translate(W/2, H*0.68);
      ctx.strokeStyle = 'rgba(69,62,52,.15)'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.stroke();
      ctx.strokeStyle = MOR.ochre; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 0, R, -Math.PI/2, -Math.PI/2 + TAU*clamp(p,0,1)); ctx.stroke();
      const m = Math.floor(ms/60000), sc = Math.floor(ms/1000) % 60;
      txt(m + ':' + String(sc).padStart(2,'0'), 0, 6, 18, MOR.ink, F_SERIF);
      ctx.restore();
      txt('An empty table.', W/2, H*0.825, 17, MOR.ink3, F_SERIF);
      hint('The next parcel is on its way.');
    }
    return;
  }

  const box = V.box;
  if (V.mode === 'unwrap'){
    const L = activeLayer();
    const sq = V.layers.find(l => l.kind === 'squeeze' && l === L);
    const lf = V.layers.find(l => l.kind === 'lift');
    drawBody(ctx, V.P, box, { squeeze: sq ? sq.f : 0, lidLift: lf ? lf.p : 0, shake: V.shake }, V.t);
    for (let i = V.layers.length - 1; i >= 0; i--){
      const l = V.layers[i];
      if (l.p <= 0 && l !== L) continue;          // don't show wrapping you haven't reached
      GES[l.kind].draw(ctx, l, box, V.t, l === L);
    }
    txt(V.P.name, W/2, H*0.83, 15.5, MOR.ink2, F_SERIF);
    const step = V.layers.filter(l => l.p >= DONE).length + 1;
    hint((V.layers.length > 1 ? step + '/' + V.layers.length + ' &nbsp;·&nbsp; ' : '') + (L ? GES[L.kind].hint : ''));
    return;
  }

  // bloom
  if (V.shellA > 0.01) drawBody(ctx, V.P, box, { alpha: V.shellA, shake: V.shake }, V.t);
  for (const s of V.shards){
    ctx.save(); ctx.globalAlpha = clamp(s.life, 0, 1);
    ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.fillStyle = s.col;
    ctx.beginPath(); ctx.moveTo(-s.s/2, s.s/2); ctx.lineTo(s.s/2, s.s*0.2); ctx.lineTo(0, -s.s/2);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  const e = 1 - Math.pow(1 - V.bloom, 3);
  if (V.story){
    drawCurio(ctx, V.story.id, box.cx, box.cy - H*0.02, 54*e);
  } else if (V.tonic){
    drawTonic(ctx, box.cx, box.cy - H*0.02, 62*e);
  } else if (V.decor){
    drawDecor(ctx, V.decor.id, box.cx, box.cy - H*0.02, 52*e);
  } else {
    const ph = phenotype(V.genome);
    const R = Math.min(W*0.27, 112);
    drawFlower(ctx, ph, box.cx, box.cy - H*0.055, R*(0.25 + 0.75*e), V.bloom, V.t,
               { stemLen: Math.min(R*2.4, H*0.19) });
    if (V.genome.ra === 'legendary' || V.genome.ra === 'rare'){
      ctx.save();
      for (let i=0;i<7;i++){
        const a = V.t*0.6 + i/7*TAU, rad = R*(1.35 + Math.sin(V.t*2 + i)*0.1);
        ctx.fillStyle = `rgba(152,124,62,${0.26 + Math.sin(V.t*3 + i)*0.2})`;
        ctx.beginPath(); ctx.arc(box.cx + Math.cos(a)*rad, box.cy - H*0.055 + Math.sin(a)*rad*0.8, 2.8, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  }
  for (const p of V.pollen){
    ctx.globalAlpha = clamp(p.life, 0, 1)*0.9;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  hint('');
}

/* ============================================================
   SILL SCREEN
   ============================================================ */
function shelfGeom(){
  return { x0: W*0.21, dx: W*0.29, y0: H*0.335, dy: H*0.16,
           slot(i){ return { x: this.x0 + this.dx*(i%3), y: this.y0 + this.dy*Math.floor(i/3) }; } };
}
/* The ledge is centred rather than anchored, so growing it from three places
   to five re-composes the row instead of pushing it off the end. At three the
   numbers come out identical to the hand-placed layout they replace. */
function ledgeGeom(){
  const n = ledgeSlots();
  const dx = n <= LEDGE_SHORT ? W*0.23 : W*0.175;
  return { n, r: n <= LEDGE_SHORT ? 21 : 17, y: H*0.765, x0: W/2 - dx*(n - 1)/2, dx,
           slot(i){ return { x: this.x0 + this.dx*i, y: this.y }; } };
}
function ledgeAt(p){
  const g = ledgeGeom();
  for (let i=0;i<g.n;i++){
    const s = g.slot(i);
    if (Math.abs(p.x - s.x) < g.dx*0.46 && p.y > s.y - 40 && p.y < s.y + 14) return i;
  }
  return -1;
}
function slotAt(p){
  const g = shelfGeom();
  for (let i=0;i<9;i++){
    const s = g.slot(i);
    if (Math.abs(p.x - s.x) < g.dx*0.46 && p.y > s.y - g.dy*0.62 && p.y < s.y + g.dy*0.22) return i;
  }
  return -1;
}
function drawShelf(){
  drawBackdrop('shelf');
  const g = shelfGeom(), lg = ledgeGeom(), hm = harmony();
  const grab = V.grab && V.grab.moved ? V.grab : null;
  const hoverSlot  = grab && grab.kind === 'flower' ? slotAt(V.grab)  : -1;
  const hoverLedge = grab && grab.kind === 'decor'  ? ledgeAt(V.grab) : -1;

  for (let row=0; row<3; row++){
    const y = g.y0 + g.dy*row + 6;
    ctx.fillStyle = 'rgba(112,96,76,.16)'; ctx.fillRect(W*0.06, y + 9, W*0.88, 5);
    ctx.fillStyle = paper().sill; rr(ctx, W*0.06, y, W*0.88, 9, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,252,244,.28)'; rr(ctx, W*0.06, y, W*0.88, 3, 1.5); ctx.fill();
  }

  // pots and flowers
  for (let i=0;i<9;i++){
    const s = g.slot(i), fl = S.sill[i];
    const lifted = grab && grab.kind === 'flower' && grab.idx === i;
    if (fl && !lifted){
      const vig = vigour(fl);
      // closing, drooping and draining of colour together — one of them alone
      // is too quiet to notice on a shelf of nine
      ctx.save();
      ctx.globalAlpha = 0.5 + 0.5*vig;
      drawFlower(ctx, phenotype(fl.g), s.x, s.y - g.dy*0.52, Math.min(g.dx*0.34, 35),
                 0.34 + 0.66*vig, V.t + i,
                 { stemLen: g.dy*0.44, sway: 0.6, droop: 1.6*(1 - vig) });
      ctx.restore();
      drawPot(ctx, s.x, s.y, hm.glazeOf[i], 1.35, i*23);
      if (ailing(fl)){
        const ill = fl.st === 'ill';
        const pulse = 0.55 + 0.45*Math.sin(V.t*(ill ? 3.4 : 1.8) + i);
        ctx.save();
        ctx.globalAlpha = ill ? 0.5 + 0.5*pulse : 0.75;
        ctx.fillStyle = ill ? '#9C6B5A' : MOR.ink3;
        if (ill){
          ctx.beginPath(); ctx.arc(s.x + 18, s.y - 18, 6.4, 0, TAU); ctx.fill();
          ctx.fillStyle = '#F4EEE2';
          ctx.beginPath(); ctx.arc(s.x + 18, s.y - 15.6, 1.5, 0, TAU); ctx.fill();
          ctx.fillRect(s.x + 17.1, s.y - 21.4, 1.9, 4.4);
        } else {                                  // a petal already on the sill
          ctx.beginPath();
          ctx.ellipse(s.x + 18, s.y - 16, 5.4, 2.6, 0.5, 0, TAU); ctx.fill();
          ctx.globalAlpha *= 0.6;
          ctx.beginPath();
          ctx.ellipse(s.x + 11, s.y - 13, 4.2, 2.1, -0.3, 0, TAU); ctx.fill();
        }
        ctx.restore();
      }
    } else {
      const live = V.placing === 'flower' || lifted || hoverSlot === i;
      ctx.strokeStyle = live ? `rgba(152,124,62,${0.6 + Math.sin(V.t*4 + i)*0.28})`
                             : 'rgba(86,75,60,.26)';
      ctx.lineWidth = hoverSlot === i ? 2.6 : 1.8; ctx.setLineDash([5,5]);
      potPath(ctx, s.x, s.y, 1.35); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // bond marks: between the pots for a shelf-mate, stamped on the plank for the one below
  for (const bd of hm.bonds){
    if (grab && (grab.idx === bd.i || grab.idx === bd.j)) continue;
    const s1 = g.slot(bd.i), s2 = g.slot(bd.j);
    const col = POTS()[hm.glazeOf[bd.i] >= 0 ? hm.glazeOf[bd.i] : 0].rim;
    if (bd.vertical) bondGlyph(ctx, BD[bd.tier].glyph, s1.x, s1.y + 14, col, 6);
    else             bondGlyph(ctx, BD[bd.tier].glyph, (s1.x + s2.x)/2, s1.y - 4, col, 6.6);
  }

  // the window ledge, for things that are not flowers
  const ly = lg.y;
  ctx.fillStyle = 'rgba(112,96,76,.16)'; ctx.fillRect(W*0.08, ly + 13, W*0.84, 6);
  ctx.fillStyle = paper().sill; rr(ctx, W*0.08, ly, W*0.84, 13, 3.5); ctx.fill();
  ctx.fillStyle = 'rgba(255,253,247,.3)'; rr(ctx, W*0.08, ly, W*0.84, 4, 2); ctx.fill();
  for (let i=0;i<lg.n;i++){
    const s = lg.slot(i), id = S.decor[i];
    const lifted = grab && grab.kind === 'decor' && grab.idx === i;
    if (id && !lifted){
      drawDecor(ctx, id, s.x, s.y - 12, lg.r);
    } else {
      const live = V.placing === 'decor' || lifted || hoverLedge === i;
      ctx.strokeStyle = live ? `rgba(152,124,62,${0.6 + Math.sin(V.t*4 + i)*0.28})`
                             : 'rgba(86,75,60,.2)';
      ctx.lineWidth = hoverLedge === i ? 2.6 : 1.7; ctx.setLineDash([4,5]);
      ctx.beginPath(); ctx.arc(s.x, s.y - 12, lg.r - 2, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // whatever is currently in your hand
  if (grab){
    ctx.save();
    ctx.shadowColor = 'rgba(90,78,62,.3)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
    if (grab.kind === 'flower'){
      const fl = S.sill[grab.idx];
      drawFlower(ctx, phenotype(fl.g), grab.x, grab.y - 22, Math.min(g.dx*0.36, 37),
                 0.42 + 0.58*vigour(fl), V.t, { stemLen: g.dy*0.4, sway: 0.3 });
      drawPot(ctx, grab.x, grab.y + 18, hm.glazeOf[grab.idx], 1.4);
    } else {
      drawDecor(ctx, S.decor[grab.idx], grab.x, grab.y, 23);
    }
    ctx.restore();
  }

  if (V.placing === 'flower' && V.genome){
    drawFlower(ctx, phenotype(V.genome), W/2, H*0.86, 28, 1, V.t, { stem:false });
    hint('Tap a pot to place the <i>' + flowerName(V.genome) + '</i>');
  } else if (V.placing === 'decor' && V.decor){
    drawDecor(ctx, V.decor.id, W/2, H*0.86, 24);
    hint('Tap a spot on the ledge');
  } else if (S.sill.some(ailing)){
    const ill = S.sill.filter(f => f && f.st === 'ill').length;
    const w   = S.sill.filter(f => f && f.st === 'wilt').length;
    const bits = [];
    if (ill) bits.push(ill + (ill === 1 ? ' flower is ill' : ' flowers are ill'));
    if (w)   bits.push(w + (w === 1 ? ' has finished' : ' have finished'));
    hint(bits.join(' &nbsp;·&nbsp; ') + ' &nbsp;·&nbsp; <i>tap it</i> &nbsp;·&nbsp; ×' + hm.mult.toFixed(2));
  } else if (hm.bonds.length || hm.decorOn){
    const bits = [];
    if (hm.bonds.length) bits.push(hm.bonds.length + (hm.bonds.length === 1 ? ' bond' : ' bonds'));
    if (hm.shelves) bits.push(hm.shelves + (hm.shelves === 1 ? ' shelf' : ' shelves') + ' in accord');
    if (hm.full) bits.push('full sill');
    if (hm.decorOn) bits.push(hm.decorOn + ' on the ledge');
    hint(bits.join(' &nbsp;·&nbsp; ') + ' &nbsp;·&nbsp; <i>×' + hm.mult.toFixed(2) + '</i>');
  } else {
    hint('Drag flowers to rearrange &nbsp;·&nbsp; neighbours that agree share a glaze');
  }
  txt('The Windowsill', W/2, H*0.118, 21, MOR.ink, F_SERIF);
}

/* ============================================================
   HERBARIUM SCREEN
   ============================================================ */
/* The page is laid out first and drawn second. Measuring the real bottom is
   what lets the scroll range be exact instead of a guess, and it gives tap
   targets for free. */
function bookLayout(){
  const top = H*0.195, pad = 15;
  const cols = 2, cw = (W - pad*2 - 12)/cols, ch = 172;
  const L = { top, cw, ch, cells: [], decor: [], letters: [] };
  let y = 0;

  SPECIES.forEach((sp, i) => {
    L.cells.push({ sp, x: pad + (cw + 12)*(i % cols),
                   y: y + ch*Math.floor(i / cols), w: cw, h: ch - 12 });
  });
  y += ch*Math.ceil(SPECIES.length/cols) + 10;

  L.ledgeY = y; y += 34;
  const per = 3, dw = (W - pad*2)/per;
  DECOR.forEach((d, i) => {
    L.decor.push({ d, x: pad + dw*(i % per) + dw/2,
                   y: y + 40 + Math.floor(i / per)*76, r: 24 });
  });
  y += 40 + Math.ceil(DECOR.length/per)*76;

  L.senderY = y; y += 34;
  for (const id of S.story){
    const lines = wrapText(STORY.find(x => x.id === id).line, W - 108, 13, F_SERIF);
    const h = Math.max(46, lines.length*19*UI.s + 22);
    L.letters.push({ id, lines, x: pad, y, w: W - pad*2, h: h - 8 });
    y += h;
  }
  if (!S.story.length) y += 40;
  if (S.story.length === STORY.length){
    L.endLines = wrapText(STORY_END, W - 70, 13, F_SERIF);
    L.endY = y + 8; y += L.endLines.length*19*UI.s + 30;
  }
  L.total = y;
  L.maxScroll = Math.max(0, (top + y + 152) - H);   // clear the fade, the hint and the tab bar
  return L;
}
function bookHit(p){
  const L = bookLayout(), y = p.y - L.top + V.bookScroll;
  for (const c of L.cells)
    if (p.x > c.x && p.x < c.x + c.w && y > c.y && y < c.y + c.h) return { kind:'species', sp: c.sp };
  for (const d of L.decor)
    if (Math.hypot(p.x - d.x, y - d.y) < d.r + 10) return { kind:'decor', d: d.d };
  for (const l of L.letters)
    if (p.x > l.x && p.x < l.x + l.w && y > l.y && y < l.y + l.h) return { kind:'letter', id: l.id };
  return null;
}

const page = { key: '', cv: null, cx: null };
function drawPageBg(){
  const w = Math.round(W*DPR), h = Math.round(H*DPR), key = w + 'x' + h;
  if (page.key !== key){
    if (!page.cv) page.cv = document.createElement('canvas');
    page.cv.width = w; page.cv.height = h;
    page.cx = page.cv.getContext('2d');
    page.cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const bg = page.cx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0, MOR.card); bg.addColorStop(1, '#EDE7D9');
    page.cx.fillStyle = bg; page.cx.fillRect(0,0,W,H);
    if (grainPat){ page.cx.fillStyle = grainPat; page.cx.fillRect(0,0,W,H); }
    page.key = key;
  }
  ctx.drawImage(page.cv, 0, 0, W, H);
}

function drawBook(){
  drawPageBg();

  const st = bookStats(), L = bookLayout();
  V.bookScroll = clamp(V.bookScroll, 0, L.maxScroll);
  const sc = V.bookScroll, top = L.top;

  ctx.save();
  ctx.beginPath(); ctx.rect(0, top - 16, W, H - top + 16); ctx.clip();

  for (const c of L.cells){
    const y = c.y + top - sc;
    if (y > H + 60 || y < top - c.h - 60) continue;
    const b = S.book[c.sp.id];
    ctx.fillStyle = b ? 'rgba(255,253,247,.66)' : 'rgba(112,96,76,.05)';
    rr(ctx, c.x, y, c.w, c.h, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(69,62,52,.13)'; ctx.lineWidth = 1; ctx.stroke();
    if (b){
      drawFlower(ctx, phenotype(b.g), c.x + c.w/2, y + 62, Math.min(c.w*0.28, 44), 1,
                 V.t + c.y*0.01, { stem:false, sway:0.4 });
      txt(c.sp.name, c.x + c.w/2, y + 116, 13.5, MOR.ink, F_SERIF);
      txt('seen ' + b.n + (b.n === 1 ? ' time' : ' times'), c.x + c.w/2, y + 133, 10.5, MOR.ink3);
      VARIANTS.forEach((v, j) => {
        const dx = c.x + c.w/2 + (j - 2)*14;
        ctx.beginPath(); ctx.arc(dx, y + 148, 4.4, 0, TAU);
        ctx.fillStyle = b.v[v.id]
          ? pet(blendHue(lerp(c.sp.hue[0], c.sp.hue[1], .5), v.target, v.mix), 30 + v.ds, 66 + v.dl*0.5)
          : 'rgba(69,62,52,.12)';
        ctx.fill();
        if (b.v[v.id]){ ctx.strokeStyle = 'rgba(69,62,52,.2)'; ctx.lineWidth = 1; ctx.stroke(); }
      });
    } else {
      ctx.fillStyle = 'rgba(69,62,52,.06)';
      ctx.beginPath(); ctx.arc(c.x + c.w/2, y + 62, Math.min(c.w*0.24, 40), 0, TAU); ctx.fill();
      txt('?', c.x + c.w/2, y + 72, 28, 'rgba(69,62,52,.22)', F_SERIF);
      txt('— — —', c.x + c.w/2, y + 118, 13, 'rgba(69,62,52,.2)', F_SERIF);
    }
  }

  txt('The Ledge', W/2, L.ledgeY + top - sc + 14, 15, MOR.ink2, F_SERIF);
  for (const it of L.decor){
    const y = it.y + top - sc;
    if (y > H + 60 || y < top - 60) continue;
    if (S.decorFound[it.d.id]){
      drawDecor(ctx, it.d.id, it.x, y, it.r);
      if (S.decor.includes(it.d.id)){
        ctx.fillStyle = MOR.ochre;
        ctx.beginPath(); ctx.arc(it.x, y + it.r + 9, 3.4, 0, TAU); ctx.fill();
      }
    } else {
      ctx.fillStyle = 'rgba(69,62,52,.06)';
      ctx.beginPath(); ctx.arc(it.x, y, it.r*0.85, 0, TAU); ctx.fill();
    }
  }

  txt('The Sender', W/2, L.senderY + top - sc + 14, 15, MOR.ink2, F_SERIF);
  if (!L.letters.length){
    txt('Not everything in a parcel is a flower.', W/2, L.senderY + top - sc + 46,
        13, 'rgba(69,62,52,.34)', F_SERIF);
  }
  for (const l of L.letters){
    const y = l.y + top - sc;
    if (y > H + 60 || y < top - l.h - 60) continue;
    ctx.fillStyle = 'rgba(255,253,247,.62)';
    rr(ctx, l.x, y, l.w, l.h, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(69,62,52,.11)'; ctx.lineWidth = 1; ctx.stroke();
    drawCurio(ctx, l.id, l.x + 28, y + l.h/2, 17);
    ctx.font = 'italic ' + (13*UI.s).toFixed(2) + 'px ' + F_SERIF;
    ctx.fillStyle = MOR.ink2; ctx.textAlign = 'left';
    l.lines.forEach((line, k) => ctx.fillText(line, l.x + 58, y + 26 + k*19*UI.s));
    ctx.textAlign = 'center';
  }
  if (L.endLines)
    L.endLines.forEach((line, k) =>
      txt(line, W/2, L.endY + top - sc + 20 + k*19*UI.s, 13, MOR.ink3, F_SERIF));
  ctx.restore();

  // there is more page below: say so, rather than letting it look cut off
  if (L.maxScroll > 2){
    const fade = ctx.createLinearGradient(0, H - 150, 0, H - 86);
    fade.addColorStop(0, 'rgba(238,232,219,0)'); fade.addColorStop(1, 'rgba(238,232,219,.97)');
    ctx.fillStyle = fade; ctx.fillRect(0, H - 150, W, 150);

    const trackTop = top + 6, trackH = H - top - 130;
    const thumbH = Math.max(34, trackH * (H - top) / (L.total + top));
    const ty = trackTop + (trackH - thumbH) * (sc / L.maxScroll);
    ctx.fillStyle = 'rgba(69,62,52,.09)'; rr(ctx, W - 8, trackTop, 4, trackH, 2); ctx.fill();
    ctx.fillStyle = 'rgba(69,62,52,.3)';  rr(ctx, W - 8.5, ty, 5, thumbH, 2.5); ctx.fill();
  }

  const hg = ctx.createLinearGradient(0,0,0,top);
  hg.addColorStop(0, MOR.card); hg.addColorStop(.72, MOR.card); hg.addColorStop(1, 'rgba(248,244,234,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, W, top);
  txt('The Herbarium', W/2, H*0.115, 21, MOR.ink, F_SERIF);
  txt(st.sp + '/' + st.spAll + ' species · ' + st.cw + '/' + st.cwAll + ' colourways', W/2, H*0.142, 11.5, MOR.ink3);
  txt(st.dec + '/' + st.decAll + ' ornaments · ' + st.sto + '/' + st.stoAll + ' letters', W/2, H*0.165, 11.5, MOR.ink3);
  hint(st.sp < st.spAll ? (st.spAll - st.sp) + ' species missing &nbsp;·&nbsp; tap anything to read it'
                        : 'Every species accounted for. The colourways, though…');
}

/* ============================================================
   THE CATALOGUE
   ============================================================
   Everything the game will ever sell is in this one section, and it is short
   on purpose. Three rules hold it together:

   1. NOTHING FOR SALE TOUCHES THE RATE. Glazes and papers are paint. The long
      ledge is display space — it pays for its first three ornaments whether it
      holds three or five (CFG.ledgePays). A seed packet fills a gap in the book.
      None of them makes a parcel arrive sooner, which means no A/B test can
      ever find that making the game worse sells better.

   2. NO TONICS, EVER. Selling relief from a loss the game engineered is the one
      thing that would convert best and cost most. It is also why illness has no
      `illChance` constant to quietly raise — see illRisk().

   3. EVERYTHING IS REACHABLE WITH PETALS. Money buys petals faster; it does not
      buy anything petals cannot. A player who never pays anything still gets
      to every glaze, every paper and the long ledge.
   ============================================================ */

/* One seam for real money. The demo provider is what runs in a browser; the
   other two are where a platform SDK is wired in, and both need a bot or
   mini-programme backend to mint the invoice, so neither can work from a
   static file alone. */
const PAY = {
  provider: 'demo',                  // 'demo' | 'telegram' | 'wx'
  packs: [
    { id:'pouch', name:'A paper pouch',  petals: 400,  price:'0.99', stars: 75  },
    { id:'tin',   name:'A tin of petals', petals:1200, price:'2.99', stars: 225, best:true },
    { id:'crate', name:'A crate of them', petals:3000, price:'6.99', stars: 525 },
  ],
  label(pack){
    return this.provider === 'telegram' ? pack.stars + ' ★' : '$' + pack.price;
  },
  buy(pack, done){
    if (this.provider === 'telegram'){
      // Telegram Stars. The invoice link has to be created by the bot backend
      // (createInvoiceLink), because only the bot holds the token.
      const tg = window.Telegram && window.Telegram.WebApp;
      if (!tg || !tg.openInvoice){ done(false, 'Telegram is not available here.'); return; }
      fetch('/invoice?pack=' + pack.id).then(r => r.text()).then(url => {
        tg.openInvoice(url, st => done(st === 'paid', st));
      }).catch(() => done(false, 'The invoice could not be created.'));
      return;
    }
    if (this.provider === 'wx'){
      done(false, 'Virtual payment on a mini game needs a game licence.');
      return;
    }
    // demo: no money changes hands, and the button says so
    done(true, 'demo');
  },
};

function owns(kind, id){
  const it = kind === 'glaze' ? GS[id] : PA[id];
  return !it || it.price === 0 || !!S.owned[kind + ':' + id];
}
function spend(n){
  if (S.petals < n) return false;
  S.petals -= n; S.spent += n;
  return true;
}
/* Buying and applying are one tap in this game, because there is no reason to
   own a glaze you are not using. The second tap of the arm/confirm pair is the
   purchase, so nothing is ever bought by a mis-tap. */
function buyCosmetic(kind, id){
  const it = kind === 'glaze' ? GS[id] : PA[id];
  if (!it) return false;
  if (!owns(kind, id)){
    if (!spend(it.price)){
      note('That is ' + (it.price - S.petals) + ' more petals than you have. ' +
           'Flowers you already know pay petals when they arrive.', 4200);
      return false;
    }
    S.owned[kind + ':' + id] = 1;
    Snd.chime('rare');
    note('<b>' + it.name + '</b> is yours.', 2600);
  } else {
    Snd.press();
  }
  if (kind === 'glaze') S.glaze = id; else S.paper = id;
  room.key = '';                       // the room is cached; make it repaint
  updateHUD(); save();
  return true;
}
function buyLedge(){
  if (S.ledge) return false;
  if (!spend(CFG.shop.ledge)){
    note('The long ledge is ' + (CFG.shop.ledge - S.petals) + ' petals away yet.', 3600);
    return false;
  }
  S.ledge = true;
  while (S.decor.length < ledgeSlots()) S.decor.push(null);
  Snd.chime('legendary');
  note('The ledge runs the whole width of the window now. Two more places to ' +
       'stand things — for the look of it, not for the speed.', 5000);
  updateHUD(); save();
  return true;
}
function sowSeed(spId){
  if (!SP[spId]) return false;
  if (S.seed){ note('A packet is already sown. It comes with the next parcel.', 3000); return false; }
  if (!spend(CFG.shop.seed)){
    note('A packet is ' + CFG.shop.seed + ' petals. You have ' + S.petals + '.', 3400);
    return false;
  }
  S.seed = spId;
  Snd.chime('rare');
  note('<b>' + SP[spId].name + '</b> sown. It will be in the next parcel you open.', 4200);
  updateHUD(); save();
  return true;
}
function buyPetals(pack){
  PAY.buy(pack, (okp, why) => {
    if (!okp){ note(why || 'Nothing was charged.', 3600); return; }
    S.petals += pack.petals;
    Snd.chime('legendary');
    note('+' + pack.petals + ' petals' + (why === 'demo' ? ' &nbsp;·&nbsp; <i>demo — nothing was charged</i>' : '') + '.', 4000);
    updateHUD(); save();
  });
}

/* ---------- swatches: you should be able to see what you are buying ---------- */
function potSwatch(ctx, set, x, y, k){
  for (let i = 0; i < set.pots.length; i++){
    // drawn straight from the same table the sill uses, so the preview cannot
    // drift away from the thing itself
    const g = set.pots[i], px = x + i*17*k;
    ctx.fillStyle = g.body; potPath(ctx, px, y, 0.62*k); ctx.fill();
    ctx.fillStyle = g.rim;  rr(ctx, px - 8.4*k, y - 6.8*k, 16.8*k, 3.1*k, 1*k); ctx.fill();
  }
}
function paperSwatch(ctx, pa, x, y, w, h){
  ctx.save();
  ctx.beginPath(); rr(ctx, x, y, w, h, 5); ctx.clip();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, pa.wall); g.addColorStop(1, pa.wallLo);
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(74,66,56,.055)';
  if (pa.motif === 'stripe'){
    for (let i = x; i < x + w; i += 10) ctx.fillRect(i, y, 4.5, h);
  } else if (pa.motif === 'check'){
    for (let i = x; i < x + w; i += 10) ctx.fillRect(i, y, 4.5, h);
    for (let j = y; j < y + h; j += 10) ctx.fillRect(x, j, w, 4.5);
  } else if (pa.motif === 'sprig'){
    for (let j = y + 5; j < y + h; j += 13){
      for (let i = x + 6; i < x + w; i += 12){
        ctx.beginPath(); ctx.ellipse(i, j, 3, 1.4, 0.6, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.ellipse(i + 4, j + 4, 3, 1.4, -0.6, 0, TAU); ctx.fill();
      }
    }
  }
  // a window in it, so the swatch reads as a room rather than a colour chip
  const ww = w*0.56, wh = h*0.44, wx = x + (w - ww)/2, wy = y + h*0.16;
  ctx.fillStyle = pa.frame; rr(ctx, wx - 3, wy - 3, ww + 6, wh + 6, 3); ctx.fill();
  const sky = ctx.createLinearGradient(0, wy, 0, wy + wh);
  const sk = skyColors();
  sky.addColorStop(0, sk[0]); sky.addColorStop(1, sk[1]);
  ctx.fillStyle = sky; ctx.fillRect(wx, wy, ww, wh);
  ctx.fillStyle = pa.sill; rr(ctx, wx - 7, wy + wh + 4, ww + 14, 4.5, 2); ctx.fill();
  ctx.fillStyle = pa.wood; ctx.fillRect(x, y + h*0.8, w, h*0.2);
  ctx.restore();
  ctx.strokeStyle = 'rgba(69,62,52,.15)'; ctx.lineWidth = 1;
  rr(ctx, x, y, w, h, 5); ctx.stroke();
}
function petalGlyph(ctx, x, y, r, col){
  ctx.fillStyle = col;
  for (let i = 0; i < 4; i++){
    const a = i*Math.PI/2 + 0.4;
    ctx.beginPath();
    ctx.ellipse(x + Math.cos(a)*r*0.5, y + Math.sin(a)*r*0.5, r*0.5, r*0.28, a, 0, TAU);
    ctx.fill();
  }
}

/* ---------- laid out first, drawn second, exactly like the herbarium ---------- */
function shopLayout(){
  const top = H*0.205, pad = 15, w = W - pad*2;
  const L = { top, pad, w, rows: [], heads: [] };
  let y = 0;
  const head = t => { L.heads.push({ t, y }); y += 32; };

  head('Pots');
  for (const g of GLAZE_SETS){
    L.rows.push({ kind:'glaze', id:g.id, x:pad, y, w, h:84, it:g });
    y += 90;
  }
  head('Papers');
  for (const a of PAPERS){
    L.rows.push({ kind:'paper', id:a.id, x:pad, y, w, h:84, it:a });
    y += 90;
  }
  head('The Ledge');
  L.rows.push({ kind:'ledge', id:'ledge', x:pad, y, w, h:84 });
  y += 90;

  head('Seed Packets');
  const miss = undiscovered();
  L.seedY = y;
  L.seedLines = wrapText(
    S.seed ? SP[S.seed].name + ' is sown, and comes with the next parcel you open.'
    : !miss.length ? 'Every species is in the book. Nothing left to send for.'
    : 'Name a species you have never been sent. ' + CFG.shop.seed + ' petals, and it comes next.',
    w - 30, 12.5, F_SANS);
  y += 18 + L.seedLines.length*17*UI.s;
  if (miss.length && !S.seed){
    const per = Math.max(2, Math.floor(w / 118)), cw = w/per, chH = 34;
    miss.forEach((sp, i) => {
      L.rows.push({ kind:'seed', id:sp.id, x: pad + cw*(i % per) + 3,
                    y: y + Math.floor(i/per)*chH, w: cw - 6, h: chH - 5, it: sp });
    });
    y += Math.ceil(miss.length/per)*chH + 6;
  }

  head('Petals');
  for (const k of PAY.packs){
    L.rows.push({ kind:'pack', id:k.id, x:pad, y, w, h:64, it:k });
    y += 70;
  }
  L.noteY = y;
  L.noteLines = wrapText(
    'Not for sale, and never will be: tonics, faster parcels, a bigger sill, or anything ' +
    'else that undoes a loss. Everything above is paint, shelf space or a seed — and every ' +
    'one of them can be had with petals alone.', w - 24, 12, F_SERIF);
  y += L.noteLines.length*18*UI.s + 26;

  L.total = y;
  L.maxScroll = Math.max(0, (top + y + 152) - H);
  return L;
}
function shopHit(p){
  const L = shopLayout(), y = p.y - L.top + V.shopScroll;
  for (const r of L.rows)
    if (p.x >= r.x && p.x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r;
  return null;
}
/* Two taps to spend anything, the same as a tonic. The first tap says what it
   costs; the second is the purchase. */
function shopTap(p){
  const r = shopHit(p);
  if (!r) return;
  const key = r.kind + ':' + r.id;
  const armed = V.armedBuy && V.armedBuy.key === key && Date.now() < V.armedBuy.until;

  if (r.kind === 'glaze' || r.kind === 'paper'){
    if (owns(r.kind, r.id)){                       // already yours: just put it on
      if ((r.kind === 'glaze' ? S.glaze : S.paper) === r.id) note(r.it.note, 3200);
      else buyCosmetic(r.kind, r.id);
      return;
    }
    if (armed){ V.armedBuy = null; buyCosmetic(r.kind, r.id); return; }
    V.armedBuy = { key, until: Date.now() + 5000 };
    note('<b>' + r.it.name + '</b> · ' + r.it.price + ' petals. ' + r.it.note +
         '<br>Tap again to buy it. You have ' + S.petals + '.', 5000);
    return;
  }
  if (r.kind === 'ledge'){
    if (S.ledge){ note('The long ledge is already yours.', 2400); return; }
    if (armed){ V.armedBuy = null; buyLedge(); return; }
    V.armedBuy = { key, until: Date.now() + 5000 };
    note('<b>The long ledge</b> · ' + CFG.shop.ledge + ' petals. Two more places to stand ' +
         'things. It does not make parcels come faster — the ledge pays for three ' +
         'ornaments however long it is.<br>Tap again to buy it. You have ' + S.petals + '.', 6000);
    return;
  }
  if (r.kind === 'seed'){
    if (armed){ V.armedBuy = null; sowSeed(r.id); return; }
    V.armedBuy = { key, until: Date.now() + 5000 };
    note('<b>' + r.it.name + '</b> · ' + CFG.shop.seed + ' petals. ' + SP[r.id].poem +
         '<br>Tap again to sow it. You have ' + S.petals + '.', 5600);
    return;
  }
  if (r.kind === 'pack'){
    if (armed){ V.armedBuy = null; buyPetals(r.it); return; }
    V.armedBuy = { key, until: Date.now() + 5000 };
    note('<b>' + r.it.petals + ' petals</b> for ' + PAY.label(r.it) +
         (PAY.provider === 'demo' ? ' &nbsp;·&nbsp; <i>demo build: nothing is charged</i>' : '') +
         '<br>Tap again.', 5000);
  }
}

function drawShop(){
  drawPageBg();
  const L = shopLayout();
  V.shopScroll = clamp(V.shopScroll, 0, L.maxScroll);
  const sc = V.shopScroll, top = L.top;
  const now = Date.now();
  const isArmed = k => V.armedBuy && V.armedBuy.key === k && now < V.armedBuy.until;

  ctx.save();
  ctx.beginPath(); ctx.rect(0, top - 16, W, H - top + 16); ctx.clip();

  for (const h of L.heads){
    const y = h.y + top - sc;
    if (y < top - 40 || y > H + 20) continue;
    txt(h.t, W/2, y + 20, 15, MOR.ink2, F_SERIF);
  }

  // the seed blurb sits between its heading and its chips
  {
    const y = L.seedY + top - sc;
    if (y > top - 60 && y < H + 40)
      L.seedLines.forEach((ln, k) =>
        txt(ln, W/2, y + 14 + k*17*UI.s, 12.5, MOR.ink3, F_SANS));
  }

  for (const r of L.rows){
    const y = r.y + top - sc;
    if (y > H + 80 || y < top - r.h - 80) continue;
    const arm = isArmed(r.kind + ':' + r.id);

    if (r.kind === 'seed'){                            // a chip, not a card
      ctx.fillStyle = arm ? 'rgba(190,159,99,.26)' : 'rgba(255,253,247,.66)';
      rr(ctx, r.x, y, r.w, r.h, 8); ctx.fill();
      ctx.strokeStyle = arm ? MOR.ochre : 'rgba(69,62,52,.14)';
      ctx.lineWidth = arm ? 1.8 : 1; ctx.stroke();
      txt(r.it.name, r.x + r.w/2, y + r.h/2 + 4.5, 12.5, MOR.ink, F_SERIF);
      continue;
    }

    const have = r.kind === 'ledge' ? S.ledge
               : r.kind === 'pack'  ? false
               : owns(r.kind, r.id);
    const on   = r.kind === 'glaze' ? S.glaze === r.id
               : r.kind === 'paper' ? S.paper === r.id : false;
    const price = r.kind === 'ledge' ? CFG.shop.ledge
                : r.kind === 'pack'  ? null : r.it.price;
    const canAfford = price == null || S.petals >= price;

    ctx.fillStyle = on ? 'rgba(255,253,247,.9)' : 'rgba(255,253,247,.6)';
    rr(ctx, r.x, y, r.w, r.h, 11); ctx.fill();
    ctx.strokeStyle = arm ? MOR.ochre : on ? 'rgba(148,120,58,.5)' : 'rgba(69,62,52,.13)';
    ctx.lineWidth = arm ? 2.2 : on ? 1.8 : 1; ctx.stroke();

    // --- preview ---
    const px = r.x + 16, pcy = y + r.h/2;
    if (r.kind === 'glaze')      potSwatch(ctx, r.it, px + 4, pcy + 6, 0.95);
    else if (r.kind === 'paper') paperSwatch(ctx, r.it, px, y + 14, 74, r.h - 28);
    else if (r.kind === 'ledge'){
      ctx.fillStyle = paper().sill; rr(ctx, px, pcy + 10, 74, 6, 3); ctx.fill();
      for (let i = 0; i < 5; i++){
        const cx2 = px + 9 + i*14.5;
        ctx.fillStyle = i < 3 ? MOR.ink3 : (S.ledge ? MOR.ochre : 'rgba(69,62,52,.16)');
        ctx.beginPath(); ctx.arc(cx2, pcy + 1, 4.6, 0, TAU); ctx.fill();
      }
    } else if (r.kind === 'pack'){
      petalGlyph(ctx, px + 20, pcy, 19, MOR.ochre);
    }

    // --- name, note ---
    const tx = r.x + (r.kind === 'pack' ? 54 : 102);
    const name = r.kind === 'ledge' ? 'The Long Ledge'
               : r.kind === 'pack'  ? r.it.petals + ' petals' : r.it.name;
    ctx.textAlign = 'left';
    txt(name, tx, y + 27, 15, MOR.ink, F_SERIF, 'left');
    const note0 = r.kind === 'ledge'
      ? 'Five places instead of three. For the look of it — the ledge still pays for three.'
      : r.kind === 'pack' ? (r.it.best ? 'The one most people take.' : r.it.name) : r.it.note;
    wrapText(note0, r.w - (tx - r.x) - 96, 11.5, F_SANS)
      .slice(0, 3)
      .forEach((ln, k) => txt(ln, tx, y + 44 + k*14.5*UI.s, 11.5, MOR.ink3, F_SANS, 'left'));
    ctx.textAlign = 'center';

    // --- the price, or what it is ---
    const bx = r.x + r.w - 14;
    let tag, col;
    if (r.kind === 'pack'){ tag = PAY.label(r.it); col = MOR.ink; }
    else if (on)   { tag = 'in use'; col = '#8A7238'; }
    else if (have) { tag = 'put it on';   col = MOR.ink2; }
    else if (price === 0) { tag = 'yours'; col = MOR.ink3; }
    else { tag = price + ' ❦'; col = canAfford ? MOR.ink : 'rgba(69,62,52,.34)'; }
    ctx.textAlign = 'right';
    txt(tag, bx, y + r.h/2 + (r.kind === 'pack' ? 4 : 4), 12.5, col, F_SANS, 'right',
        canAfford && !have ? '600' : '');
    if (r.kind === 'pack' && PAY.provider === 'demo')
      txt('demo', bx, y + r.h/2 + 20, 9.5, 'rgba(69,62,52,.3)', F_SANS, 'right');
    ctx.textAlign = 'center';
  }

  // the promise, in the same place every time
  {
    const y = L.noteY + top - sc;
    if (y > top - 80 && y < H + 40){
      ctx.fillStyle = 'rgba(112,96,76,.05)';
      rr(ctx, L.pad, y - 4, L.w, L.noteLines.length*18*UI.s + 18, 9); ctx.fill();
      ctx.font = 'italic ' + (12*UI.s).toFixed(2) + 'px ' + F_SERIF;
      L.noteLines.forEach((ln, k) =>
        txt(ln, W/2, y + 16 + k*18*UI.s, 12, MOR.ink3, F_SERIF));
    }
  }
  ctx.restore();

  if (L.maxScroll > 2){
    const fade = ctx.createLinearGradient(0, H - 150, 0, H - 86);
    fade.addColorStop(0, 'rgba(238,232,219,0)'); fade.addColorStop(1, 'rgba(238,232,219,.97)');
    ctx.fillStyle = fade; ctx.fillRect(0, H - 150, W, 150);
    const trackTop = top + 6, trackH = H - top - 130;
    const thumbH = Math.max(34, trackH * (H - top) / (L.total + top));
    const ty = trackTop + (trackH - thumbH) * (sc / L.maxScroll);
    ctx.fillStyle = 'rgba(69,62,52,.09)'; rr(ctx, W - 8, trackTop, 4, trackH, 2); ctx.fill();
    ctx.fillStyle = 'rgba(69,62,52,.3)';  rr(ctx, W - 8.5, ty, 5, thumbH, 2.5); ctx.fill();
  }

  const hg = ctx.createLinearGradient(0, 0, 0, top);
  hg.addColorStop(0, MOR.card); hg.addColorStop(.72, MOR.card); hg.addColorStop(1, 'rgba(248,244,234,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, W, top);
  txt('The Sundries Catalogue', W/2, H*0.115, 21, MOR.ink, F_SERIF);
  // measured rather than guessed, so the glyph never lands on the number
  const cap = S.petals + ' pressed ' + (S.petals === 1 ? 'petal' : 'petals');
  ctx.font = (12.5*UI.s).toFixed(2) + 'px ' + F_SANS;
  const capW = ctx.measureText(cap).width, gw = 22, gap = 7;
  const x0 = W/2 - (gw + gap + capW)/2;
  petalGlyph(ctx, x0 + gw/2, H*0.152, 11, MOR.ochre);
  txt(cap, x0 + gw + gap, H*0.157, 12.5, MOR.ink2, F_SANS, 'left');
  ctx.textAlign = 'center';
  hint(S.seed ? '<i>' + SP[S.seed].name + '</i> is sown &nbsp;·&nbsp; it comes with the next parcel'
              : 'Flowers you already know pay petals when they arrive');
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = 0, accT = 0;
function frame(ts){
  const dt = Math.min(0.05, last ? (ts - last)/1000 : 0);
  last = ts; V.t += dt;

  if (V.screen === 'table' && V.mode === 'unwrap'){
    const L = activeLayer();
    for (const l of V.layers){
      const G = GES[l.kind];
      if (G.tick) G.tick(l, dt, input, l === L);
    }
    if (!activeLayer()) completeParcel();
  }
  if (V.mode === 'bloom'){
    V.bloom = Math.min(1, V.bloom + dt*1.6);
    V.shellA = Math.max(0, V.shellA - dt*3.4);
  }
  V.shake = Math.max(0, V.shake - dt*36);

  for (let i = V.shards.length - 1; i >= 0; i--){
    const s = V.shards[i];
    s.vy += 900*dt; s.x += s.vx*dt; s.y += s.vy*dt; s.rot += s.vr*dt; s.life -= dt*0.9;
    if (s.life <= 0 || s.y > H + 60) V.shards.splice(i, 1);
  }
  for (let i = V.pollen.length - 1; i >= 0; i--){
    const p = V.pollen[i];
    p.vy += 42*dt; p.vx *= 0.99; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*0.42;
    if (p.life <= 0) V.pollen.splice(i, 1);
  }

  accT += dt;
  if (accT > 0.5){
    accT = 0;
    const before = S.mail;
    dayCheck(); accrue();
    const done = resolveSill();
    if (done.pressed || done.lost){
      const bits = [];
      if (done.pressed) bits.push(done.pressed + (done.pressed === 1 ? ' flower finished its season and is pressed into the book' : ' flowers finished their season and are pressed into the book'));
      if (done.lost)    bits.push(done.lost + (done.lost === 1 ? ' was lost to illness' : ' were lost to illness'));
      note(bits.join('. ') + '.', 5200);
      save();
    }
    updateHUD();
    if (S.mail !== before) save();
  }
  if (V.noteT > 0){ V.noteT -= dt; if (V.noteT <= 0) elToast.style.opacity = 0; }
  saveT += dt; if (saveT > 8){ saveT = 0; save(); }

  boilTick(V.t);
  paint();

  requestAnimationFrame(frame);
}

/* ---------- dev surface: tune numbers live from the console ---------- */
window.PP = { S, V, CFG, GES, SPECIES, VARIANTS, RARITY, CURIOS,
              save, openParcel, phenotype, harmony, bookStats, updateHUD, note,
              drawFlower, makeGenome, mulberry32, ctx, get W(){return W}, get H(){return H},
              BONDS, BD, bondBetween, DECOR, STORY, storyDue, bondsAt, showSheet, flowerName, bookLayout,
              newFlower, vigour, ailing, ageSill, resolveSill, useTonic, recordFlower,
              shelfGeom, ledgeGeom, slotAt, ledgeAt, ledgeSlots, neighbours, illRisk,
              GLAZE_SETS, GS, PAPERS, PA, glazeSet, paper, POTS,
              PAY, owns, spend, buyCosmetic, buyLedge, sowSeed, buyPetals,
              shopLayout, shopHit, shopTap, undiscovered, setScreen,
              BOIL, boilTick, paint,
              reset(){ localStorage.removeItem(KEY); location.reload(); } };

function paint(){
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (V.screen === 'table') drawTable();
  else if (V.screen === 'shelf') drawShelf();
  else if (V.screen === 'shop') drawShop();
  else drawBook();
}

/* ---------- go ---------- */
resize();
makeGrain(ctx);
makeBoil();
dayCheck();
accrue();
updateHUD();
requestAnimationFrame(frame);
</script>
