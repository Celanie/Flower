<style>
:root{
  --ink:#241d2a; --paper:#f6efe2; --wall:#2c3f49; --wall2:#1a272e;
  --wood:#b07a45; --gold:#e8c46a; --dim:#93a3ab;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#101519;color:var(--paper);
  font-family:var(--sans);-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;justify-content:center;align-items:stretch}
#stage{display:block;touch-action:none}

/* ---- overlay column, matches canvas width ---- */
.col{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;pointer-events:none}
.col>*{pointer-events:auto}

#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;font-size:12.5px}
.pill{background:rgba(12,20,24,.52);border:1px solid rgba(246,239,226,.14);
  border-radius:999px;padding:5px 10px;letter-spacing:.02em;white-space:nowrap;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill b{font-weight:650}
#tabs{margin-left:auto;display:flex;gap:4px;background:rgba(12,20,24,.52);
  border:1px solid rgba(246,239,226,.14);border-radius:999px;padding:3px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#tabs button{font:inherit;font-size:12px;color:var(--dim);background:none;border:0;
  padding:5px 11px;border-radius:999px;cursor:pointer;transition:.18s}
#tabs button.on{background:rgba(246,239,226,.92);color:#1a272e;font-weight:650}

#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  text-align:center;padding:0 26px;font-size:13.5px;color:#d7cec0;
  text-shadow:0 1px 10px rgba(0,0,0,.7);transition:opacity .3s;line-height:1.45}
#hint i{font-style:normal;color:var(--gold)}

#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  font-family:var(--serif);font-size:17px;text-align:center;opacity:0;
  transition:opacity .4s;text-shadow:0 2px 16px rgba(0,0,0,.8);pointer-events:none;
  padding:0 30px;line-height:1.4}

/* ---- sheets ---- */
.sheet{position:absolute;left:0;right:0;bottom:0;padding:22px 22px calc(env(safe-area-inset-bottom,0px) + 20px);
  background:linear-gradient(to top,rgba(10,16,20,.95) 30%,rgba(10,16,20,.72) 75%,transparent);
  transform:translateY(102%);transition:transform .42s cubic-bezier(.2,.9,.25,1);text-align:center}
.sheet.up{transform:translateY(0)}
.rar{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.9}
.nm{font-family:var(--serif);font-size:25px;margin:6px 0 2px;line-height:1.15}
.mu{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.pm{font-family:var(--serif);font-style:italic;font-size:14px;color:#c8bfb1;margin:0 0 17px;line-height:1.45}
.btns{display:flex;gap:9px}
button.act{flex:1;font:inherit;font-size:13.5px;font-weight:600;padding:13px 8px;border-radius:13px;
  border:1px solid rgba(246,239,226,.2);background:rgba(246,239,226,.09);color:var(--paper);cursor:pointer;transition:.16s}
button.act:active{transform:scale(.97)}
button.act.hi{background:var(--paper);color:#1a272e;border-color:var(--paper)}
.new{display:inline-block;font-size:9.5px;letter-spacing:.16em;background:var(--gold);color:#2b2010;
  border-radius:4px;padding:2px 6px;vertical-align:3px;margin-left:7px;font-weight:700}

/* ---- intro ---- */
#intro{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 18%,#2f4450,#141e24 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:34px;gap:14px;transition:opacity .6s}
#intro h1{font-family:var(--serif);font-weight:500;font-size:39px;margin:0;line-height:1.05;letter-spacing:.01em}
#intro h1 span{display:block;font-size:14px;letter-spacing:.34em;text-transform:uppercase;
  opacity:.55;margin-bottom:13px;font-family:var(--sans)}
#intro p{font-family:var(--serif);font-style:italic;color:#c3bbae;max-width:19em;
  line-height:1.6;font-size:15px;margin:2px 0 12px}
#intro button{font:inherit;font-size:14px;font-weight:650;padding:14px 30px;border-radius:999px;
  border:0;background:var(--paper);color:#1a272e;cursor:pointer}
.gone{opacity:0;pointer-events:none!important}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}

<body>

  <div id="intro">
    <h1><span>Parcel &amp; Petal</span>A stranger keeps<br>mailing you flowers</h1>

    <button id="bStart">Open the first parcel</button>

<script>
'use strict';
/* ============================================================
   TUNING — everything addictive lives in this block.
   ============================================================ */
const CFG = {
  parcelIntervalMs : 90 * 1000,  // one parcel accrues this often while you are away
  parcelCap        : 8,          // accrual stops here, so nothing is ever "wasted"
  startParcels     : 3,
  pityAt           : 7,          // a Rare+ is guaranteed within this many opens
  curioChance      : 0.055,      // chance the parcel holds something that is not a flower
  harmonyPerPair   : 0.06,       // sill arrangement bonus per matching neighbour pair
  harmonyCap       : 1.75,
  squeezeSeconds   : 1.15,       // hold-to-squeeze fill time (the "pressure" substitute)
};

/* ---------- little helpers ---------- */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const dist  = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const hsl   = (h,s,l,a=1) => `hsla(${(h%360+360)%360},${clamp(s,0,100)}%,${clamp(l,0,100)}%,${a})`;
const today = () => new Date().toISOString().slice(0,10);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function mulberry32(a){
  return function(){
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function pick(r, arr){ return arr[Math.floor(r()*arr.length)]; }
function rr(ctx,x,y,w,h,rad){            // roundRect, hand-rolled for old Safari
  const k = Math.min(rad, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+k,y);
  ctx.arcTo(x+w,y,x+w,y+h,k);
  ctx.arcTo(x+w,y+h,x,y+h,k);
  ctx.arcTo(x,y+h,x,y,k);
  ctx.arcTo(x,y,x+w,y,k);
  ctx.closePath();
}
// does segment p1->p2 cross segment p3->p4 ?
function crosses(p1,p2,p3,p4){
  const d=(a,b,c)=>(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);
  const d1=d(p3,p4,p1), d2=d(p3,p4,p2), d3=d(p1,p2,p3), d4=d(p1,p2,p4);
  return ((d1>0&&d2<0)||(d1<0&&d2>0)) && ((d3>0&&d4<0)||(d3<0&&d4>0));
}
// Distance from a point to a segment. A swipe that only grazes the twine should
// still cut it, and a sample landing exactly ON the cord must not slip through
// the strict-inequality crack in crosses().
function ptSegDist(p, a, b){
  const vx=b.x-a.x, vy=b.y-a.y, wx=p.x-a.x, wy=p.y-a.y;
  const L2 = vx*vx + vy*vy;
  const t = L2 ? clamp((wx*vx + wy*vy)/L2, 0, 1) : 0;
  return Math.hypot(wx - vx*t, wy - vy*t);
}

/* ============================================================
   CONTENT
   ============================================================ */
const RARITY = [
  {id:'common',    name:'Common',    w:66, col:'#cfc4b4', mut:0.00, notes:3},
  {id:'uncommon',  name:'Uncommon',  w:23, col:'#8fd0a8', mut:0.06, notes:4},
  {id:'rare',      name:'Rare',      w: 9, col:'#7fc4e8', mut:0.20, notes:6},
  {id:'legendary', name:'Legendary', w: 2, col:'#e8c46a', mut:0.48, notes:9},
];
const RA = {}; RARITY.forEach((r,i)=>{ r.idx=i; RA[r.id]=r; });

const SPECIES = [
  {id:'moon',   name:'Moonpetal',      poem:'Opens only for light it already remembers.',
   petals:[5,6],   hue:[205,255], sat:[24,44], lit:[72,88], shape:'round',  center:'disc',  size:1.00},
  {id:'ember',  name:'Ember Cup',      poem:'Warm to the touch for three days, then shy.',
   petals:[6,8],   hue:[8,32],    sat:[62,86], lit:[48,62], shape:'cup',    center:'fuzz',  size:0.95},
  {id:'glass',  name:'Glasswort Bell', poem:'It rings if you are honest near it.',
   petals:[5,5],   hue:[150,186], sat:[18,36], lit:[70,84], shape:'tube',   center:'ring',  size:0.90},
  {id:'thistle',name:'Thistlelace',    poem:'Guards nothing, and guards it very well.',
   petals:[11,16], hue:[268,300], sat:[38,62], lit:[54,70], shape:'lance',  center:'beads', size:0.92},
  {id:'ink',    name:'Inkdrop Iris',   poem:'Every petal is a sentence it will not finish.',
   petals:[3,3],   hue:[245,275], sat:[40,70], lit:[30,44], shape:'frill',  center:'star',  size:1.08},
  {id:'sun',    name:'Sunhusk',        poem:'Husks itself each dawn and calls that growth.',
   petals:[13,19], hue:[38,52],   sat:[72,92], lit:[54,66], shape:'lance',  center:'disc',  size:1.02},
  {id:'velvet', name:'Velvet Maw',     poem:'It is only ever hungry for the evening.',
   petals:[4,5],   hue:[330,356], sat:[44,70], lit:[32,46], shape:'cup',    center:'fuzz',  size:1.10},
  {id:'pearl',  name:'Pearl Trumpet',  poem:'Plays one note, too low for anyone awake.',
   petals:[5,6],   hue:[28,46],   sat:[16,32], lit:[80,92], shape:'tube',   center:'ring',  size:0.98},
  {id:'fog',    name:'Fogbloom',       poem:'Sold by weight. Weighs nothing at all.',
   petals:[7,9],   hue:[190,216], sat:[10,26], lit:[76,90], shape:'frill',  center:'fuzz',  size:0.94},
  {id:'copper', name:'Copper Rose',    poem:'Rusts beautifully, and entirely on purpose.',
   petals:[15,21], hue:[14,30],   sat:[46,66], lit:[42,56], shape:'round',  center:'disc',  size:1.00},
  {id:'night',  name:'Nightbead',      poem:'Counts the hours and keeps the tally somewhere.',
   petals:[6,6],   hue:[225,250], sat:[30,52], lit:[26,38], shape:'star',   center:'beads', size:0.88},
  {id:'salt',   name:'Saltlily',       poem:'Grew where the tide forgot to come back.',
   petals:[6,7],   hue:[175,200], sat:[14,28], lit:[80,93], shape:'lance',  center:'ring',  size:1.02},
  {id:'feather',name:'Featherstar',    poem:'Moults in spring and apologises all summer.',
   petals:[8,10],  hue:[300,330], sat:[30,52], lit:[66,80], shape:'frill',  center:'star',  size:1.05},
  {id:'ribbon', name:'Ribbonvine',     poem:'Ties itself to whatever it happens to be nearest.',
   petals:[5,7],   hue:[85,130],  sat:[34,56], lit:[50,64], shape:'ribbon', center:'beads', size:1.08},
];
const SP = {}; SPECIES.forEach(s => SP[s.id]=s);

const VARIANTS = [
  {id:'dawn', name:'Dawn',  target:  0, mix:0.00, ds:  2, dl:  7},
  {id:'ink',  name:'Ink',   target:256, mix:0.42, ds: 12, dl:-21},
  {id:'ember',name:'Ember', target: 22, mix:0.55, ds: 18, dl: -3},
  {id:'frost',name:'Frost', target:196, mix:0.50, ds:-20, dl: 14},
  {id:'moss', name:'Moss',  target:104, mix:0.52, ds: -8, dl: -5},
];
// shortest way round the wheel, so blends never swing through the wrong colours
function blendHue(h, target, mix){
  if (!mix) return h;
  const d = ((target - h) % 360 + 540) % 360 - 180;
  return h + d*mix;
}
const VA = {}; VARIANTS.forEach(v => VA[v.id]=v);

const MUTATIONS = [
  {id:'glow',   name:'Luminous'},
  {id:'double', name:'Doubled'},
  {id:'glass',  name:'Glassine'},
  {id:'invert', name:'Nodding'},
];

const CURIOS = [
  {id:'frog',    name:'A very small frog',  note:'It waits politely to be let out.'},
  {id:'button',  name:'A brass button',     note:'Four holes. One thread still in it.'},
  {id:'ticket',  name:'A ticket stub',      note:'Row F. A film nobody has heard of.'},
  {id:'snail',   name:'A patient snail',    note:'It has made the whole journey inside.'},
  {id:'thimble', name:'A dented thimble',   note:'Someone worked very hard in this.'},
  {id:'key',     name:'A key, unlabelled',  note:'Not for any door that you own.'},
];
const CU = {}; CURIOS.forEach(c => CU[c.id]=c);

const SHAPES = {
  round : {len:1.00, wid:0.60, frill:0.14, curl:0.10, split:0, sharp:0},
  cup   : {len:0.92, wid:0.72, frill:0.05, curl:0.46, split:0, sharp:0},
  tube  : {len:1.14, wid:0.33, frill:0.02, curl:0.30, split:0, sharp:0},
  lance : {len:1.22, wid:0.25, frill:0.06, curl:0.06, split:0, sharp:0},
  frill : {len:1.00, wid:0.64, frill:0.72, curl:0.18, split:1, sharp:0},
  star  : {len:1.12, wid:0.30, frill:0.00, curl:0.00, split:0, sharp:1},
  ribbon: {len:1.34, wid:0.21, frill:0.26, curl:0.56, split:0, sharp:0},
};

const PARCELS = [
  {id:'tin',    name:'a barnacled tin',                            layers:['peel','lift']},
  {id:'crane',  name:'a paper crane the size of your fist',         layers:['snip','peel']},
  {id:'fogjar', name:'a jar of standing fog',                       layers:['unwind','lift']},
  {id:'cocoon', name:'a cocoon of red thread',                      layers:['unwind','squeeze']},
  {id:'egg',    name:'a bone-china egg, slightly warm',             layers:['squeeze']},
  {id:'bundle', name:'a bundle sealed in bubble wrap',              layers:['pop','snip']},
  {id:'crate',  name:'a crate stamped in no language you know',     layers:['snip','pop','lift'], heavy:true},
];

/* ============================================================
   AUDIO — synthesised, so the whole game stays one file
   ============================================================ */
const Snd = (() => {
  let ac = null, master = null, noiseBuf = null, muted = false;
  function boot(){
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { muted = true; return null; }
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.32; master.connect(ac.destination);
    const n = ac.sampleRate * 2;
    noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
    return ac;
  }
  function resume(){ const a = boot(); if (a && a.state === 'suspended') a.resume(); }
  function noise(dur, freq, gain, q=1){
    const a = boot(); if (!a || muted) return;
    const s = a.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
    const g = a.createGain();
    const t = a.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + dur*0.14);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  function tone(freq, dur, gain=0.2, type='sine', delay=0, glide=0){
    const a = boot(); if (!a || muted) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    const t = a.currentTime + delay;
    o.frequency.setValueAtTime(freq, t);
    if (glide) o.frequency.exponentialRampToValueAtTime(freq*glide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const PENTA = [0,2,4,7,9,12,14,16,19,21,24];
  return {
    resume, boot,
    rustle: () => noise(0.13, 2600 + Math.random()*1600, 0.16, 0.7),
    peel  : () => noise(0.07, 1500 + Math.random()*2400, 0.11, 1.4),
    snip  : () => { noise(0.05, 5200, 0.2, 3); tone(1480, 0.07, 0.07, 'triangle'); },
    pop   : (i=0) => { noise(0.035, 900 + i*130, 0.2, 5); tone(320 + i*26, 0.05, 0.09, 'sine', 0, 0.55); },
    thread: () => noise(0.09, 780 + Math.random()*500, 0.07, 2.2),
    strain: (f) => tone(120 + f*230, 0.1, 0.035 + f*0.05, 'sawtooth'),
    crack : () => { noise(0.2, 420, 0.24, 0.8); tone(180, 0.22, 0.12, 'triangle', 0, 0.4); },
    whump : () => { noise(0.36, 240, 0.2, 0.5); tone(96, 0.4, 0.14, 'sine', 0, 0.55); },
    chime : (rar) => {
      const n = RA[rar].notes, base = 392 * (rar === 'legendary' ? 1.5 : 1);
      for (let i=0;i<n;i++){
        const st = PENTA[i % PENTA.length] + (i >= PENTA.length ? 12 : 0);
        tone(base * Math.pow(2, st/12), 1.5 - i*0.05, 0.12 - i*0.006, 'sine', i*0.085);
        if (rar === 'rare' || rar === 'legendary')
          tone(base * Math.pow(2, (st+12)/12), 0.8, 0.032, 'triangle', i*0.085 + 0.02);
      }
    },
    press : () => { noise(0.3, 700, 0.1, 0.6); tone(220, 0.25, 0.05, 'sine', 0, 0.6); },
  };
})();
function buzz(ms){ if (navigator.vibrate) try { navigator.vibrate(ms); } catch(e){} }

/* ============================================================
   GENOME -> PHENOTYPE.  Flowers are drawn from numbers, never
   from image files, so hundreds of them cost nothing.
   ============================================================ */
function makeGenome(r, opts = {}){
  const sp = opts.sp || pick(r, SPECIES).id;
  const va = pick(r, VARIANTS).id;
  let ra = opts.ra;
  if (!ra){
    const total = RARITY.reduce((s,x)=>s+x.w, 0);
    let t = r()*total; ra = 'common';
    for (const x of RARITY){ if ((t -= x.w) <= 0){ ra = x.id; break; } }
  }
  const mu = r() < RA[ra].mut ? pick(r, MUTATIONS).id : null;
  return { sp, va, ra, mu, seed: Math.floor(r()*1e9) };
}

const phCache = new Map();
function phenotype(g){
  const key = g.sp+g.va+g.ra+g.mu+g.seed;
  if (phCache.has(key)) return phCache.get(key);
  const sp = SP[g.sp], va = VA[g.va], ra = RA[g.ra], sh = SHAPES[sp.shape];
  const r = mulberry32(g.seed);
  const rq = ra.idx / 3;                       // 0 common .. 1 legendary

  const n   = Math.round(lerp(sp.petals[0], sp.petals[1], clamp(r()*0.75 + rq*0.4, 0, 1)));
  const hue = blendHue(lerp(sp.hue[0], sp.hue[1], r()), va.target, va.mix);
  const sat = clamp(lerp(sp.sat[0], sp.sat[1], r()) + va.ds + rq*8, 5, 96);
  const lit = clamp(lerp(sp.lit[0], sp.lit[1], r()) + va.dl, 12, 94);
  const jit = Array.from({length: Math.max(n, 24)}, () => r()*2 - 1);
  // A petal may not be wider than the arc it has to itself, or the bloom
  // fuses into one solid disc instead of reading as separate petals.
  const wid = Math.min(sh.wid * sp.size, (TAU/n) * 0.62);
  const pale = lit > 56;
  const cen  = sp.center === 'beads'
      ? [hsl(hue, clamp(sat+12,0,92), clamp(lit-30,12,58)), hsl(hue, clamp(sat+20,0,95), clamp(lit-14,20,70))]
      : (sp.center === 'ring' || sp.center === 'star')
      ? [hsl(hue, clamp(sat*0.3,0,38), pale ? 96 : 84), hsl(hue, clamp(sat*0.5,0,52), pale ? 82 : 97)]
      : [hsl(46, 66, pale ? 50 : 42), hsl(50, 84, pale ? 70 : 62)];

  const ph = {
    ...sh, n, wid, mu: g.mu, ra: g.ra, sp: g.sp, jit,
    len : sh.len * sp.size,
    cA   : hsl(hue, sat, lit),
    cB   : hsl(hue + 10, sat*0.95, clamp(lit - 19, 8, 92)),
    cEdge: hsl(hue - 8, clamp(sat + 10, 0, 96), clamp(lit + 14, 0, 97)),
    cLine: hsl(hue + 4, clamp(sat*0.8, 0, 90), clamp(lit - 30, 5, 80), 0.5),
    cVein: hsl(hue - 4, clamp(sat*0.6, 0, 80), clamp(lit + 20, 0, 98), 0.4),
    cCen : cen[0],
    cCen2: cen[1],
    stem : hsl(lerp(96, 138, r()), lerp(26, 42, r()), lerp(30, 42, r())),
    center: sp.center,
    bend : r()*2 - 1,
    phase: r()*TAU,
    hue, sat, lit,
  };
  phCache.set(key, ph);
  return ph;
}
function flowerName(g){
  return (g.va === 'dawn' ? '' : VA[g.va].name + ' ') + SP[g.sp].name;
}

function petalPath(ctx, L, Wd, curl, frill, split, sharp, j){
  const N = 13;
  ctx.beginPath(); ctx.moveTo(0, 0);
  for (let s=1; s<=N; s++){
    const u = s/N;
    const base = Math.pow(Math.sin(u*Math.PI), sharp ? 1.7 : 0.72);
    const rip  = 1 + frill*0.3*Math.sin(u*9 + j*6);
    ctx.lineTo( Wd*base*rip*(1 - curl*0.45*u) + curl*Wd*0.55*Math.sin(u*Math.PI), -L*u );
  }
  if (split) ctx.lineTo(0, -L*0.83);
  for (let s=N; s>=1; s--){
    const u = s/N;
    const base = Math.pow(Math.sin(u*Math.PI), sharp ? 1.7 : 0.72);
    const rip  = 1 + frill*0.3*Math.sin(u*9 + j*6 + 2.1);
    ctx.lineTo( -Wd*base*rip*(1 - curl*0.45*u) + curl*Wd*0.55*Math.sin(u*Math.PI), -L*u );
  }
  ctx.closePath();
}

function drawCentre(ctx, ph, R, t){
  if (R <= 0.4) return;
  ctx.save();
  if (ph.center === 'disc'){
    const g = ctx.createRadialGradient(0,0,R*0.15, 0,0,R);
    g.addColorStop(0, ph.cCen2); g.addColorStop(1, ph.cCen);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    for (let i=0;i<14;i++){
      const a = i*2.399, rad = R*0.78*Math.sqrt(i/14);
      ctx.beginPath(); ctx.arc(Math.cos(a)*rad, Math.sin(a)*rad, R*0.11, 0, TAU); ctx.fill();
    }
  } else if (ph.center === 'beads'){
    for (let i=0;i<8;i++){
      const a = i/8*TAU + t*0.2;
      ctx.fillStyle = i%2 ? ph.cCen2 : ph.cCen;
      ctx.beginPath(); ctx.arc(Math.cos(a)*R*0.62, Math.sin(a)*R*0.62, R*0.34, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = ph.cCen2;
    ctx.beginPath(); ctx.arc(0,0,R*0.3,0,TAU); ctx.fill();
  } else if (ph.center === 'fuzz'){
    ctx.strokeStyle = ph.cCen; ctx.lineWidth = Math.max(0.7, R*0.13); ctx.lineCap='round';
    for (let i=0;i<22;i++){
      const a = i/22*TAU + ph.phase, l = R*(0.7 + 0.5*Math.abs(ph.jit[i % ph.jit.length]));
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*R*0.2, Math.sin(a)*R*0.2);
      ctx.lineTo(Math.cos(a)*l, Math.sin(a)*l); ctx.stroke();
      ctx.fillStyle = ph.cCen2;
      ctx.beginPath(); ctx.arc(Math.cos(a)*l, Math.sin(a)*l, R*0.13, 0, TAU); ctx.fill();
    }
  } else if (ph.center === 'ring'){
    const g = ctx.createRadialGradient(0,0,R*0.1, 0,0,R);   // a pale corona, not a bullseye
    g.addColorStop(0, ph.cCen2); g.addColorStop(0.72, ph.cCen); g.addColorStop(1, ph.cCen2);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,R*0.92,0,TAU); ctx.fill();
    ctx.fillStyle = ph.cCen;
    for (let i=0;i<7;i++){
      const a = i/7*TAU + ph.phase;
      ctx.beginPath(); ctx.arc(Math.cos(a)*R*0.56, Math.sin(a)*R*0.56, R*0.13, 0, TAU); ctx.fill();
    }
  } else { // star — an iris throat: soft glow with short rays
    const g = ctx.createRadialGradient(0,0,0, 0,0,R*1.15);
    g.addColorStop(0, ph.cCen2); g.addColorStop(0.55, ph.cCen); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,R*1.15,0,TAU); ctx.fill();
    ctx.strokeStyle = ph.cCen; ctx.lineWidth = Math.max(0.7, R*0.16); ctx.lineCap = 'round';
    for (let i=0;i<6;i++){
      const a = i/6*TAU + ph.phase*0.3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*R*0.34, Math.sin(a)*R*0.34);
      ctx.lineTo(Math.cos(a)*R*1.0, Math.sin(a)*R*1.0);
      ctx.stroke();
    }
    ctx.fillStyle = ph.cCen2;
    ctx.beginPath(); ctx.arc(0,0,R*0.3,0,TAU); ctx.fill();
  }
  ctx.restore();
}

function drawStem(ctx, ph, R, t, len){
  const h = len ?? R*2.6;
  const sway = reduceMotion ? 0 : Math.sin(t*0.8 + ph.phase)*R*0.05;
  const bend = ph.bend*R*0.42 + sway;
  ctx.save();
  ctx.strokeStyle = ph.stem; ctx.lineWidth = Math.max(1.6, R*0.075); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,0);
  ctx.quadraticCurveTo(bend, h*0.5, bend*0.25, h);
  ctx.stroke();
  ctx.fillStyle = ph.stem;
  for (let i=0;i<2;i++){
    const u = 0.42 + i*0.26, side = i%2 ? 1 : -1;
    const x = lerp(0, bend*0.25, u) + bend*0.5*(1-u)*u*2, y = h*u;
    ctx.save(); ctx.translate(x,y); ctx.rotate(side*(0.85 + ph.jit[i]*0.2));
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.quadraticCurveTo(R*0.34, -R*0.24, R*0.72, 0);
    ctx.quadraticCurveTo(R*0.34,  R*0.24, 0, 0);
    ctx.fill(); ctx.restore();
  }
  ctx.restore();
}

/* R = head radius in px, bloom 0..1 */
function drawFlower(ctx, ph, x, y, R, bloom = 1, t = 0, opts = {}){
  ctx.save();
  ctx.translate(x, y);
  if (opts.stem !== false) drawStem(ctx, ph, R, t, opts.stemLen);
  if (!reduceMotion) ctx.rotate(Math.sin(t*0.85 + ph.phase)*0.035*(opts.sway ?? 1));
  if (ph.mu === 'invert') ctx.scale(1, -1);
  if (ph.mu === 'glow'){ ctx.shadowColor = ph.cA; ctx.shadowBlur = R*0.55*bloom; }

  const rings = ph.mu === 'double' ? 2 : 1;
  for (let ring = rings-1; ring >= 0; ring--){
    const rs  = ring ? 0.72 : 1;
    const off = ring ? Math.PI/ph.n : 0;
    for (let i=0;i<ph.n;i++){
      const grow = clamp(bloom*1.3 - (i/ph.n)*0.22, 0, 1);
      if (grow <= 0.01) continue;
      const ease = 1 - Math.pow(1-grow, 3);
      ctx.save();
      ctx.rotate(off + i/ph.n*TAU + ph.jit[i]*0.1 + (1-ease)*0.8);
      const L  = R*ph.len*rs*(0.3 + 0.7*ease)*(1 + ph.jit[i]*0.055);
      const Wd = R*ph.wid*rs*(0.45 + 0.55*ease);
      const g = ctx.createLinearGradient(0, 0, 0, -L);
      g.addColorStop(0, ph.cB); g.addColorStop(0.55, ph.cA); g.addColorStop(1, ph.cEdge);
      ctx.fillStyle = g;
      ctx.globalAlpha = ph.mu === 'glass' ? 0.55 : (ring ? 0.92 : 1);
      petalPath(ctx, L, Wd, ph.curl, ph.frill, ph.split, ph.sharp, ph.jit[i]);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = ph.mu === 'glass' ? 'rgba(255,255,255,.55)' : ph.cLine;
      ctx.lineWidth = Math.max(0.55, R*0.016); ctx.stroke();
      if (R > 18 && !ph.sharp){
        ctx.strokeStyle = ph.cVein; ctx.lineWidth = Math.max(0.5, R*0.012);
        ctx.beginPath(); ctx.moveTo(0, -L*0.1); ctx.lineTo(0, -L*0.86); ctx.stroke();
      }
      ctx.restore();
    }
  }
  ctx.shadowBlur = 0;
  drawCentre(ctx, ph, R*0.3*bloom, t);
  ctx.restore();
}

function drawCurio(ctx, id, x, y, R){
  ctx.save(); ctx.translate(x,y);
  const ink = '#3a3038';
  if (id === 'frog'){
    ctx.fillStyle = '#6f9b5e';
    ctx.beginPath(); ctx.ellipse(0, 0, R*0.8, R*0.55, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-R*0.3,-R*0.42,R*0.24,R*0.24,0,0,TAU);
    ctx.ellipse( R*0.3,-R*0.42,R*0.24,R*0.24,0,0,TAU); ctx.fill();
    ctx.fillStyle='#f6efe2';
    ctx.beginPath(); ctx.arc(-R*0.3,-R*0.45,R*0.12,0,TAU); ctx.arc(R*0.3,-R*0.45,R*0.12,0,TAU); ctx.fill();
    ctx.fillStyle=ink;
    ctx.beginPath(); ctx.arc(-R*0.3,-R*0.45,R*0.06,0,TAU); ctx.arc(R*0.3,-R*0.45,R*0.06,0,TAU); ctx.fill();
  } else if (id === 'button'){
    ctx.fillStyle='#c8a253'; ctx.beginPath(); ctx.arc(0,0,R*0.72,0,TAU); ctx.fill();
    ctx.strokeStyle='#8f6f2e'; ctx.lineWidth=R*0.07; ctx.beginPath(); ctx.arc(0,0,R*0.55,0,TAU); ctx.stroke();
    ctx.fillStyle='#6d5320';
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>{ ctx.beginPath(); ctx.arc(a*R*0.2,b*R*0.2,R*0.1,0,TAU); ctx.fill(); });
  } else if (id === 'ticket'){
    ctx.fillStyle='#e6d9bd'; ctx.save(); ctx.rotate(-0.16);
    rr(ctx,-R*0.85,-R*0.5,R*1.7,R, R*0.12); ctx.fill();
    ctx.fillStyle='#9a8460';
    for(let i=0;i<3;i++){ rr(ctx,-R*0.6,-R*0.26+i*R*0.24,R*1.0,R*0.08,R*0.04); ctx.fill(); }
    ctx.restore();
  } else if (id === 'snail'){
    ctx.fillStyle='#c9a882';
    ctx.beginPath(); ctx.ellipse(R*0.45,R*0.2,R*0.55,R*0.24,0,0,TAU); ctx.fill();
    ctx.strokeStyle='#8a6b46'; ctx.lineWidth=R*0.16; ctx.lineCap='round';
    ctx.beginPath();
    for (let a=0;a<TAU*2.2;a+=0.12){ const rad=R*0.09*a; const px=-R*0.15+Math.cos(a)*rad, py=Math.sin(a)*rad;
      a ? ctx.lineTo(px,py) : ctx.moveTo(px,py); }
    ctx.stroke();
  } else if (id === 'thimble'){
    ctx.fillStyle='#b9bcc2';
    ctx.beginPath(); ctx.moveTo(-R*0.45,R*0.5); ctx.lineTo(-R*0.34,-R*0.3);
    ctx.quadraticCurveTo(0,-R*0.72,R*0.34,-R*0.3); ctx.lineTo(R*0.45,R*0.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(60,60,70,.35)';
    for(let i=0;i<12;i++){ const a=i/12*TAU; ctx.beginPath();
      ctx.arc(Math.cos(a)*R*0.2, -R*0.2+Math.sin(a)*R*0.13, R*0.05,0,TAU); ctx.fill(); }
  } else { // key
    ctx.strokeStyle='#9c8a63'; ctx.lineWidth=R*0.16; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(-R*0.4,0,R*0.3,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-R*0.1,0); ctx.lineTo(R*0.75,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(R*0.5,0); ctx.lineTo(R*0.5,R*0.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(R*0.72,0); ctx.lineTo(R*0.72,R*0.24); ctx.stroke();
  }
  ctx.restore();
}

/* ============================================================
   PARCELS — strange containers, all drawn procedurally
   ============================================================ */
const TINT = {tin:'#9aa7ad', crane:'#efe3c8', fogjar:'#bcd3d8', cocoon:'#b2413c',
               egg:'#f0e8dc', bundle:'#d8c9a8', crate:'#b98a4e'};

function drawBody(ctx, P, box, st, t){
  const {cx, cy, w, h} = box;
  const sq = st.squeeze || 0;
  ctx.save();
  ctx.globalAlpha = st.alpha ?? 1;
  ctx.translate(cx, cy);
  if (st.shake) ctx.translate((Math.random()-0.5)*st.shake, (Math.random()-0.5)*st.shake);
  ctx.scale(1 + sq*0.09, 1 - sq*0.055);
  ctx.translate(-cx, -cy);
  const L = cx - w/2, T = cy - h/2;

  // soft contact shadow
  ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(cx, cy + h*0.46, w*0.4, h*0.04, 0, 0, TAU); ctx.fill(); ctx.restore();

  if (P.id === 'tin'){
    const g = ctx.createLinearGradient(L, 0, L+w, 0);
    g.addColorStop(0,'#5d6a70'); g.addColorStop(.28,'#aab7bd'); g.addColorStop(.55,'#87959b');
    g.addColorStop(.8,'#6e7b82'); g.addColorStop(1,'#4c585e');
    ctx.fillStyle = g; rr(ctx, L, T + h*0.14, w, h*0.86, w*0.1); ctx.fill();
    ctx.strokeStyle='rgba(20,28,32,.5)'; ctx.lineWidth=2; ctx.stroke();
    // barnacles
    const br = mulberry32(11);
    for (let i=0;i<9;i++){
      const bx = L + w*(0.12 + br()*0.76), by = T + h*(0.28 + br()*0.62), rad = w*(0.03 + br()*0.045);
      ctx.fillStyle='#cfd6cf'; ctx.beginPath(); ctx.arc(bx,by,rad,0,TAU); ctx.fill();
      ctx.fillStyle='#8e9a8d'; ctx.beginPath(); ctx.arc(bx,by,rad*0.45,0,TAU); ctx.fill();
    }
    // lid
    const lift = (st.lidLift||0) * h*0.42;
    ctx.save(); ctx.translate(0, -lift);
    const lg = ctx.createLinearGradient(L,0,L+w,0);
    lg.addColorStop(0,'#69767c'); lg.addColorStop(.35,'#b8c5cb'); lg.addColorStop(1,'#566268');
    ctx.fillStyle = lg; rr(ctx, L - w*0.03, T, w*1.06, h*0.2, w*0.06); ctx.fill();
    ctx.strokeStyle='rgba(20,28,32,.5)'; ctx.stroke(); ctx.restore();

  } else if (P.id === 'crane'){
    ctx.fillStyle = '#efe3c8';
    ctx.beginPath(); ctx.moveTo(cx - w*0.46, cy + h*0.2); ctx.lineTo(cx + w*0.3, cy + h*0.34);
    ctx.lineTo(cx + w*0.46, cy - h*0.1); ctx.lineTo(cx, cy - h*0.2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ded0b0';
    ctx.beginPath(); ctx.moveTo(cx, cy - h*0.2); ctx.lineTo(cx + w*0.46, cy - h*0.1);
    ctx.lineTo(cx + w*0.12, cy - h*0.44); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f6ecd8';
    ctx.beginPath(); ctx.moveTo(cx - w*0.46, cy + h*0.2); ctx.lineTo(cx, cy - h*0.2);
    ctx.lineTo(cx - w*0.2, cy - h*0.4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8dcbe';                             // head + tail
    ctx.beginPath(); ctx.moveTo(cx - w*0.2, cy - h*0.4); ctx.lineTo(cx - w*0.44, cy - h*0.5);
    ctx.lineTo(cx - w*0.24, cy - h*0.26); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(120,102,70,.45)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(cx - w*0.46, cy + h*0.2); ctx.lineTo(cx + w*0.46, cy - h*0.1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy - h*0.2); ctx.lineTo(cx + w*0.12, cy + h*0.27); ctx.stroke();

  } else if (P.id === 'fogjar'){
    const lift = (st.lidLift||0) * h*0.4;
    ctx.save();
    const jg = ctx.createLinearGradient(L,0,L+w,0);
    jg.addColorStop(0,'rgba(150,185,195,.5)'); jg.addColorStop(.3,'rgba(208,232,238,.36)');
    jg.addColorStop(.7,'rgba(160,192,202,.36)'); jg.addColorStop(1,'rgba(118,150,160,.5)');
    const jarPath = () => {
      ctx.beginPath();
      ctx.moveTo(L + w*0.26, T + h*0.18); ctx.lineTo(L + w*0.08, T + h*0.34);
      ctx.lineTo(L + w*0.08, T + h*0.92); ctx.quadraticCurveTo(L + w*0.08, T+h, L + w*0.2, T+h);
      ctx.lineTo(L + w*0.8, T + h); ctx.quadraticCurveTo(L + w*0.92, T+h, L + w*0.92, T + h*0.92);
      ctx.lineTo(L + w*0.92, T + h*0.34); ctx.lineTo(L + w*0.74, T + h*0.18); ctx.closePath();
    };
    jarPath();
    ctx.fillStyle = jg; ctx.fill();
    ctx.save(); ctx.clip();                                // fog inside
    for (let i=0;i<5;i++){
      const ph = i*1.7, fx = cx + Math.sin(t*0.25 + ph)*w*0.22, fy = T + h*(0.45 + i*0.11) + Math.cos(t*0.2+ph)*h*0.02;
      const fg = ctx.createRadialGradient(fx,fy,0,fx,fy,w*0.34);
      fg.addColorStop(0,'rgba(240,248,250,.5)'); fg.addColorStop(1,'rgba(240,248,250,0)');
      ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(fx,fy,w*0.34,0,TAU); ctx.fill();
    }
    ctx.restore();
    jarPath();
    ctx.strokeStyle='rgba(235,248,250,.5)'; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.translate(0,-lift);
    ctx.fillStyle='#8d7a5c'; rr(ctx, L + w*0.2, T + h*0.04, w*0.6, h*0.17, w*0.04); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.14)'; rr(ctx, L + w*0.2, T + h*0.04, w*0.6, h*0.06, w*0.03); ctx.fill();
    ctx.restore();

  } else if (P.id === 'cocoon'){
    const g = ctx.createRadialGradient(cx - w*0.16, cy - h*0.2, w*0.04, cx, cy, w*0.52);
    g.addColorStop(0,'#d4635a'); g.addColorStop(.7,'#a8352f'); g.addColorStop(1,'#6e1f1c');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(cx, cy, w*0.34, h*0.46, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle='rgba(255,190,180,.22)'; ctx.lineWidth=1.1;
    for (let i=0;i<26;i++){
      const u = i/26, yy = cy - h*0.44 + h*0.88*u, ww = w*0.34*Math.sin(Math.PI*clamp(u,0.02,0.98));
      ctx.beginPath(); ctx.moveTo(cx - ww, yy);
      ctx.quadraticCurveTo(cx, yy + (i%2?4:-4), cx + ww, yy); ctx.stroke();
    }
    if (sq > 0.02){
      ctx.strokeStyle = `rgba(255,236,200,${sq*0.85})`; ctx.lineWidth = 1 + sq*2.4;
      ctx.beginPath(); ctx.moveTo(cx, cy - h*0.4*sq); ctx.lineTo(cx, cy + h*0.4*sq); ctx.stroke();
    }

  } else if (P.id === 'egg'){
    const g = ctx.createRadialGradient(cx - w*0.14, cy - h*0.22, w*0.04, cx, cy, w*0.5);
    g.addColorStop(0,'#fffdf7'); g.addColorStop(.62,'#ece2d2'); g.addColorStop(1,'#c3b6a4');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(cx, cy + h*0.02, w*0.31, h*0.48, 0, Math.PI, TAU);   // taller top half
    ctx.ellipse(cx, cy + h*0.02, w*0.31, h*0.40, 0, 0, Math.PI);     // rounder bottom half
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = `rgba(150,120,95,${0.2 + sq*0.7})`; ctx.lineWidth = 0.8 + sq*1.8;
    const cr = mulberry32(7);
    for (let i=0;i<5;i++){
      let px = cx + (cr()-0.5)*w*0.3, py = cy + (cr()-0.5)*h*0.3;
      ctx.beginPath(); ctx.moveTo(px,py);
      for (let s=0;s<4;s++){ px += (cr()-0.5)*w*0.18*(0.3+sq); py += (cr()-0.5)*h*0.18*(0.3+sq); ctx.lineTo(px,py); }
      ctx.stroke();
    }
    if (sq > 0.3){
      ctx.fillStyle = `rgba(255,240,200,${(sq-0.3)*0.5})`;
      ctx.beginPath(); ctx.ellipse(cx, cy, w*0.3*sq, h*0.38*sq, 0, 0, TAU); ctx.fill();
    }

  } else if (P.id === 'bundle'){
    ctx.fillStyle='#d8c9a8'; rr(ctx, L + w*0.06, T + h*0.1, w*0.88, h*0.8, w*0.05); ctx.fill();
    ctx.fillStyle='rgba(120,100,70,.18)';
    rr(ctx, L + w*0.06, T + h*0.1, w*0.88, h*0.14, w*0.05); ctx.fill();
    ctx.strokeStyle='rgba(120,100,70,.3)'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(L + w*0.06, T + h*0.34); ctx.lineTo(L + w*0.94, T + h*0.34); ctx.stroke();
    if (w > 130){
      ctx.fillStyle='#8c7a58'; ctx.font = '600 11px ' + F_SANS;
      ctx.textAlign='center'; ctx.fillText('FRAGILE — VERY', cx, T + h*0.24);
    }

  } else { // crate
    ctx.fillStyle='#a8763d'; rr(ctx, L + w*0.05, T + h*0.12, w*0.9, h*0.78, w*0.03); ctx.fill();
    ctx.strokeStyle='rgba(70,44,18,.4)'; ctx.lineWidth=1.4;
    for (let i=1;i<4;i++){
      const yy = T + h*0.12 + h*0.78*i/4;
      ctx.beginPath(); ctx.moveTo(L + w*0.05, yy); ctx.lineTo(L + w*0.95, yy); ctx.stroke();
    }
    ctx.strokeStyle='rgba(70,44,18,.3)'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(L + w*0.1, T + h*0.16); ctx.lineTo(L + w*0.9, T + h*0.86); ctx.stroke();
    ctx.save(); ctx.translate(cx, T + h*0.5); ctx.rotate(-0.12);
    ctx.strokeStyle='rgba(60,40,70,.5)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,w*0.17,0,TAU); ctx.stroke();
    ctx.fillStyle='rgba(60,40,70,.5)';
    for (let i=0;i<5;i++){ rr(ctx, -w*0.1 + i*w*0.045, -w*0.03, w*0.025, w*0.06, 1); ctx.fill(); }
    ctx.restore();
    const lift = (st.lidLift||0) * h*0.4;
    ctx.save(); ctx.translate(0,-lift); ctx.fillStyle='#bb8a4c';
    rr(ctx, L + w*0.02, T + h*0.02, w*0.96, h*0.16, w*0.03); ctx.fill();
    ctx.strokeStyle='rgba(70,44,18,.45)'; ctx.lineWidth=1.4; ctx.stroke(); ctx.restore();
  }
  ctx.restore();
}

/* ============================================================
   GESTURES.  Each one is a tiny module: geometry, pointer
   handlers, and how it draws itself.
   ============================================================ */
const GES = {

  peel: {
    hint: 'Drag the <i>loose tape</i> back',
    init(Ly, r, box){
      const vert = r() < 0.4;
      const m = 0.62;
      if (vert){ Ly.a = {x: box.cx, y: box.cy - box.h*m/2}; Ly.b = {x: box.cx, y: box.cy + box.h*m/2}; }
      else     { Ly.a = {x: box.cx - box.w*m/2, y: box.cy}; Ly.b = {x: box.cx + box.w*m/2, y: box.cy}; }
      Ly.len = dist(Ly.a, Ly.b);
      Ly.dir = {x:(Ly.b.x-Ly.a.x)/Ly.len, y:(Ly.b.y-Ly.a.y)/Ly.len};
      Ly.perp = {x:-Ly.dir.y, y:Ly.dir.x};
      Ly.blip = 0;
    },
    at(Ly, u){ return {x: lerp(Ly.a.x, Ly.b.x, u), y: lerp(Ly.a.y, Ly.b.y, u)}; },
    down(Ly, p){ Ly.grab = dist(p, this.at(Ly, Ly.p)) < 58; },
    move(Ly, p, prev){
      if (!Ly.grab) return;
      const d = (p.x-prev.x)*Ly.dir.x + (p.y-prev.y)*Ly.dir.y;
      Ly.p = clamp(Ly.p + d/Ly.len, 0, 1);
      if (Ly.p - Ly.blip > 0.055){ Ly.blip = Ly.p; Snd.peel(); buzz(4); }
    },
    up(Ly){ Ly.grab = false; },
    draw(ctx, Ly, box, t, active){
      const tw = 26;
      // still-stuck remainder
      const s = this.at(Ly, Ly.p);
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(Math.atan2(Ly.dir.y, Ly.dir.x));
      const rest = Ly.len*(1 - Ly.p);
      ctx.fillStyle = 'rgba(232,222,198,.86)';
      ctx.fillRect(0, -tw/2, rest, tw);
      ctx.strokeStyle = 'rgba(150,135,100,.5)'; ctx.lineWidth = 1;
      ctx.strokeRect(0, -tw/2, rest, tw);
      // peeled flap, curling back the other way
      const pl = Ly.len*Ly.p;
      if (pl > 1){
        const g = ctx.createLinearGradient(0,0,-pl,0);
        g.addColorStop(0,'rgba(246,240,222,.95)'); g.addColorStop(1,'rgba(214,202,172,.55)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(0,-tw/2);
        ctx.quadraticCurveTo(-pl*0.5, -tw/2 - 22, -pl, -tw/2 - 6);
        ctx.lineTo(-pl, tw/2 - 6);
        ctx.quadraticCurveTo(-pl*0.5, tw/2 - 22, 0, tw/2);
        ctx.closePath(); ctx.fill();
      }
      if (active && Ly.p < 1){                       // grab affordance
        const pulse = 1 + Math.sin(t*5)*0.14;
        ctx.strokeStyle = `rgba(232,196,106,${0.5 + Math.sin(t*5)*0.25})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 21*pulse, 0, TAU); ctx.stroke();
      }
      ctx.restore();
    },
  },

  snip: {
    hint: 'Swipe <i>across</i> the twine to cut it',
    init(Ly, r, box){
      const n = 1 + Math.floor(r()*2.4);
      Ly.cords = [];
      for (let i=0;i<n;i++){
        const vert = (i + (r()<0.5?0:1)) % 2 === 0;
        const off = (n === 1 ? 0 : (i/(n-1) - 0.5)) * 0.42;
        Ly.cords.push(vert
          ? {a:{x:box.cx + box.w*off, y:box.cy - box.h*0.52}, b:{x:box.cx + box.w*off, y:box.cy + box.h*0.52}, cut:0}
          : {a:{x:box.cx - box.w*0.52, y:box.cy + box.h*off}, b:{x:box.cx + box.w*0.52, y:box.cy + box.h*off}, cut:0});
      }
    },
    down(){},
    move(Ly, p, prev){
      for (const c of Ly.cords){
        if (!c.cut && (crosses(prev, p, c.a, c.b) || ptSegDist(p, c.a, c.b) < 8)){
          c.cut = 1; c.t = 0; Snd.snip(); buzz(12);
          Ly.p = Ly.cords.filter(x=>x.cut).length / Ly.cords.length;
        }
      }
    },
    up(){},
    tick(Ly, dt){ for (const c of Ly.cords) if (c.cut) c.t = Math.min(1, c.t + dt*2.6); },
    draw(ctx, Ly, box, t, active){
      for (const c of Ly.cords){
        const mid = {x:(c.a.x+c.b.x)/2, y:(c.a.y+c.b.y)/2};
        ctx.strokeStyle = '#b9a276'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
        if (!c.cut){
          ctx.beginPath(); ctx.moveTo(c.a.x,c.a.y); ctx.lineTo(c.b.x,c.b.y); ctx.stroke();
          ctx.strokeStyle='rgba(255,246,220,.3)'; ctx.lineWidth=1.4;
          ctx.beginPath(); ctx.moveTo(c.a.x,c.a.y); ctx.lineTo(c.b.x,c.b.y); ctx.stroke();
          if (active){
            const k = 0.4 + Math.sin(t*5)*0.24;
            ctx.strokeStyle = `rgba(232,196,106,${k})`; ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(c.a.x,c.a.y); ctx.lineTo(c.b.x,c.b.y); ctx.stroke();
          }
        } else {
          const e = 1 - Math.pow(1 - c.t, 2), droop = e*26;
          for (const [end, sign] of [[c.a,-1],[c.b,1]]){
            ctx.beginPath(); ctx.moveTo(end.x, end.y);
            ctx.quadraticCurveTo(lerp(end.x, mid.x, .6), lerp(end.y, mid.y, .6) + droop,
                                 lerp(end.x, mid.x, .92) + sign*droop*0.3, lerp(end.y, mid.y, .92) + droop*1.5);
            ctx.stroke();
          }
        }
      }
    },
  },

  pop: {
    hint: 'Pop <i>every bubble</i> — tap or drag across them',
    init(Ly, r, box){
      Ly.bs = [];
      const cols = 4, rows = 5, iw = box.w*0.74, ih = box.h*0.7;
      for (let y=0;y<rows;y++) for (let x=0;x<cols;x++){
        Ly.bs.push({
          x: box.cx - iw/2 + iw*(x + 0.5)/cols + (r()-0.5)*4,
          y: box.cy - ih/2 + ih*(y + 0.5)/rows + (r()-0.5)*4,
          r: Math.min(iw/cols, ih/rows)*0.44, pop:0, s:r(),
        });
      }
    },
    hit(Ly, p){
      let any = false;
      for (const b of Ly.bs){
        if (!b.pop && dist(p, b) < b.r*1.25){
          b.pop = 1; any = true;
          Snd.pop(Ly.bs.filter(x=>x.pop).length); buzz(7);
        }
      }
      if (any) Ly.p = Ly.bs.filter(b=>b.pop).length / Ly.bs.length;
    },
    down(Ly, p){ this.hit(Ly, p); },
    move(Ly, p){ this.hit(Ly, p); },
    up(){},
    draw(ctx, Ly, box, t, active){
      ctx.save();
      for (const b of Ly.bs){
        if (b.pop){
          ctx.strokeStyle='rgba(215,228,232,.42)'; ctx.lineWidth=1.2;
          ctx.beginPath();
          ctx.moveTo(b.x - b.r*0.8, b.y);
          ctx.quadraticCurveTo(b.x, b.y + (b.s>0.5?5:-5), b.x + b.r*0.8, b.y);
          ctx.stroke();
        } else {
          const g = ctx.createRadialGradient(b.x - b.r*0.35, b.y - b.r*0.4, b.r*0.08, b.x, b.y, b.r);
          g.addColorStop(0,'rgba(255,255,255,.72)'); g.addColorStop(.6,'rgba(206,226,232,.36)');
          g.addColorStop(1,'rgba(150,180,190,.3)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
          ctx.strokeStyle = active ? `rgba(232,196,106,${0.28 + Math.sin(t*4 + b.s*6)*0.2})`
                                   : 'rgba(255,255,255,.2)';
          ctx.lineWidth = 1.2; ctx.stroke();
        }
      }
      ctx.restore();
    },
  },

  unwind: {
    hint: 'Wind the thread off — <i>drag in circles</i>',
    init(Ly, r, box){ Ly.c = {x:box.cx, y:box.cy}; Ly.turns = 2.5; Ly.sum = 0; Ly.last = null; Ly.blip = 0; Ly.coil = 0; },
    down(Ly, p){ Ly.last = Math.atan2(p.y - Ly.c.y, p.x - Ly.c.x); },
    move(Ly, p){
      if (dist(p, Ly.c) < 26) return;
      const a = Math.atan2(p.y - Ly.c.y, p.x - Ly.c.x);
      if (Ly.last === null){ Ly.last = a; return; }
      let d = a - Ly.last;
      while (d >  Math.PI) d -= TAU;
      while (d < -Math.PI) d += TAU;
      Ly.last = a; Ly.sum += d;
      Ly.p = clamp(Math.abs(Ly.sum) / (Ly.turns*TAU), 0, 1);
      if (Ly.p - Ly.blip > 0.07){ Ly.blip = Ly.p; Snd.thread(); buzz(3); }
    },
    up(Ly){ Ly.last = null; },
    tick(Ly, dt){ Ly.coil += (Ly.p - Ly.coil)*Math.min(1, dt*7); },
    draw(ctx, Ly, box, t, active){
      const N = 7, left = Math.ceil((1 - Ly.p)*N);
      ctx.save();
      ctx.strokeStyle = '#c2513f'; ctx.lineWidth = 3.4; ctx.lineCap='round';
      for (let i=0;i<left;i++){
        const u = (i + 0.5)/N;
        const yy = box.cy - box.h*0.42 + box.h*0.84*u;
        const ww = box.w*0.44*Math.sin(Math.PI*clamp(u, 0.14, 0.86));
        ctx.beginPath();
        ctx.moveTo(box.cx - ww, yy);
        ctx.quadraticCurveTo(box.cx, yy + (i%2 ? 9 : -9), box.cx + ww, yy);
        ctx.stroke();
      }
      // the coil it comes off onto
      if (Ly.coil > 0.01){
        const cxx = box.cx + box.w*0.62, cyy = box.cy + box.h*0.4;
        ctx.strokeStyle='#c2513f'; ctx.lineWidth=2.2;
        ctx.beginPath();
        for (let a=0; a<TAU*3*Ly.coil; a+=0.14){
          const rad = 3 + a*1.9;
          const px = cxx + Math.cos(a)*rad, py = cyy + Math.sin(a)*rad*0.6;
          a ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
        }
        ctx.stroke();
      }
      if (active && Ly.p < 1){
        const a = t*1.8, rad = box.w*0.5;
        ctx.strokeStyle = 'rgba(232,196,106,.55)'; ctx.lineWidth = 2;
        ctx.setLineDash([7,11]);
        ctx.beginPath(); ctx.arc(box.cx, box.cy, rad, a, a + 4.4); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle='rgba(232,196,106,.9)';
        ctx.beginPath(); ctx.arc(box.cx + Math.cos(a+4.4)*rad, box.cy + Math.sin(a+4.4)*rad, 4, 0, TAU); ctx.fill();
      }
      ctx.restore();
    },
  },

  squeeze: {
    hint: 'Press and <i>hold</i> until it gives',
    init(Ly){ Ly.f = 0; Ly.held = false; Ly.tick_ = 0; },
    down(Ly){ Ly.held = true; },
    move(){},
    up(Ly){ Ly.held = false; },
    tick(Ly, dt, input, active){
      if (Ly.f >= 1){ Ly.p = 1; return; }
      if (!active){ Ly.held = false; Ly.f = Math.max(0, Ly.f - dt*0.8); Ly.p = Ly.f; return; }
      // Real stylus pressure when we have it, hold-time everywhere else.
      const boost = (input.type === 'pen' && input.pressure > 0.05) ? 0.55 + input.pressure*1.1 : 1;
      if (Ly.held) Ly.f = clamp(Ly.f + dt/CFG.squeezeSeconds*boost, 0, 1);
      else         Ly.f = clamp(Ly.f - dt*0.8, 0, 1);
      Ly.p = Ly.f;
      Ly.tick_ += dt;
      if (Ly.held && Ly.tick_ > 0.1){ Ly.tick_ = 0; Snd.strain(Ly.f); }
      if (Ly.f >= 1 && !Ly.cracked){ Ly.cracked = true; Snd.crack(); buzz(30); }
    },
    draw(ctx, Ly, box, t, active){
      if (!active && Ly.p >= 1) return;
      const y = box.cy + box.h*0.62, w = box.w*0.5;
      ctx.save();
      ctx.fillStyle='rgba(12,20,24,.5)'; rr(ctx, box.cx - w/2, y, w, 7, 3.5); ctx.fill();
      const g = ctx.createLinearGradient(box.cx - w/2, 0, box.cx + w/2, 0);
      g.addColorStop(0,'#e8c46a'); g.addColorStop(1,'#e8886a');
      ctx.fillStyle = g; rr(ctx, box.cx - w/2, y, Math.max(2, w*Ly.f), 7, 3.5); ctx.fill();
      if (active && Ly.f < 1){
        // two rings contracting inward: "press here, and keep pressing"
        for (let i=0;i<2;i++){
          const u = ((t*0.7 + i*0.5) % 1);
          ctx.strokeStyle = `rgba(232,196,106,${(1-u)*(Ly.held ? 0.5 : 0.32)})`;
          ctx.lineWidth = 2.4;
          ctx.beginPath(); ctx.arc(box.cx, box.cy, box.w*(0.2 + 0.36*(1-u)), 0, TAU); ctx.stroke();
        }
      }
      ctx.restore();
    },
  },

  lift: {
    hint: 'Lift the lid — <i>drag upward</i>',
    init(Ly){ Ly.grab = false; Ly.base = 0; },
    down(Ly, p, box){ Ly.grab = p.y < box.cy + box.h*0.3; Ly.y0 = p.y; Ly.base = Ly.p; },
    move(Ly, p){
      if (!Ly.grab) return;
      const was = Ly.p;
      Ly.p = clamp(Ly.base + (Ly.y0 - p.y)/140, 0, 1);
      if (Ly.p > was + 0.08) Snd.rustle();
    },
    up(Ly){ Ly.grab = false; if (Ly.p < 1) Ly.p *= 0.5; },
    draw(ctx, Ly, box, t, active){
      if (!active || Ly.p >= 1) return;
      const pulse = Math.sin(t*4)*0.5 + 0.5;
      ctx.save();
      ctx.strokeStyle = `rgba(232,196,106,${0.3 + pulse*0.45})`; ctx.lineWidth = 2.4; ctx.lineCap='round';
      const ax = box.cx, ay = box.cy - box.h*0.56 - pulse*7;
      ctx.beginPath(); ctx.moveTo(ax, ay + 18); ctx.lineTo(ax, ay - 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ax - 7, ay); ctx.lineTo(ax, ay - 9); ctx.lineTo(ax + 7, ay); ctx.stroke();
      ctx.restore();
    },
  },
};

   CANVAS + LAYOUT
   ============================================================ */
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  W = Math.min(window.innerWidth, 480);
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (V.mode === 'unwrap') relayout();
}
function relayout(){
  const keep = V.layers.map(L => L.p);
  V.box = layoutBox();
  const r = mulberry32(4242);
  V.layers.forEach((L, i) => {
    GES[L.kind].init(L, r, V.box);
    L.p = keep[i];
    if (L.kind === 'pop'){ const n = Math.round(L.p*L.bs.length); L.bs.forEach((b,j) => b.pop = j < n ? 1 : 0); }
    if (L.kind === 'snip'){ const n = Math.round(L.p*L.cords.length); L.cords.forEach((c,j) => { c.cut = j<n?1:0; c.t=1; }); }
    if (L.kind === 'squeeze') L.f = L.p;
  });
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));

const KEY = 'parcel-petal-v1';
function fresh(){
  return { v:1, mail:CFG.startParcels, lastAccrual:Date.now(), pity:0, opened:0,
           sill:new Array(9).fill(null), book:{}, odd:{},
           streak:1, lastDay:today(), special:'', specialPending:false, seen:false };
}
let S = fresh();
try {
  const raw = localStorage.getItem(KEY);
  if (raw){ const o = JSON.parse(raw); if (o && o.v === 1) S = Object.assign(fresh(), o); }
} catch(e){}
let saveT = 0;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* scene state — deliberately not persisted */
const V = { screen:'table', mode:'idle', t:0, box:null, P:null, layers:[], genome:null, curio:null,
            special:false, bloom:0, shellA:1, shards:[], pollen:[], placing:false,
            bookScroll:0, drag:null, note:'', noteT:0, shake:0 };

/* ---------- derived ---------- */
function harmony(){
  let pairs = 0;
  for (let i=0;i<9;i++){
    const a = S.sill[i]; if (!a) continue;
    const ph = phenotype(a);
    const rightOf = (i%3 < 2) ? S.sill[i+1] : null;
    const below   = (i < 6)   ? S.sill[i+3] : null;
    for (const b of [rightOf, below]){
      if (!b) continue;
      const d = Math.abs(((ph.hue - phenotype(b).hue) % 360 + 540) % 360 - 180);
      if (d < 42) pairs++;
    }
  }
  return { pairs, mult: Math.min(CFG.harmonyCap, 1 + pairs*CFG.harmonyPerPair) };
}
function bookStats(){
  const sp = Object.keys(S.book).length;
  let cw = 0; for (const k in S.book) cw += Object.keys(S.book[k].v).length;
  return { sp, spAll: SPECIES.length, cw, cwAll: SPECIES.length*VARIANTS.length,
           odd: Object.keys(S.odd).length, oddAll: CURIOS.length };
}
function undiscovered(){ return SPECIES.filter(s => !S.book[s.id]); }

/* ---------- day rollover: streak wilts, it never resets ---------- */
function dayCheck(){
  const d = today();
  if (S.lastDay !== d){
    const y = new Date(Date.now() - 864e5).toISOString().slice(0,10);
    if (S.lastDay === y) S.streak++;
    else { const was = S.streak; S.streak = Math.max(1, Math.ceil(S.streak/2));
           if (was > S.streak) note('Your streak wilted a little. ' + S.streak + ' day' + (S.streak>1?'s':'') + ' left.'); }
    S.lastDay = d;
  }
  if (S.special !== d){
    S.special = d; S.specialPending = true;
    S.mail = Math.min(CFG.parcelCap + 2, S.mail + 1);
  }
}
/* ---------- parcels accrue while you are away, and then stop ---------- */
function accrue(){
  const iv = CFG.parcelIntervalMs / harmony().mult;
  const now = Date.now();
  if (S.mail >= CFG.parcelCap){ S.lastAccrual = now; return; }
  while (S.mail < CFG.parcelCap && now - S.lastAccrual >= iv){ S.mail++; S.lastAccrual += iv; }
}
function nextIn(){
  const iv = CFG.parcelIntervalMs / harmony().mult;
  return Math.max(0, iv - (Date.now() - S.lastAccrual));
}

/* ============================================================
   OPENING A PARCEL
   ============================================================ */
function layoutBox(){
  const s = Math.min(W*0.62, 236);
  return { cx: W/2, cy: H*0.5, w: s, h: s };
}
function openParcel(){
  if (S.mail <= 0) return;
  S.mail--;
  const r = mulberry32((Math.random()*1e9)|0);
  V.special = !!S.specialPending;
  S.specialPending = false;

  // heavier parcels are rarer but pay better
  let P;
  do { P = pick(r, PARCELS); } while (P.heavy && r() < 0.62);
  V.P = P;
  V.box = layoutBox();
  V.layers = P.layers.map(k => { const L = {kind:k, p:0}; GES[k].init(L, r, V.box); return L; });

  const und = undiscovered();
  if (V.special && und.length){
    V.curio = null;
    V.genome = makeGenome(r, { sp: pick(r, und).id, ra: r() < 0.55 ? 'rare' : 'uncommon' });
  } else if (r() < CFG.curioChance){
    V.curio = pick(r, CURIOS); V.genome = null;
  } else {
    V.curio = null;
    let forced = null;
    if (S.pity >= CFG.pityAt - 1) forced = r() < 0.2 ? 'legendary' : 'rare';
    else if (P.heavy) forced = r() < 0.34 ? 'rare' : 'uncommon';
    V.genome = makeGenome(r, forced ? { ra: forced } : {});
  }
  V.mode = 'unwrap'; V.bloom = 0; V.shellA = 1; V.shards = []; V.pollen = [];
  setScreen('table');
  updateHUD(); save();
}

function activeLayer(){ return V.layers.find(L => L.p < 1) || null; }

function completeParcel(){
  V.mode = 'bloom'; V.bloom = 0; V.shake = 9;
  Snd.whump();
  const tint = TINT[V.P.id] || '#ccc';
  for (let i=0;i<20;i++){
    const a = Math.random()*TAU, sp = 90 + Math.random()*260;
    V.shards.push({ x: V.box.cx + (Math.random()-0.5)*V.box.w*0.6,
                    y: V.box.cy + (Math.random()-0.5)*V.box.h*0.6,
                    vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 140,
                    rot: Math.random()*TAU, vr: (Math.random()-0.5)*9,
                    s: 6 + Math.random()*13, col: tint, life: 1 });
  }
  if (V.curio){
    S.odd[V.curio.id] = (S.odd[V.curio.id] || 0) + 1;
    Snd.chime('uncommon');
  } else {
    const g = V.genome, rar = g.ra;
    const b = S.book[g.sp] || (S.book[g.sp] = { g, v:{}, mu:{}, n:0 });
    V.isNewSpecies = b.n === 0;
    V.isNewVariant = !b.v[g.va];
    b.v[g.va] = (b.v[g.va] || 0) + 1;
    if (g.mu) b.mu[g.mu] = (b.mu[g.mu] || 0) + 1;
    b.n++; S.opened++;
    S.pity = (rar === 'rare' || rar === 'legendary') ? 0 : S.pity + 1;
    Snd.chime(rar);
    const ph = phenotype(g);
    for (let i=0;i<26;i++){
      const a = Math.random()*TAU, sp = 20 + Math.random()*70;
      V.pollen.push({ x: V.box.cx, y: V.box.cy, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 30,
                      r: 1.2 + Math.random()*2.6, life: 1, col: i%3 ? ph.cEdge : ph.cCen2 });
    }
  }
  save();
  setTimeout(showSheet, 820);
}
function showSheet(){
  if (V.curio){
    $('#shRar').textContent = 'ODDMENT';  $('#shRar').style.color = '#cfc4b4';
    $('#shName').textContent = V.curio.name;
    $('#shMu').textContent = '';
    $('#shPoem').textContent = V.curio.note;
    $('#bSill').style.display = 'none';
    $('#bBook').textContent = 'Into the book';
    $('#bBook').classList.add('hi');
  } else {
    const g = V.genome, ra = RA[g.ra];
    $('#shRar').textContent = (V.special ? 'SPECIAL DELIVERY · ' : '') + ra.name.toUpperCase();
    $('#shRar').style.color = ra.col;
    $('#shName').innerHTML = flowerName(g) + (V.isNewSpecies ? '<span class="new">NEW</span>'
                                              : V.isNewVariant ? '<span class="new">NEW HUE</span>' : '');
    $('#shMu').textContent = g.mu ? MUTATIONS.find(m=>m.id===g.mu).name : '';
    $('#shPoem').textContent = SP[g.sp].poem;
    $('#bSill').style.display = '';
    $('#bBook').textContent = 'Into the book';
    $('#bBook').classList.remove('hi');
  }
  elSheet.classList.add('up');
}
function hideSheet(){ elSheet.classList.remove('up'); }

$('#bBook').onclick = () => { hideSheet(); V.mode='idle'; V.genome=null; V.curio=null; updateHUD(); save(); };
$('#bSill').onclick = () => {
  hideSheet(); V.placing = true; setScreen('shelf');
  note(S.sill.includes(null) ? 'Tap an empty pot.' : 'The sill is full — tap one to swap it out.', 2600);
};
$('#bStart').onclick = () => {
  Snd.resume(); S.seen = true; save();
  $('#intro').classList.add('gone');
  setTimeout(() => $('#intro').remove(), 700);
  if (S.mail > 0) openParcel();
};
if (S.seen){ const i = $('#intro'); if (i) i.remove(); }

function placeAt(i){
  if (!V.placing || !V.genome) return;
  const old = S.sill[i];
  S.sill[i] = V.genome;
  V.placing = false; V.genome = null;
  Snd.press();
  const hm = harmony();
  note(old ? 'Swapped. The old one is pressed into the book.'
           : (hm.pairs ? 'Placed. ' + hm.pairs + ' matching pair' + (hm.pairs>1?'s':'') + ' — parcels arrive faster.'
                       : 'Placed.'), 2600);
  V.mode = 'idle';
  updateHUD(); save();
}

/* ============================================================
   INPUT
   ============================================================ */
const input = { down:false, p:{x:0,y:0}, prev:{x:0,y:0}, type:'mouse', pressure:0 };
function pos(e){
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
cv.addEventListener('pointerdown', e => {
  Snd.resume();
  const p = pos(e);
  input.down = true; input.p = p; input.prev = p;
  input.type = e.pointerType || 'mouse'; input.pressure = e.pressure || 0;
  try { cv.setPointerCapture(e.pointerId); } catch(err){}

  if (V.screen === 'table'){
    if (V.mode === 'idle'){ if (S.mail > 0) openParcel(); return; }
    if (V.mode === 'unwrap'){ const L = activeLayer(); if (L) GES[L.kind].down(L, p, V.box); return; }
    return;
  }
  if (V.screen === 'shelf'){
    const i = slotAt(p);
    if (i >= 0){
      if (V.placing) placeAt(i);
      else if (S.sill[i]) note(flowerName(S.sill[i]) + ' — ' + RA[S.sill[i].ra].name.toLowerCase(), 1900);
    }
    return;
  }
  if (V.screen === 'book'){ V.drag = p.y; V.drag0 = V.bookScroll; }
});
cv.addEventListener('pointermove', e => {
  const p = pos(e);
  input.pressure = e.pressure || 0;
  input.type = e.pointerType || input.type;
  if (!input.down){ input.prev = input.p; input.p = p; return; }
  if (V.screen === 'table' && V.mode === 'unwrap'){
    const L = activeLayer();
    if (L) GES[L.kind].move(L, p, input.p, V.box);
  } else if (V.screen === 'book' && V.drag !== null){
    V.bookScroll = V.drag0 - (p.y - V.drag);
  }
  input.prev = input.p; input.p = p;
});
function endPointer(e){
  if (!input.down) return;
  input.down = false;
  const L = (V.screen === 'table' && V.mode === 'unwrap') ? activeLayer() : null;
  if (L) GES[L.kind].up(L, input.p, V.box);
  V.drag = null;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('lostpointercapture', endPointer);
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { dayCheck(); accrue(); updateHUD(); } });

const F_SERIF = "'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif";
const F_SANS  = "ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
function txt(s, x, y, size, col, font = F_SANS, align='center', weight=''){
  ctx.font = (weight ? weight + ' ' : '') + size + 'px ' + font;
  ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
}

/* ============================================================
   BACKDROP
   ============================================================ */
function skyColors(){
  const h = new Date().getHours();
  if (h < 5)  return ['#0e1729','#1c2a3e','night'];
  if (h < 8)  return ['#3d4c6d','#cb8b7c','dawn'];
  if (h < 17) return ['#7ea8c4','#d3e2e7','day'];
  if (h < 20) return ['#c98a66','#5d6a8c','dusk'];
  return ['#141e38','#29304a','night'];
}
function drawBackdrop(kind){
  const [s1, s2, when] = skyColors();
  const wg = ctx.createLinearGradient(0, 0, 0, H);
  wg.addColorStop(0, '#31454f'); wg.addColorStop(0.55, '#26363f'); wg.addColorStop(1, '#1a2730');
  ctx.fillStyle = wg; ctx.fillRect(0, 0, W, H);

  // wallpaper stripes
  ctx.fillStyle = 'rgba(255,255,255,.016)';
  for (let x = 0; x < W; x += 26) ctx.fillRect(x, 0, 13, H);

  const wx = W*0.1, ww = W*0.8, wy = kind === 'shelf' ? H*0.155 : H*0.08,
        wh = kind === 'shelf' ? H*0.58 : H*0.36;
  // window frame
  ctx.fillStyle = '#7b6549'; rr(ctx, wx - 9, wy - 9, ww + 18, wh + 18, 7); ctx.fill();
  const sg = ctx.createLinearGradient(0, wy, 0, wy + wh);
  sg.addColorStop(0, s1); sg.addColorStop(1, s2);
  ctx.fillStyle = sg; ctx.fillRect(wx, wy, ww, wh);
  ctx.save(); ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
  if (when === 'night'){
    const r = mulberry32(99);
    for (let i=0;i<34;i++){
      const x = wx + r()*ww, y = wy + r()*wh*0.8, tw = 0.45 + 0.55*Math.abs(Math.sin(V.t*0.8 + i));
      ctx.fillStyle = `rgba(255,252,235,${tw*0.8})`;
      ctx.beginPath(); ctx.arc(x, y, 0.7 + r()*0.9, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,250,230,.85)';
    ctx.beginPath(); ctx.arc(wx + ww*0.72, wy + wh*0.2, ww*0.05, 0, TAU); ctx.fill();
  } else {
    for (let i=0;i<3;i++){
      const cx2 = wx + ((V.t*(5 + i*3) + i*ww*0.5) % (ww + 140)) - 70;
      const cy2 = wy + wh*(0.18 + i*0.17);
      ctx.fillStyle = 'rgba(255,255,255,.16)';
      ctx.beginPath();
      ctx.arc(cx2, cy2, ww*0.07, 0, TAU);
      ctx.arc(cx2 + ww*0.06, cy2 + 3, ww*0.05, 0, TAU);
      ctx.arc(cx2 - ww*0.06, cy2 + 4, ww*0.045, 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();
  // mullions
  ctx.strokeStyle = '#7b6549'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(wx + ww/2, wy); ctx.lineTo(wx + ww/2, wy + wh); ctx.stroke();
  if (kind !== 'shelf'){ ctx.beginPath(); ctx.moveTo(wx, wy + wh/2); ctx.lineTo(wx + ww, wy + wh/2); ctx.stroke(); }

  if (kind === 'table'){
    // sill
    ctx.fillStyle = '#8b7150'; rr(ctx, wx - 20, wy + wh + 8, ww + 40, 13, 3); ctx.fill();
    // table, lit from the window
    const tg = ctx.createLinearGradient(0, H*0.6, 0, H);
    tg.addColorStop(0, '#6d4b2c'); tg.addColorStop(1, '#3d2817');
    ctx.fillStyle = tg; ctx.fillRect(0, H*0.62, W, H*0.38);
    ctx.fillStyle = 'rgba(255,238,200,.05)';
    ctx.beginPath(); ctx.moveTo(W*0.1, H*0.62); ctx.lineTo(W*0.9, H*0.62);
    ctx.lineTo(W, H); ctx.lineTo(-W*0.1, H); ctx.closePath(); ctx.fill();
  }
  // vignette
  const vg = ctx.createRadialGradient(W/2, H*0.42, H*0.18, W/2, H*0.5, H*0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

/* ============================================================
   TABLE SCREEN
   ============================================================ */
function drawTable(){
  drawBackdrop('table');

  if (V.mode === 'idle'){
    if (S.mail > 0){
      // up to three, laid out so each silhouette stays readable; the rest are counted
      const n = Math.min(S.mail, 3);
      const spots = [ {dx:-58, dy:-10, s:74}, {dx: 58, dy: -7, s:76}, {dx:  0, dy: 10, s:92} ];
      const order = n === 1 ? [2] : n === 2 ? [0, 2] : [0, 1, 2];
      order.forEach((sl, i) => {
        const P = PARCELS[(i*3 + 2) % PARCELS.length];
        const o = spots[sl];
        drawBody(ctx, P, { cx: W/2 + o.dx, cy: H*0.7 + o.dy, w: o.s, h: o.s }, {}, V.t);
      });
      if (S.specialPending){
        const bx = W/2 + 66, by = H*0.62;
        ctx.save(); ctx.translate(bx, by); ctx.rotate(-0.2);
        ctx.fillStyle = '#e8c46a'; rr(ctx, -30, -9, 60, 18, 4); ctx.fill();
        txt('SPECIAL', 0, 5, 9, '#3a2c10', F_SANS, 'center', '700');
        ctx.restore();
      }
      txt(S.mail + (S.mail === 1 ? ' parcel' : ' parcels') + ' on the table', W/2, H*0.83, 15, '#e5dccb', F_SERIF);
      hint('Tap to open');
    } else {
      const ms = nextIn(), iv = CFG.parcelIntervalMs / harmony().mult;
      const p = 1 - ms/iv, R = 40;
      ctx.save(); ctx.translate(W/2, H*0.63);
      ctx.strokeStyle = 'rgba(246,239,226,.14)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.stroke();
      ctx.strokeStyle = '#e8c46a'; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 0, R, -Math.PI/2, -Math.PI/2 + TAU*clamp(p,0,1)); ctx.stroke();
      const m = Math.floor(ms/60000), sc = Math.floor(ms/1000) % 60;
      txt(m + ':' + String(sc).padStart(2,'0'), 0, 5, 15, '#e5dccb', F_SERIF);
      ctx.restore();
      txt('An empty table.', W/2, H*0.8, 15, '#bdb3a3', F_SERIF);
      hint('The next parcel is on its way.');
    }
    return;
  }

  const box = V.box;
  if (V.mode === 'unwrap'){
    const L = activeLayer();
    const sq = V.layers.find(l => l.kind === 'squeeze' && l === L);
    const lf = V.layers.find(l => l.kind === 'lift');
    drawBody(ctx, V.P, box, { squeeze: sq ? sq.f : 0, lidLift: lf ? lf.p : 0, shake: V.shake }, V.t);
    for (let i = V.layers.length - 1; i >= 0; i--){
      const l = V.layers[i];
      if (l.p <= 0 && l !== L) continue;          // don't show wrapping you haven't reached
      GES[l.kind].draw(ctx, l, box, V.t, l === L);
    }
    txt(V.P.name, W/2, H*0.79, 14, 'rgba(229,220,203,.75)', F_SERIF);
    const step = V.layers.filter(l => l.p >= 1).length + 1;
    hint((V.layers.length > 1 ? step + '/' + V.layers.length + ' &nbsp;·&nbsp; ' : '') + (L ? GES[L.kind].hint : ''));
    return;
  }

  // bloom
  if (V.shellA > 0.01) drawBody(ctx, V.P, box, { alpha: V.shellA, shake: V.shake }, V.t);
  for (const s of V.shards){
    ctx.save(); ctx.globalAlpha = clamp(s.life, 0, 1);
    ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.fillStyle = s.col;
    ctx.beginPath(); ctx.moveTo(-s.s/2, s.s/2); ctx.lineTo(s.s/2, s.s*0.2); ctx.lineTo(0, -s.s/2);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  const e = 1 - Math.pow(1 - V.bloom, 3);
  if (V.curio){
    drawCurio(ctx, V.curio.id, box.cx, box.cy, 46*e);
  } else {
    const ph = phenotype(V.genome);
    const R = Math.min(W*0.245, 96);
    drawFlower(ctx, ph, box.cx, box.cy - H*0.02, R*(0.25 + 0.75*e), V.bloom, V.t,
               { stemLen: Math.min(R*2.6, H*0.2) });
    if (V.genome.ra === 'legendary' || V.genome.ra === 'rare'){
      ctx.save();
      for (let i=0;i<7;i++){
        const a = V.t*0.6 + i/7*TAU, rad = R*(1.35 + Math.sin(V.t*2 + i)*0.1);
        ctx.fillStyle = `rgba(255,246,214,${0.2 + Math.sin(V.t*3 + i)*0.18})`;
        ctx.beginPath(); ctx.arc(box.cx + Math.cos(a)*rad, box.cy - H*0.02 + Math.sin(a)*rad*0.8, 2.4, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  }
  for (const p of V.pollen){
    ctx.globalAlpha = clamp(p.life, 0, 1)*0.9;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  hint('');
}

/* ============================================================
   SILL SCREEN
   ============================================================ */
function shelfGeom(){
  return { x0: W*0.22, dx: W*0.28, y0: H*0.37, dy: H*0.17,
           slot(i){ return { x: this.x0 + this.dx*(i%3), y: this.y0 + this.dy*Math.floor(i/3) }; } };
}
function slotAt(p){
  const g = shelfGeom();
  for (let i=0;i<9;i++){
    const s = g.slot(i);
    if (Math.abs(p.x - s.x) < g.dx*0.46 && p.y > s.y - g.dy*0.62 && p.y < s.y + g.dy*0.22) return i;
  }
  return -1;
}
function drawShelf(){
  drawBackdrop('shelf');
  const g = shelfGeom(), hm = harmony();

  for (let row=0; row<3; row++){
    const y = g.y0 + g.dy*row + 6;
    ctx.fillStyle = '#8b7150'; rr(ctx, W*0.06, y, W*0.88, 9, 3); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(W*0.06, y + 9, W*0.88, 4);
  }
  // pots that are part of a matching pair get a warm rim — clearer than
  // drawing link lines, which had to cross the shelf planks to connect rows
  const matched = new Set();
  for (let i=0;i<9;i++){
    const a = S.sill[i]; if (!a) continue;
    const ha = phenotype(a).hue;
    for (const j of [(i%3<2)?i+1:-1, (i<6)?i+3:-1]){
      if (j < 0 || !S.sill[j]) continue;
      const d = Math.abs(((ha - phenotype(S.sill[j]).hue) % 360 + 540) % 360 - 180);
      if (d < 42){ matched.add(i); matched.add(j); }
    }
  }

  for (let i=0;i<9;i++){
    const s = g.slot(i), fl = S.sill[i];
    if (fl){
      const ph = phenotype(fl);
      const R = Math.min(g.dx*0.3, 25);
      drawFlower(ctx, ph, s.x, s.y - g.dy*0.5, R, 1, V.t + i, { stemLen: g.dy*0.46, sway: 0.6 });
      if (matched.has(i)){
        ctx.save(); ctx.shadowColor = 'rgba(232,196,106,.9)'; ctx.shadowBlur = 12;
        ctx.strokeStyle = 'rgba(232,196,106,.75)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(s.x - 14, s.y - 10); ctx.lineTo(s.x + 14, s.y - 10);
        ctx.lineTo(s.x + 10, s.y + 7); ctx.lineTo(s.x - 10, s.y + 7); ctx.closePath();
        ctx.stroke(); ctx.restore();
      }
      ctx.fillStyle = '#9d6f4a';
      ctx.beginPath(); ctx.moveTo(s.x - 13, s.y - 10); ctx.lineTo(s.x + 13, s.y - 10);
      ctx.lineTo(s.x + 9, s.y + 6); ctx.lineTo(s.x - 9, s.y + 6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(s.x - 13, s.y - 10, 26, 4);
    } else {
      ctx.strokeStyle = V.placing ? `rgba(232,196,106,${0.55 + Math.sin(V.t*4 + i)*0.3})` : 'rgba(70,58,44,.38)';
      ctx.lineWidth = 1.6; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(s.x - 13, s.y - 10); ctx.lineTo(s.x + 13, s.y - 10);
      ctx.lineTo(s.x + 9, s.y + 6); ctx.lineTo(s.x - 9, s.y + 6); ctx.closePath(); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  // the flower waiting in your hand
  if (V.placing && V.genome){
    const ph = phenotype(V.genome);
    drawFlower(ctx, ph, W/2, H*0.9, 26, 1, V.t, { stem:false });
    hint('Tap a pot to place the <i>' + flowerName(V.genome) + '</i>');
  } else {
    hint(hm.pairs
      ? hm.pairs + ' matching pair' + (hm.pairs>1?'s':'') + ' &nbsp;·&nbsp; parcels arrive <i>×' + hm.mult.toFixed(2) + '</i> faster'
      : 'Neighbouring flowers in similar hues make parcels arrive faster.');
  }
  txt('The Windowsill', W/2, H*0.125, 17, '#e5dccb', F_SERIF);
}

/* ============================================================
   HERBARIUM SCREEN
   ============================================================ */
function drawBook(){
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2b2a26'); bg.addColorStop(1,'#1b1a17');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  const st = bookStats();
  const top = H*0.14, cw = (W - 30)/3, ch = 126;
  const rows = Math.ceil(SPECIES.length/3);
  const contentH = rows*ch + 150;
  const maxScroll = Math.max(0, contentH - (H - top) + 60);
  V.bookScroll = clamp(V.bookScroll, 0, maxScroll);
  const sc = V.bookScroll;

  ctx.save();
  ctx.beginPath(); ctx.rect(0, top - 14, W, H - top + 14); ctx.clip();

  SPECIES.forEach((sp, i) => {
    const x = 15 + cw*(i%3), y = top + ch*Math.floor(i/3) - sc;
    if (y > H + 40 || y < top - ch - 40) return;
    const b = S.book[sp.id];
    ctx.fillStyle = 'rgba(246,239,226,.035)'; rr(ctx, x+3, y, cw-6, ch-10, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(246,239,226,.09)'; ctx.lineWidth = 1; ctx.stroke();
    if (b){
      drawFlower(ctx, phenotype(b.g), x + cw/2, y + 44, Math.min(cw*0.3, 24), 1, V.t + i*0.7, { stem:false, sway:0.4 });
      txt(sp.name, x + cw/2, y + 82, 10.5, '#e5dccb', F_SERIF);
      txt('×' + b.n, x + cw/2, y + 95, 9, 'rgba(229,220,203,.45)');
      VARIANTS.forEach((v, j) => {
        const dx = x + cw/2 + (j - 2)*10;
        ctx.beginPath(); ctx.arc(dx, y + 108, 3.1, 0, TAU);
        ctx.fillStyle = b.v[v.id]
          ? hsl(blendHue(lerp(sp.hue[0], sp.hue[1], .5), v.target, v.mix), clamp(54 + v.ds, 12, 92), clamp(62 + v.dl*0.5, 28, 88))
          : 'rgba(246,239,226,.14)';
        ctx.fill();
      });
    } else {
      ctx.fillStyle = 'rgba(246,239,226,.055)';
      ctx.beginPath(); ctx.arc(x + cw/2, y + 44, Math.min(cw*0.26, 22), 0, TAU); ctx.fill();
      txt('?', x + cw/2, y + 51, 20, 'rgba(246,239,226,.2)', F_SERIF);
      txt('— — —', x + cw/2, y + 82, 10.5, 'rgba(246,239,226,.22)', F_SERIF);
    }
  });

  // oddments
  const oy = top + rows*ch - sc + 14;
  txt('Oddments', W/2, oy, 13, 'rgba(229,220,203,.6)', F_SERIF);
  CURIOS.forEach((c, i) => {
    const x = 15 + (W-30)*(i + 0.5)/CURIOS.length, y = oy + 40;
    if (S.odd[c.id]){
      drawCurio(ctx, c.id, x, y, Math.min((W-30)/CURIOS.length*0.32, 15));
    } else {
      ctx.fillStyle = 'rgba(246,239,226,.05)';
      ctx.beginPath(); ctx.arc(x, y, 13, 0, TAU); ctx.fill();
    }
  });
  ctx.restore();

  // header sits above the clip
  const hg = ctx.createLinearGradient(0,0,0,top);
  hg.addColorStop(0,'#2b2a26'); hg.addColorStop(1,'rgba(43,42,38,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, W, top);
  txt('The Herbarium', W/2, H*0.085, 17, '#e5dccb', F_SERIF);
  txt(st.sp + '/' + st.spAll + ' species  ·  ' + st.cw + '/' + st.cwAll + ' colourways  ·  ' +
      st.odd + '/' + st.oddAll + ' oddments', W/2, H*0.115, 10.5, 'rgba(229,220,203,.5)');
  hint(st.sp < st.spAll ? (st.spAll - st.sp) + ' species still unaccounted for.'
                        : 'Every species accounted for. The colourways, though…');
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = 0, accT = 0;
function frame(ts){
  const dt = Math.min(0.05, last ? (ts - last)/1000 : 0);
  last = ts; V.t += dt;

  if (V.screen === 'table' && V.mode === 'unwrap'){
    const L = activeLayer();
    for (const l of V.layers){
      const G = GES[l.kind];
      if (G.tick) G.tick(l, dt, input, l === L);
    }
    if (!activeLayer()) completeParcel();
  }
  if (V.mode === 'bloom'){
    V.bloom = Math.min(1, V.bloom + dt*1.6);
    V.shellA = Math.max(0, V.shellA - dt*3.4);
  }
  V.shake = Math.max(0, V.shake - dt*36);

  for (let i = V.shards.length - 1; i >= 0; i--){
    const s = V.shards[i];
    s.vy += 900*dt; s.x += s.vx*dt; s.y += s.vy*dt; s.rot += s.vr*dt; s.life -= dt*0.9;
    if (s.life <= 0 || s.y > H + 60) V.shards.splice(i, 1);
  }
  for (let i = V.pollen.length - 1; i >= 0; i--){
    const p = V.pollen[i];
    p.vy += 42*dt; p.vx *= 0.99; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*0.42;
    if (p.life <= 0) V.pollen.splice(i, 1);
  }

  accT += dt;
  if (accT > 0.5){
    accT = 0;
    const before = S.mail;
    dayCheck(); accrue();
    updateHUD();
    if (S.mail !== before) save();
  }
  if (V.noteT > 0){ V.noteT -= dt; if (V.noteT <= 0) elToast.style.opacity = 0; }
  saveT += dt; if (saveT > 8){ saveT = 0; save(); }

  if (V.screen === 'table') drawTable();
  else if (V.screen === 'shelf') drawShelf();
  else drawBook();

  requestAnimationFrame(frame);
}

/* ---------- dev surface: tune numbers live from the console ---------- */
window.PP = { S, V, CFG, GES, SPECIES, VARIANTS, RARITY, CURIOS,
              save, openParcel, phenotype, harmony, bookStats,
              drawFlower, makeGenome, mulberry32, ctx, get W(){return W}, get H(){return H},
              reset(){ localStorage.removeItem(KEY); location.reload(); } };

/* ---------- go ---------- */
resize();
dayCheck();
accrue();
updateHUD();
requestAnimationFrame(frame);
</script>
